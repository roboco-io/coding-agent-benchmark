<style>
:root{
  --ground:#EDF0F4; --surface:#FBFCFE; --sunk:#E4E8EE;
  --ink:#131A24; --ink-2:#3C4757; --muted:#5B6879; --faint:#8B97A6;
  --line:#DCE2EA; --hair:#E9EDF2; --track:#DFE4EB;
  --native:#3E63DD; --direct:#0E9384; --codex:#C4551A; --pi:#8E4EC6; --agy:#C2185B;
  --flag:#8A6A1E; --flag-bg:#F4EEDD;
  --focus:#3E63DD;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0E1116; --surface:#14181F; --sunk:#191E26;
  --ink:#E3E9F1; --ink-2:#B8C2CF; --muted:#8C97A7; --faint:#6B7686;
  --line:#252C36; --hair:#1E242C; --track:#252C36;
  --native:#6E8BF5; --direct:#1FA189; --codex:#D0722F; --pi:#B084E8; --agy:#E8679A;
  --flag:#C9A85C; --flag-bg:#221E14;
  --focus:#6E8BF5;
}}
:root[data-theme="dark"]{
  --ground:#0E1116; --surface:#14181F; --sunk:#191E26;
  --ink:#E3E9F1; --ink-2:#B8C2CF; --muted:#8C97A7; --faint:#6B7686;
  --line:#252C36; --hair:#1E242C; --track:#252C36;
  --native:#6E8BF5; --direct:#1FA189; --codex:#D0722F; --pi:#B084E8; --agy:#E8679A;
  --flag:#C9A85C; --flag-bg:#221E14;
  --focus:#6E8BF5;
}

*{box-sizing:border-box}
body{
  background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-weight:400; line-height:1.6; letter-spacing:-.005em;
  margin:0; padding-block:clamp(28px,5vw,56px); padding-left:20px; padding-right:20px;
}
html[lang="ja"] body{font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",-apple-system,BlinkMacSystemFont,sans-serif; letter-spacing:0;}
html[lang="zh-CN"] body{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,sans-serif; letter-spacing:0;}
html[lang="en"] body{font-family:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
.wrap{max-width:1120px; margin:0 auto; display:flex; flex-direction:column; gap:clamp(28px,4vw,44px);}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; font-variant-numeric:tabular-nums;}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:.68rem; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); margin:0;}
a{color:var(--native); text-underline-offset:3px; text-decoration-thickness:1px;}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:2px;}

/* ── header ───────────────────────────── */
header{display:flex; flex-direction:column; gap:14px;}
.topbar{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; justify-content:space-between;}
.langs{display:inline-flex; border:1px solid var(--line); border-radius:2px; overflow:hidden; background:var(--sunk);}
.langs button{font:inherit; font-size:.74rem; font-weight:500; padding:5px 11px; border:none; background:transparent; color:var(--muted); cursor:pointer; white-space:nowrap;}
.langs button[aria-pressed="true"]{background:var(--ink); color:var(--surface);}
h1{font-size:clamp(1.6rem,4.4vw,2.3rem); font-weight:700; letter-spacing:-.03em; margin:0; text-wrap:balance; line-height:1.2;}
html[lang="ja"] h1, html[lang="zh-CN"] h1{letter-spacing:-.01em;}
.deck{color:var(--ink-2); margin:0; font-size:.95rem; max-width:64ch;}
.deck b{font-weight:600; color:var(--ink);}
.repo{display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; max-width:78ch;
  border-left:3px solid var(--native); padding:4px 0 4px 14px;}
.repo p{margin:0; flex:1 1 320px; font-size:.88rem; color:var(--ink-2);}
.repo p b{color:var(--ink); font-weight:600;}
.repo-link{flex:none; font-size:.84rem; font-weight:600; text-decoration:none; border:1px solid var(--native);
  padding:6px 12px; border-radius:2px; white-space:nowrap;}
.repo-link:hover{background:var(--native); color:var(--surface);}
.flagnote{display:flex; gap:10px; align-items:flex-start; font-size:.82rem; color:var(--ink-2);
  background:var(--flag-bg); border:1px solid color-mix(in srgb,var(--flag) 26%,transparent);
  padding:11px 14px; border-radius:2px; max-width:78ch;}
.flagnote::before{content:"⚑"; color:var(--flag); font-size:.9rem; line-height:1.5;}


/* ── panel ────────────────────────────── */
.panel{background:var(--surface); border:1px solid var(--line); border-radius:3px; padding:clamp(18px,3vw,26px);}
.panel-head{display:flex; flex-wrap:wrap; gap:12px 20px; align-items:flex-end; justify-content:space-between; margin-bottom:6px;}
h2{font-size:1.12rem; font-weight:600; letter-spacing:-.02em; margin:0;}
.sub{color:var(--muted); font-size:.82rem; margin:6px 0 0; max-width:76ch;}

/* ── controls ─────────────────────────── */
.controls{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:18px 0 12px;}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:2px; overflow:hidden; background:var(--sunk);}
.seg button{font:inherit; font-size:.78rem; font-weight:500; padding:6px 15px; border:none; background:transparent; color:var(--muted); cursor:pointer;}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--surface);}
.hint{font-size:.74rem; color:var(--faint);}
.legend{display:flex; flex-wrap:wrap; gap:8px 16px; font-size:.74rem; color:var(--muted); align-items:center;}
.legend i{display:inline-block; width:10px; height:10px; border-radius:1px; margin-right:6px; vertical-align:-1px;}
.legend i.out{background:transparent; border:1.5px solid var(--muted);}

/* ── matrix ───────────────────────────── */
.scroller{overflow-x:auto; margin-top:4px;}
table.mx{border-collapse:collapse; width:100%; min-width:960px;}
table.mx th{text-align:left; vertical-align:bottom; padding:0 12px 8px 0; border-bottom:1px solid var(--line);}
table.mx th button{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:.68rem; letter-spacing:.12em; text-transform:uppercase;
  color:var(--muted); background:none; border:none; padding:0; cursor:pointer; display:inline-flex; gap:5px; align-items:center;}
html[lang="ja"] table.mx th button, html[lang="zh-CN"] table.mx th button, html[lang="ko"] table.mx th button{font-family:inherit; letter-spacing:.04em; font-size:.72rem;}
table.mx th button:hover{color:var(--ink);}
table.mx th button .dir{font-size:.7rem; opacity:0; }
table.mx th[aria-sort] button{color:var(--ink); font-weight:600;}
table.mx th[aria-sort] button .dir{opacity:1;}
.scale{margin-top:7px; height:11px; position:relative; overflow:hidden; font-family:"IBM Plex Mono",monospace; font-size:.6rem; color:var(--faint); letter-spacing:0; font-weight:400; text-transform:none;}
.scale span{position:absolute; top:0; transform:translateX(-50%); white-space:nowrap;}
.scale span:first-child{transform:none;}
.scale span:last-child{transform:translateX(-100%);}
.scale span:only-child{transform:none;}
table.mx td{padding:11px 12px 11px 0; border-bottom:1px solid var(--hair); vertical-align:middle;}
table.mx tbody tr:hover{background:var(--sunk);}
table.mx tbody tr.dim td{opacity:.42;}

.mdl{display:flex; flex-direction:column; gap:3px; min-width:140px;}
.mdl .nm{font-weight:600; font-size:.92rem; letter-spacing:-.01em; display:flex; align-items:center; gap:7px;}
.swatch{width:9px; height:9px; border-radius:1px; flex:none;}
.mdl .st{font-family:"IBM Plex Mono",monospace; font-size:.66rem; color:var(--muted); letter-spacing:.02em; padding-left:16px;}
.agt{display:flex; flex-direction:column; gap:3px; min-width:100px;}
.agt .an{font-weight:500; font-size:.84rem; white-space:nowrap;}
.agt .av{font-family:"IBM Plex Mono",monospace; font-size:.64rem; color:var(--muted); letter-spacing:.02em; white-space:normal; max-width:118px; opacity:.85;}
.agt .ac{font-family:"IBM Plex Mono",monospace; font-size:.66rem; color:var(--muted); letter-spacing:.02em; white-space:normal;}
.pv{font-family:"IBM Plex Mono",monospace; font-size:.6rem; letter-spacing:.06em; color:var(--flag);
  border:1px solid color-mix(in srgb,var(--flag) 40%,transparent); border-radius:2px; padding:0 4px; white-space:nowrap;}
.done{font-family:"IBM Plex Mono",monospace; font-size:.8rem; white-space:nowrap;}
.done small{display:block; font-size:.64rem; color:var(--muted); letter-spacing:.02em; font-family:"IBM Plex Mono",monospace;}

.cell{display:flex; flex-direction:column; gap:5px; min-width:92px;}
/* ── matrix accordion ─────────────────── */
table.mx tbody tr.row{cursor:pointer;}
table.mx tbody tr.row.open{background:var(--sunk);}
table.mx tbody tr.row.open td{border-bottom-color:transparent;}
.xp{font:inherit; background:none; border:none; padding:0; margin:0; color:inherit; cursor:pointer; display:inline-flex; align-items:center; gap:7px; text-align:left;}
.xp .chev{display:inline-block; width:0; height:0; border-style:solid; border-width:4px 0 4px 6px; border-color:transparent transparent transparent var(--muted); transition:transform .15s; flex:none;}
.xp[aria-expanded="true"] .chev{transform:rotate(90deg);}
.xp:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
table.mx tbody tr.dt > td{padding:0 0 18px; background:var(--sunk); border-bottom:1px solid var(--line);}
table.mx tbody tr.dt:hover{background:none;}
.dtwrap{position:sticky; left:0; padding:4px 16px 0; display:flex; flex-direction:column; gap:14px; cursor:auto;}
.xb{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:12px 14px;}
.xb-h{display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 12px; margin-bottom:8px;}
.xb-h b{font-family:"IBM Plex Mono",monospace; font-size:.8rem;}
.xb-h .nmx{font-size:.84rem; color:var(--ink-2);}
.xb-h .cl{font-family:"IBM Plex Mono",monospace; font-size:.68rem; color:var(--ink-2);}
.xb-h .dtd{font-family:"IBM Plex Mono",monospace; font-size:.68rem; color:var(--muted);}
.xb-h a{font-size:.74rem; color:var(--focus); margin-left:auto;}
.vd{font-size:.68rem; font-weight:600; padding:1px 7px; border-radius:2px; background:color-mix(in srgb,var(--direct) 16%,transparent); color:var(--direct); white-space:nowrap;}
.xb details{border:none; border-top:1px solid var(--hair); border-radius:0; background:none; margin:0;}
.xb details:first-of-type{border-top:none;}
.xb details + details{margin-top:0;}
.xb summary{cursor:pointer; padding:7px 0; font-size:.8rem; font-weight:600; color:var(--ink-2); letter-spacing:0; list-style:none; display:flex; gap:8px; align-items:baseline;}
.xb summary::-webkit-details-marker{display:none;}
.xb summary::before{content:"+"; font-family:"IBM Plex Mono",monospace; color:var(--faint); font-weight:400;}
.xb details[open] > summary::before{content:"–";}
.xb summary:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
.xc{padding:0 0 10px 15px; font-size:.8rem; line-height:1.55; color:var(--ink-2);}
.xc p{margin:0 0 6px;}
.xc ul{margin:0; padding-left:18px;}
.xc li{margin:2px 0;}
.xc code{font-family:"IBM Plex Mono",monospace; font-size:.74rem; background:var(--sunk); padding:0 3px; border-radius:2px;}
.xc .lbl{font-size:.68rem; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-right:6px;}
.xt{overflow-x:auto;}
.xt table{border-collapse:collapse; font-family:"IBM Plex Mono",monospace; font-size:.72rem; min-width:100%;}
table.mx .xt th, table.mx .xt td{padding:4px 14px 4px 0; vertical-align:baseline; opacity:1; text-align:right; white-space:nowrap; border-bottom:1px solid var(--hair);}
table.mx .xt th{color:var(--muted); font-weight:500; font-size:.66rem;}
table.mx .xt th:first-child, table.mx .xt td:first-child{text-align:left;}
table.mx .xt tbody tr:hover{background:none;}
.xnote{font-size:.68rem; color:var(--muted); margin:6px 0 0;}
dl.kv{display:grid; grid-template-columns:max-content 1fr; gap:3px 14px; margin:0;}
dl.kv dt{color:var(--muted); font-size:.74rem;}
dl.kv dd{margin:0;}
@media (max-width:640px){ dl.kv{grid-template-columns:1fr;} dl.kv dd{margin-bottom:5px;} .xb-h a{margin-left:0;} }

.bar{position:relative; height:13px; background:var(--track); border-radius:1px;}
.bar .rng{position:absolute; top:0; height:13px; border-radius:1px; min-width:3px;}
.bar .rng.out{background:transparent!important; border:1.5px solid currentColor;}
.bar .med{position:absolute; top:-2px; width:2px; height:17px; background:var(--ink); border-radius:1px;}
.bar .pt{position:absolute; top:1px; width:11px; height:11px; border-radius:50%; transform:translateX(-5.5px);}
.figs{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-size:.76rem; white-space:normal; letter-spacing:-.01em;}
.figs em{font-style:normal; font-weight:600;}
.figs em, .figs small{white-space:nowrap;}
.figs small{color:var(--muted); font-size:.92em;}
.na{font-family:"IBM Plex Mono",monospace; font-size:.75rem; color:var(--faint);}

.dots{display:flex; gap:2px; align-items:center;}
.cell.cm{min-width:66px; max-width:76px;}
table.mx th.cm-h button{white-space:normal; text-align:left; max-width:64px; letter-spacing:.02em;}
.cell.cm .figs{white-space:normal; line-height:1.35;}
.cell.cm .figs small, .cell.cm .figs em{white-space:normal;}
.dots i{width:6px; height:6px; border-radius:50%; background:var(--track); flex:none;}
.dots i.on{background:currentColor;}

.callout{margin-top:20px; display:grid; grid-template-columns:auto 1fr; gap:14px; align-items:start;
  border-top:2px solid var(--ink); padding-top:14px;}
.callout .eyebrow{white-space:nowrap; padding-top:3px;}
.callout p{margin:0; font-size:.87rem; color:var(--ink-2); max-width:80ch;}
.callout p b{color:var(--ink); font-weight:600;}
.callout p + p{margin-top:8px;}
p.fn{font-size:.78rem; color:var(--muted); margin:10px 0 0; max-width:90ch;}
.howlist{margin:0; padding-left:18px; display:flex; flex-direction:column; gap:8px; max-width:80ch;}
.howlist li{font-size:.87rem; color:var(--ink-2); line-height:1.6;}
.howlist li b{color:var(--ink); font-weight:600;}

/* ── cards ────────────────────────────── */
.cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(310px,1fr)); gap:14px;}
.card{background:var(--surface); border:1px solid var(--line); border-radius:3px; padding:18px 20px 20px; display:flex; flex-direction:column; gap:9px;}
.card h3{margin:0; font-size:.98rem; font-weight:600; letter-spacing:-.015em; display:flex; align-items:center; gap:7px; flex-wrap:wrap;}
.card .exp{font-family:"IBM Plex Mono",monospace; font-size:.66rem; color:var(--faint); letter-spacing:.04em; margin:0;}
.card ul{margin:0; padding-left:15px; display:flex; flex-direction:column; gap:6px;}
.card li{font-size:.83rem; color:var(--ink-2); line-height:1.55;}
.card li b{color:var(--ink); font-weight:600;}
.card .cav{margin:2px 0 0; font-size:.73rem; color:var(--muted); padding-top:9px; border-top:1px dotted var(--line);}

/* ── drawers ──────────────────────────── */
details{background:var(--surface); border:1px solid var(--line); border-radius:3px;}
details + details{margin-top:10px;}
summary{cursor:pointer; padding:15px 20px; font-weight:600; font-size:.92rem; letter-spacing:-.015em; display:flex; gap:10px; align-items:baseline; list-style:none;}
summary::-webkit-details-marker{display:none}
summary::before{content:"+"; font-family:"IBM Plex Mono",monospace; color:var(--faint); font-weight:400;}
details[open] summary::before{content:"–";}
summary small{font-weight:400; color:var(--muted); font-size:.76rem;}
.body{padding:0 20px 20px; display:flex; flex-direction:column; gap:12px;}
.body p, .body li{font-size:.84rem; color:var(--ink-2); max-width:82ch; margin:0; line-height:1.62;}
.body h4{margin:8px 0 0; font-size:.85rem; font-weight:600; color:var(--ink);}
.body ul{margin:0; padding-left:17px; display:flex; flex-direction:column; gap:7px;}
table.raw{border-collapse:collapse; width:100%; min-width:840px; font-size:.78rem;}
table.raw th{font-family:"IBM Plex Mono",monospace; font-size:.63rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); text-align:left; font-weight:500; padding:7px 8px 7px 0; border-bottom:1px solid var(--line);}
html[lang="ja"] table.raw th, html[lang="zh-CN"] table.raw th, html[lang="ko"] table.raw th{font-family:inherit; letter-spacing:.04em; font-size:.68rem;}
table.raw td{padding:7px 8px 7px 0; border-bottom:1px solid var(--hair); vertical-align:top;}
table.raw td.n{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; white-space:normal;}
table.raw td.g{font-weight:600;}

footer{font-size:.75rem; color:var(--faint); border-top:1px solid var(--line); padding-top:16px;}

@media (max-width:640px){
  .callout{grid-template-columns:1fr; gap:6px;}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>

</head><body>
<div class="wrap">

<header>
  <div class="topbar">
    <p class="eyebrow" data-i18n="eyebrow"></p>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="en" lang="en">English</button>
      <button type="button" data-lang="ko" lang="ko">한국어</button>
      <button type="button" data-lang="ja" lang="ja">日本語</button>
      <button type="button" data-lang="zh" lang="zh-CN">中文</button>
    </div>
  </div>
  <h1 data-i18n="h1"></h1>
  <p class="deck" data-i18n="deck"></p>
  <p class="deck" data-i18n="deck2"></p>
  <div class="repo">
    <p data-i18n="repoPitch"></p>
    <a class="repo-link" href="https://github.com/roboco-io/coding-agent-benchmark" data-i18n="metaLink"></a>
  </div>
  <p class="flagnote"><span data-i18n="flag"></span></p>
</header>


<section class="panel">
  <div class="panel-head">
    <div>
      <h2 data-i18n="mxTitle"></h2>
      <p class="sub" data-i18n="mxSub"></p>
    </div>
  </div>

  <div class="controls">
    <div class="seg" role="group" aria-label="Prompt language condition">
      <button type="button" id="lang-en" data-plang="en" aria-pressed="true" data-i18n="segEn"></button>
      <button type="button" id="lang-ko" data-plang="ko" aria-pressed="false" data-i18n="segKo"></button>
    </div>
    <span class="hint" id="langhint"></span>
  </div>
  <div class="legend">
    <span><i style="background:var(--native)"></i><span data-i18n="lgNative"></span></span>
    <span><i style="background:var(--direct)"></i><span data-i18n="lgDirect"></span></span>
    <span><i style="background:var(--codex)"></i><span data-i18n="lgCodex"></span></span>
    <span><i style="background:var(--pi)"></i><span data-i18n="lgPi"></span></span>
    <span><i style="background:var(--agy)"></i><span data-i18n="lgAgy"></span></span>
    <span><i class="out"></i><span data-i18n="lgOut"></span></span>
  </div>

  <div class="scroller">
    <table class="mx">
      <thead>
        <tr>
          <th scope="col"><button type="button" data-sort="name"><span data-i18n="colModel"></span> <span class="dir">↓</span></button></th>
          <th scope="col"><button type="button" data-sort="agent"><span data-i18n="colAgent"></span> <span class="dir">↓</span></button></th>
          <th scope="col">
            <button type="button" data-sort="time"><span data-i18n="colTime"></span> <span class="dir">↓</span></button>
            <div class="scale" data-scale="time"></div>
          </th>
          <th scope="col">
            <button type="button" data-sort="spread"><span data-i18n="colSpread"></span> <span class="dir">↓</span></button>
            <div class="scale" data-scale="spread"></div>
          </th>
          <th scope="col" class="cm-h"><button type="button" data-sort="commits"><span data-i18n="colCommits"></span> <span class="dir">↓</span></button>
            <div class="scale" data-scale="commits"></div>

/* "EXP-011/016" → text like "v0.144.0" or "v2.1.220 (EXP-014) · v2.1.222 (EXP-018)" */
function clientText(expStr, stack, t) {
  const ids = String(expStr).split("/").map((x, i) => i === 0 ? x : "EXP-" + x);
  const groups = [];
  ids.forEach(id => {
    const v = (CLIENTV[id] || {})[CKEY[stack]];
    const label = Array.isArray(v) ? v.map(x => "v" + x).join(" / ") : v ? "v" + v : t("clientUnrec");
    const g = groups.find(x => x.label === label);
    if (g) g.ids.push(id); else groups.push({ label, ids: [id] });
  });
  return groups.length === 1 ? groups[0].label : groups.map(g => `${g.label} (${g.ids.join(", ")})`).join(" · ");
}

    gemflash:{"exp": "Antigravity CLI → Gemini API (API key) · EXP-035 · EN · first run of this harness", "li": ["<b>EN median 17.5 min</b> (15.5–22.4). Runs 1 and 2 finished at iteration 1; run 3 finished at iteration 2 for a harness reason, not a model failure (next item).", "<b>Run 3 (D-1)</b>: the agent ran the harness's own grader (<span class=\"mono\">../measure.sh</span>), whose cleanup step killed the agy process. The code already scored 13/13 but completion was not yet declared, so iteration 2 declared it. Run 2 logged a single 503 error after completion; it did not affect the verdict (D-4).", "<b>119–192 model response steps per run</b> and 50.5–63.4K output (thinking included). That is many more responses than other Flash-class models, e.g. pi × DeepSeek V4.1-Flash (EXP-029: 25–40 responses, 1.9–4.1 min). This is an observation; no cause has been established.", "<b>Est. cost $1.39–1.68 per run</b> (median $1.47) at the public price checked on 2026-10-07 ($0.75 / $0.075 cached / $3.75 per 1M, valid through 2026-12-31; prices double from 2027-01-01). The runs used a pay-as-you-go Gemini API key, so real charges occurred, but the bill was not checked."], "cav": "First experiment on Antigravity CLI 1.3.1. agy's built-in product skills and system prompt were left on, and its token usage is defined differently from other harnesses, so compare it with pi × gemini-3.8-flash (EXP-036, same day) only as a whole-combination difference. n=3, EN only."},
    pigemflash:{"exp": "pi coding agent → Gemini API (API key), direct · EXP-036 · EN", "li": ["<b>EN median 14.0 min</b> (13.1–15.6). All 3 runs finished at iteration 1 with 4–7 commits.", "<b>102–119 responses per run</b> and 29.7–47.1K output. On the same pi 0.87.1, pi × DeepSeek V4.1-Flash (EXP-029) used 25–40 responses and 1.9–4.1 min. Model and date both differ, so this is an observation, not an attributed cause.", "Compared with Antigravity CLI on the same model the same day (EXP-035, 15.5–22.4 min, 50.5–63.4K), sessions were shorter and output lower; harness, system prompt and usage definitions all differ.", "<b>Est. cost $0.80–1.14 per run</b> (median $1.11) at the public price checked on 2026-10-07 ($0.75 / $0.075 cached / $3.75 per 1M, valid through 2026-12-31; prices double from 2027-01-01). Pay-as-you-go Gemini API key; the bill was not checked."], "cav": "Run 3 explored the harness directory: it read and ran the grader, read earlier runs' logs and metrics, and copied the canonical Hurl files (D-2). The verdict stands (absolute-path re-checks), but that run's time and tokens are not an independent trial. Run 1's session log captured secrets via env | grep; the archive is redacted and the harness fixed (D-3). n=3, EN only."},
    pisol61:{"exp": "pi coding agent → ChatGPT (OAuth login) · EXP-034 · EN", "li": ["<b>EN median 8.7 min</b> (8.3–9.2). All 3 runs finished at iteration 1 with 3–5 commits and 29–34 responses.", "<b>Why ~2× longer (session-log analysis)</b>: with the same pi 0.87.1 as EXP-030, tool execution time (43–59 s vs 36–37 s) and model calls (29–34 vs 31–35) were similar, but the wait per model call roughly doubled (14–15 s vs 7–8 s) and output per run grew about 1.6×. A same-time probe also showed gpt-6.1-sol about 1.4× slower with about 20% lower output speed, so the slowdown comes from the model or its serving path, not the date or client alone. <a href=\"https://github.com/roboco-io/coding-agent-benchmark/tree/main/analysis/gpt61-sol-slowdown\">Analysis</a>", "Output was 12.5–13.3K per run, against pi × gpt-6-sol (EXP-030, 4.2–5.6 min, 7.0–8.6K) and Codex CLI × gpt-6.1-sol the same day (EXP-033, 6.2–9.8 min). Both harnesses ran longer than the earlier gpt-6-sol measurements, which fits a model-side change but does not establish one.", "<b>Est. cost $0.30–0.35 per run</b> (median $0.30) at the public API price confirmed on 2026-10-03 ($2 / $0.10 cached / $10 per 1M). The runs used a ChatGPT login, so nothing was billed."], "cav": "pi 0.87.1 does not list this model, so it was called through a custom entry copied from the built-in gpt-6-sol definition; settings such as the context window may differ from the real model. Date and entry differ from EXP-030, so this is not a model-only ranking. n=3, EN only."},
    opus55:{"exp": "Claude Code · EXP-026 · EN and KO · released 2026-09", "li": ["<b>Second shortest on Claude Code, after Sonnet 5.5 (EXP-031)</b> — 5 of 6 runs finished in 4.0–4.2 min (EN median 4.2, KO 4.0). The remaining run (8.4 min) took longer because the agent debugged a port clash in a test script it wrote itself.", "<b>About $1.25 per run</b> — it generates few tokens (about 20K; among Claude models only Sonnet 5.5 is lower), and its cache-read price is 1/20 of its input price, so a run costs about a fifth of Opus 5.", "Just as fast in Korean, with every commit message and README written in Korean. It worked only through shell commands (Bash) and never used the external tools (MCP) that were connected."], "cav": "Run weeks after the other Claude models, on a newer Claude Code (2.1.280). Its rank is what we observed under these conditions, not a confirmed advantage."},
    dsflash:{"exp": "Claude Code → DeepSeek API, direct · EXP-025 · EN and KO · released 2026-09-10", "li": ["<b>Cheapest model on Claude Code</b> — about $0.09 per run ($0.12 in KO), about 1/6 of V4-Pro ($0.52). Only gpt-6-luna on Codex CLI (about $0.03) is lower. Its cache-read price is very low ($0.006 per 1M tokens).", "<b>Third fastest on Claude Code</b> — EN median 4.8 min (4.6–6.0). KO varied more, 4.2–8.4 min.", "Used the file read/write/edit tools (Read/Write/Edit) evenly, while other directly connected models mostly relied on shell commands (Bash). Wrote commits and README in Korean under the KO prompt."], "cav": "Run on pay-as-you-go API. Cost uses the peak-hour price; off-peak is half."},
    sol:{"exp": "Codex CLI · EXP-011/016 (EN) · EXP-019 (KO)", "li": ["<b>EN median 5.8 min</b> (5.3–10.0), about $1.05 per run. Among Codex CLI models, slower than gpt-6-sol (4.9 min) and faster than gpt-6-astra (7.1 min).", "One of three runs finished on the second iteration — apart from the two Solar models, the only run that did not finish on the first.", "An English-first model, yet under the KO prompt every commit and README was in Korean."], "cav": "Codex CLI differs from Claude Code, so treat its time as a reference only. Output is from Codex's own records and can't be compared directly with other models. Cost uses the promotional price valid until Nov 21."},
    fable:{"exp": "Claude Code · EXP-023 · EN · top Claude 5 model", "li": ["<b>EN median 6.9 min</b> (6.2–7.8), faster than Opus 4.8 — but its prices are double Opus's, so <b>about $3.5 per run</b>, roughly 3× Opus 5.5.", "Generated tokens (28.7–35.8K) are close to Opus 4.8 and below Opus 5 (41–48K). So Opus 5's high output is specific to Opus 5, not a trait of the Claude 5 generation.", "Across 3 runs it used only 71 shell commands (Bash) and 2 file writes — no file read or edit tools."], "cav": "Run with the user's global settings (external MCP tools, reply language) exposed — the same condition as the Opus 4.8 and Opus 5 runs, but 7 weeks later."},
    sol6:{"exp": "Codex CLI · EXP-027 · EN · GPT-6 generation", "li": ["<b>EN median 4.9 min</b> (4.8–5.2), about $0.43 per run. All three runs took about 5 min, made 3 commits and generated about 11K output tokens — very little run-to-run spread.", "Shorter than gpt-5.6-sol (median 5.8 min) and gpt-6-astra (7.1 min) on this task. But astra ran two weeks earlier on an older Codex CLI (0.153.4 vs 0.155.1), so the gap is not attributed to the model alone.", "Every response came from gpt-6-sol (no fallback). One grading-infrastructure issue (a leftover server process after grading, deviation D-1) was fixed without touching the agent and did not affect the verdict."], "cav": "Run on 2026-09-24 with Codex CLI 0.155.1, reasoning effort medium, logged in with a ChatGPT plan, so nothing was billed. Cost uses the standard short-context price checked on 2026-09-24. The gpt-6-earth model ID originally requested did not exist."},
    sol61:{"exp": "Codex CLI · EXP-033 · EN · GPT-6 generation, successor to gpt-6-sol", "li": ["<b>EN median 8.7 min</b> (6.2–9.8). All 3 runs finished at iteration 1 with 4 commits each; no recovery contribution from the loop was observed.", "<b>Why ~2× longer (session-log analysis)</b>: tool execution time stayed similar (27–39 s vs 40–55 s) and model calls were about as many (21–31 vs 26–35), but the wait per model call roughly doubled (16–23 s vs 7–10 s) and output per second of model wait fell from 42–45 to 29–30 tokens. In a same-time probe (same prompt, alternated 3×, 2026-10-03) gpt-6.1-sol still took about 1.4× longer, with 10–17% more output and about 20% lower output speed. pi on the same client version showed the same gap, so client version is not the main cause. <a href=\"https://github.com/roboco-io/coding-agent-benchmark/tree/main/analysis/gpt61-sol-slowdown\">Analysis</a>", "Output was 10.0–16.2K per run and the cache hit rate 92–94%. Sessions were longer and output more spread than gpt-6-sol on the same harness (EXP-027, 4.8–5.2 min, 10.4–11.0K) — an observation, not a ranking.", "<b>Est. cost $0.27–0.46 per run</b> (median $0.36) at the public API price confirmed on 2026-10-03 ($2 input / $0.10 cached input / $10 output per 1M, Standard ≤272K). Cached input costs half of gpt-6-sol's ($0.20), which matters because 92–94% of input was cache reads. The runs used a ChatGPT-plan login, so nothing was billed."], "cav": "Codex CLI 0.160.0 had no local entry for this model and ran on fallback metadata, and the CLI version and date differ from EXP-027 (0.155.1/0.156.1, 2026-09-24). The session-log analysis points to slower model calls rather than the client, but how much of the run-level gap comes from the measurement day was not separated. n=3, EN only."},
    luna6:{"exp": "Codex CLI · EXP-027 · EN · GPT-6 generation", "li": ["<b>EN median 6.6 min</b> (5.4–10.0). <b>About $0.03 per run — the lowest estimated cost of any model</b>, because its public price is 1/20 of gpt-6-sol's.", "Codex describes it as “fast and affordable”, yet on this task every one of its 3 runs took longer than every gpt-6-sol run. Run 1 was the longest (10.0 min, 8 commits, 21.5K output, 4.0M cumulative input); runs 2 and 3 were close to sol.", "Output (13.4–21.5K) and commits (4–8) varied more than sol's."], "cav": "Same day and conditions as gpt-6-sol, with the runs alternating. With n=3, “slower than sol” is an observation, not a confirmed ranking. Cost uses the standard short-context price; nothing was billed."},
    sonnet5:{"exp": "Claude Code · EXP-028 · EN and KO · Claude 5 generation", "li": ["<b>EN median 14.2 min</b> (13.0–15.3), KO 14.2 (11.2–16.8). All 6 runs finished, 5 of them at iteration 1.", "In run en-1 the agent stopped on its own after scaffolding and again after setting up the tests, then built the API in iteration 3. The Ralph loop carried the split work through with no rejected completion claim.", "<b>About $3.1 per run</b> (2.67–4.21) — more than Opus 5.5 (about $1.25) even though its input and output prices are half of Opus 5.5's, because it generated about 3× the output (57.6–73.7K) and read 7–14M cached tokens per run."], "cav": "Run a day after Opus 5.5 on Claude Code 2.1.281 with the user's global settings visible (as in EXP-023/026); a global “respond in Korean” rule made most EN-run summaries Korean. Slower than Opus 5.5 and Fable 5.1 is an observation at n=3, not a confirmed ranking."},
    astra:{"exp": "Codex CLI · EXP-021 · EN · first GPT-6 model", "li": ["<b>EN median 7.1 min</b>, about $2.0 per run. The three runs were within 0.5 min of each other — among the most consistent models.", "Took 23–32% longer than its predecessor gpt-5.6-sol. OpenAI's announced “1.9× faster” did not show up on this task.", "OpenAI offers no Anthropic-compatible API, so it can only run through Codex CLI. The only change from the sol runs was the model name."], "cav": "Run six days after release, logged in with a ChatGPT plan, so nothing was billed. Cost uses the short-context price."},
    kimi:{"exp": "Claude Code → Moonshot API, direct · EXP-014/016 (EN) · EXP-017 (KO)", "li": ["<b>EN median 7.9 min</b>, about $0.78 per run. But runs ranged from 7.6 to 21.3 min (2.8×), making it <b>the hardest model to predict on Claude Code</b>. Commit counts also varied, 1–4.", "Passed the same tests while generating among the fewest tokens (14.4K). Generating less does not mean a worse result."], "cav": "Thinking (reasoning) can't be turned off, so it ran with thinking on. Moonshot records cache-write tokens as 0."},
    opus48:{"exp": "Claude Code · EXP-010 (EN) · EXP-019 (KO)", "li": ["<b>Most stable model</b> — all 6 runs took 7.1–8.7 min, with an 8.3 min median in both EN and KO. About $3.2 per run.", "Usually builds everything and then <b>commits once</b> (median 1). All three KO runs made exactly one commit."], "cav": ""},
    opus5:{"exp": "Claude Code · EXP-009/010 (EN, 6 runs) · EXP-019 (KO)", "li": ["<b>Generates the most tokens of any Claude model except Sonnet 5</b> (median 47.0K) and <b>the most expensive, about $5.8 per run.</b> EN median 11.9 min.", "<b>Splits work into many commits</b> (median 6) — the opposite of Opus 4.8 (median 1) on the same prompt."], "cav": ""},
    dspro:{"exp": "Claude Code → DeepSeek API, direct · EXP-025 · EN and KO", "li": ["<b>EN median 13.3 min</b>, 2.5–3× slower than Flash, but still the second cheapest at <b>about $0.52 per run</b>.", "Its three KO runs were within 0.4 min of each other with 4, 4 and 4 commits — <b>the most consistent model under the KO prompt</b>.", "The docs warned V4-Pro requests might be routed to Flash, but every response in all 6 runs actually came from V4-Pro."], "cav": "An older build than Flash (08-13 vs 09-10), so the two differ in generation even within one provider. Cost uses the peak-hour price."},
    qwen:{"exp": "Claude Code → DashScope API, direct · EXP-013/016 (EN) · EXP-017 (KO)", "li": ["<b>EN median 15.1 min</b>, about $1.1 per run. Its three runs were within 1.0 min — <b>the easiest model to predict</b>.", "<b>The only model clearly slower in Korean</b> (22.8 min). The two conditions ran on different days, so this is not attributed to language.", "Connected by changing just three settings (API address, key, model name), with nothing to troubleshoot. This result made direct connection to the provider's API the default for this benchmark."], "cav": "Cost uses Singapore-region prices."},
    open2:{"exp": "Claude Code → Upstage API, direct · EXP-015 · EN, 1 run", "li": ["<b>58 min 15 s</b> — about 10× the fast models — finishing on the second iteration. Output was 252.3K tokens, heavy on thinking.", "The grader once marked a genuine completion as failed (it could not find the server port). After fixing the grader, two re-grades confirmed the pass."], "cav": "The trial service ended and the API was shut down on 2026-08-05, so no more runs are possible and this single run is the final record. No public price, so no cost. Its successor is Solar Pro 4."},
    pro4:{"exp": "Claude Code → Upstage API, direct · EXP-020 · EN", "li": ["<b>Slowest model</b> (119–258 min). Session logs show three factors stacking up: no caching, a 37-second average round-trip per request, and 88% of generated tokens being thinking.", "All 3 runs finished. The slowness comes from the preview service's response time and lack of caching, not from failing the task.", "In run 1 an unrelated npm package hid the grading program, so 9 genuine completion claims were marked as failed. A later re-grade fixed the actual completion point."], "cav": "The $8.0 cost is at list price. No cache was recorded, so all input is priced as uncached, which inflates it; the runs took place during a free/promotional period."}
  },
  rawTitle:"Per-experiment figures", rawSmall:"37 conditions · 109 runs",
  rawIntro:"Every completed row went through triple confirmation: the gate (or a direct re-grade) plus two independent re-checks. Time is wall-clock; output is comparable only within a condition.",
  rawHead:["Model","Experiment","Condition","Client","n","Completed","iter","Time","Commits","Output","Model wait (s)","Tool time (s)","Model calls","Output / model-wait s","Note"],
  doneOne:"done", t58:"58 min 15 s", condNative:"Native", condDirect:"Direct", condCodex:"Codex CLI",
  rawNotes:{ r37:"run 3 read harness files and earlier runs' logs (D-2) · est. cost at the 2026-10-07 public price", r36:"new harness (Antigravity CLI) · run 3 iter 2 caused by the harness grader the agent ran (D-1) · est. cost at the 2026-10-07 public price", r35:"custom pi model entry copied from gpt-6-sol · est. cost at the 2026-10-03 public price", r34:"Codex 0.160.0 ran on fallback model metadata · est. cost at the 2026-10-03 public price", r33:"Shortest median of any condition (2.4 min) and shortest completed session in the repo (1 min 49 s) · custom pi model entry copied from claude-sonnet-5 · 5-minute cache writes", r31:"Shortest Claude Code condition (median 3.2) · Bash only · harness PORT injection (EN runs ignored it)", r32:"Shortest KO condition (2.5–3.3 min) · used the injected PORT", r29:"pi on the Anthropic API · bash-only tool use · 5-minute cache writes", r30:"pi on ChatGPT login · output below the Codex CLI range (7.0–8.6K vs 10.4–11.0K)", r26:"Shortest completed session in the repo until EXP-032 (1.9 min) · run 1 re-run after port conflict (D-3)", r27:"Tightest pi condition (9.5–9.9 min)", r28:"Run 1 at iter 5 because another process held the grading port (D-1); its iter-1 code passed on re-grade", r1:"Same-day crossover A/B", r2:"All-Korean output · overlaps EN range", r3:"EN canonical prompt established", r4:"Expanded-output profile", r6:"Claude 5 top tier · output at 4.8 level", r16:"Fastest direct model · cheapest · Read/Write/Edit trajectory", r17:"All-Korean", r20:"Claude Code median 4.2 · second to Sonnet 5.5 (EXP-031, later date) · low native output", r21:"All-Korean · tight KO range (3.95–4.22 min)", r18:"Model held (v4-pro on every response) · 2.5–3× slower than Flash", r19:"All-Korean · tightest variance (0.4 min)", r22:"Tightest GPT spread (4.8–5.2 min) · 3 commits every run · 1 grader-infra deviation, no verdict impact", r23:"Lowest est. cost · every run longer than every sol run · run 1 longest (10.0 min, 8 commits)", r24:"en-1 split the work over 3 iterations on its own (no rejected claim) · most output of any Claude model", r25:"All iter 1 · longest KO run 16.8 min", r7:"Only sol-2 needed iter 2", r8:"English-first model, still all-Korean output", r9:"First GPT-6 check · 0 false rejections · +23–32% vs sol", r10:"0 troubleshooting · least variance", r11:"All-Korean · does not overlap EN range", r12:"Largest run-to-run spread on Claude Code (2.8×)", r13:"All-Korean (one “feat:” prefix)", r14:"1 gate false rejection · fixed in measure v4", r15:"Longest of all · pro4-1 loop extended by false rejection, confirmed retroactively" },
  notesTitle:"Investigation notes", notesSmall:"why no translation proxy · 3 grader errors · corrections",
  notes:[["① Why models are not connected through a translation proxy (ccr)", "Claude Code sends requests in Anthropic's API format. Connecting it to a model that only accepts OpenAI's format needs a proxy that converts between them (ccr, claude-code-router), and in early experiments that proxy caused several problems. Tool-call arguments were corrupted (EXP-006: only the first of several streamed pieces was handled, turning <span class=\"mono\">python3</span> into <span class=\"mono\">3</span>), token usage went unrecorded (EXP-012), each model needed its own conversion code, and runs stalled or crashed when context limits weren't set. Connecting directly to the provider's official Anthropic-compatible API (Upstage, DashScope, Moonshot, DeepSeek) never caused any of this. So results that went through the proxy are left out of the comparison. The reason is errors and distorted measurement, not speed (whether the proxy was slower could not be separated from model differences). OpenAI models, which have no Anthropic-compatible API, run through OpenAI's own Codex CLI. EXP-029 added a third tool, the pi coding agent, which speaks OpenAI's format natively and so connects to the providers' OpenAI-compatible APIs with no conversion proxy. The raw data and reports for EXP-005/006/012 remain in the repository."], ["② Three times the grader failed a genuine completion", "When the agent declares it is done, a grading script starts the server and runs the official tests. Three times this script marked a real completion as failed. EXP-010 run 48-1: the test files were not copied. EXP-015 iteration 2: a server started with <span class=\"mono\">npx tsx</span> has no repository path on its command line, so the grader could not find its port (fixed by locating it through the process's working directory, measure v4). EXP-020 pro4-1: an unrelated npm package (<span class=\"mono\">@hurl/cli</span>) installed 11 days earlier hid the real Hurl 8.0.1 test tool on PATH, and 9 genuine completion claims in a row were marked as failed. <b>Lesson: confirm a failure only after reading the grader's log, and pin even the paths of the programs the grader uses.</b> From EXP-021 on, absolute paths were pinned from the start, and this error has not happened since."], ["③ Corrections and exclusions (2026-08-04)", "An early write-up recorded EXP-006 open2-2 and EXP-008 as going through the proxy (ccr); both were in fact direct Upstage API connections. The dashboard and repository documents were corrected together and the claim that direct connection is faster than the proxy was withdrawn. EXP-008 ran on a prompt from before the current standard prompt was fixed (iteration 10, about 173 min), so it was replaced by EXP-015 — the same model and connection re-run under standard conditions — and left out of the comparison."], ["", "<b>What all three have in common:</b> the reliability of the results depended more on managing the test environment than on the models. Remove format-converting proxies, isolate the runs from other settings, and check even the grader's failures against its log."]],
  cavTitle:"Reading caveats", cavSmall:"what these numbers cannot tell you",
  cavs:["<b>The only verdict is whether a run finished.</b> All 109 runs finished, so differences between models show up only in time, commits, output and cost. Session time alone varies up to 2.8× between runs of the same model under the same condition, each condition ran only 3 times (some once), and there is a single task, a RealWorld backend. Treat the rankings as a reference, not as evidence that one model is more efficient.", "<b>Cost is an estimate, not money actually spent.</b> Each run's tokens are split into uncached input, cache read, cache write and output, then multiplied by each provider's public API price as checked on 2026-09-23 (gpt-6-sol and gpt-6-luna on 09-24; Sonnet 5.5 on 09-29, with its cache-write price assumed from the standard multiplier and not verified). gpt-6.1-sol (EXP-033/034) uses its public API price confirmed on 2026-10-03 ($2 / $0.10 cached / $10 per 1M). gemini-3.8-flash (EXP-035/036) uses the public price checked on 2026-10-07 ($0.75 / $0.075 cached / $3.75 per 1M, valid through 2026-12-31 and doubling from 2027-01-01); those runs used a pay-as-you-go Gemini API key, so real charges occurred, but the bill was not checked. The runs themselves used a Claude subscription, a ChatGPT-plan login for the five GPT models, and a free/promotional preview for Solar, so none of this was billed. Prices used: DeepSeek at its peak-hour price (an upper bound — off-peak is half), gpt-5.6-sol at its promotional price valid until Nov 21, qwen at Singapore-region prices, and Claude cache writes at the 1-hour retention price. Retries and extra sessions within a run are included. Solar Open 2 has no public price, so it has no cost. The pi runs (EXP-029/030/032) are priced from pi's session token records with the same prices. pi × Opus 5.5 (EXP-030) and pi × Sonnet 5.5 (EXP-032) ran on a pay-as-you-go Anthropic API key and their cache writes are priced at the 5-minute rate, pi's default; pi × gpt-6-sol used a ChatGPT-plan login and was not billed. What was actually billed was not measured. <a href=\"https://github.com/roboco-io/coding-agent-benchmark/tree/main/analysis/cost\">Method, price sources and per-run data ↗</a>", "<b>Models record tokens differently.</b> Output was measured two ways — Claude Code session logs (filled bars) and Codex records (outlined bars) — and the two can't be compared. Providers also record caching differently: Anthropic and DashScope record both cache reads and writes, Moonshot and DeepSeek only reads, and Upstage neither. Under pi (EXP-029), Moonshot also recorded cache writes, and output was measured from pi's session records.", "<b>With different tools, treat time as a reference.</b> The four GPT models (gpt-5.6-sol, gpt-6-astra, gpt-6-sol, gpt-6-luna) ran on OpenAI's Codex CLI; everything else ran on Claude Code. The two tools start up and call tools differently, so part of a time gap may come from the tool. Only comparisons within one tool (Claude Code models with each other, or the GPT models with each other) remove that difference. The three pi rows (EXP-029) ran on a third tool, the pi coding agent, connected to each provider's OpenAI-compatible API. Compared with the same models on Claude Code, both the tool and the API format differ, so the gap can't be attributed to either one.", "<b>Client versions differ by experiment.</b> Each row shows the agent CLI version used (Claude Code, Codex CLI or pi; also listed in the experiment details and in the Client column of the raw values table). Across the experiments shown here the versions range from Claude Code 2.1.220 to 2.1.284 and from Codex CLI 0.144.0 to 0.160.0, and one experiment (EXP-027) ran on two Codex versions. Startup, tool-call handling and context management can change between versions, so a time gap between experiments includes the client version difference as well as the model difference. “Not recorded” means the version appears in neither the experiment documents nor the session logs. Full table: <a href=\"https://github.com/roboco-io/coding-agent-benchmark/blob/main/analysis/client-versions.md\">analysis/client-versions.md ↗</a>", "<b>Experiments ran on different dates</b> (2026-07-24 – 10-07). Provider servers and the Claude Code version may have changed in between. EN and KO often ran on different days (up to 12 days apart), so differences are not attributed to language. The newest models (gpt-6-astra, gpt-6-sol, gpt-6-luna, Fable 5.1, Opus 5.5, Sonnet 5.5) ran 3–10 weeks after the others, so date differences also mix into cross-generation speed comparisons.", "<b>Both Solar models were measured on preview APIs, not the full service.</b> These were apply-to-use betas with no caching, a 37-second average round-trip per request, and shutdowns without notice. Don't read their time or token counts as production performance.", "<b>The two earlier non-completions (EXP-005/006) were not the model's fault.</b> A follow-up investigation (EXP-007) found stray settings in the run environment and token-measurement errors to be the main causes; once the environment was isolated, the same model finished. “This model can't finish” is not a conclusion you can draw without isolating the environment and investigating the cause."],
  footer:"coding-agent-benchmark · latest update EXP-036 (2026-10-07) · raw logs, usage CSVs and orchestrator logs are kept in each experiment's <span class=\"mono\">runs/</span> directory."

  howLat:"<b>호출당 관측 대기와 모델 대기 비중</b> — 세션 로그를 시간순으로 읽어, 직전 이벤트부터 다음 이벤트까지의 시간을 다음 이벤트가 모델 산출물(응답·도구 호출·reasoning)이면 <b>모델 대기</b>, 도구 결과이면 <b>도구 실행</b>으로 귀속합니다. 호출당 대기는 모델 대기를 그 run의 모델 응답 수로 나눈 값입니다(막대 = run 범위, 눈금 = 중앙값). 모델 대기 비중은 모델 대기 /(모델 대기 + 도구 실행)입니다. 둘 다 영어 run의 세션 로그에서만 얻었고 “—”는 미계측입니다. 모델 속도가 아니라 관측된 대기 시간이며, 아래 유의점을 함께 보십시오.",
  cavLat:"<b>호출당 대기는 모델 속도가 아닙니다.</b> 호출마다 생성한 토큰 수, 컨텍스트 크기, 클라이언트가 도구 호출을 묶는 방식, 제공자 엔드포인트와 그 시간대의 서버 부하, 네트워크·대기열 시간이 모두 들어 있습니다. 실험마다 날짜와 클라이언트 버전이 달랐으므로 행 사이 비교는 참고용입니다. 방법·정의·run별 데이터: <a href=\"https://github.com/roboco-io/coding-agent-benchmark/tree/main/analysis/latency\">analysis/latency ↗</a>",

  howEyebrow:"읽는 법",
  howItems:["<b>막대 읽는 법</b> — 한 행이 한 모델×에이전트 조합입니다. 막대는 그 모델의 run 중 가장 작은 값부터 가장 큰 값까지의 범위이고, 흰 세로선은 중앙값입니다. 열 제목을 누르면 그 기준으로 정렬됩니다.", "<b>에이전트</b> — 랄프 루프를 실행한 코딩 에이전트 하네스(Claude Code, Codex CLI, pi, Antigravity CLI)입니다. 둘째 줄은 모델 연결 방식으로, 네이티브·OpenAI·Google 또는 표시된 제공자 API 직결을 뜻합니다. 같은 모델이 여러 에이전트에 나타날 수 있습니다.", "<b>소요 시간</b> — run 하나가 과제를 완주하기까지 걸린 에이전트 세션 시간입니다. 대부분의 조건이 중앙값 기준 3–19분에 모여 있습니다. Solar 두 모델(58분, 119–258분)은 프리뷰 API의 느린 응답과 캐시 미지원이 함께 반영된 값이므로 모델 성능 비교에 쓰지 마세요.", "<b>run 간 변동</b> — 같은 조건에서 가장 느린 run이 가장 빠른 run의 몇 배였는지입니다. 값이 클수록 다음 run이 얼마나 걸릴지 예측하기 어렵습니다. 예: kimi-k3 2.8배, pi × DeepSeek V4.1-Flash 2.1배, qwen3.8-max 1.1배.", "<b>커밋 규율</b> — run 하나에서 만든 git 커밋 수입니다(채운 점 = 중앙값). 결과 품질이 아니라 작업 방식의 차이를 보여 줍니다. 같은 프롬프트에서 Opus 4.8은 대개 한 번에 커밋하고(중앙값 1), Opus 5는 여러 번 나눠 커밋합니다(중앙값 6).", "<b>output 토큰</b> — 모델이 생성한 토큰 수(thinking 포함)입니다. 테두리만 있는 막대(GPT 네 모델)는 Codex 기록 방식으로 계측한 값이라 칠한 막대와 직접 비교할 수 없습니다. pi 여섯 행은 pi 자체 세션 기록으로 계측했습니다(output에 thinking 포함).", "<b>run당 환산 비용</b> — run에서 쓴 토큰에 공개 API 단가를 곱한 추정치입니다. 실제 청구 금액이 아닙니다(구독·프리뷰로 실행). 적용한 단가와 가정은 아래 \"해석 주의\"에 있습니다.", "<b>핵심 관찰</b> — 중앙값이 가장 짧은 조건은 pi × Sonnet 5.5(영어 2.4분, run별 1.8–3.2분, 이 리포에서 가장 짧은 완주 세션 1분 49초 포함), Claude Code의 Sonnet 5.5(영어 3.2분, 한국어 2.9분, run별 2.5–4.2분), pi × DeepSeek V4.1-Flash(3.3분, run별 1.9–4.1분)입니다. Sonnet 5.5는 실행 날짜와 CLI 버전이 다르고, pi와 Claude Code 조건 사이에도 에이전트·thinking 설정·캐시 보관 시간이 함께 달라 모델만의 순위로 보지 않습니다. 가장 싼 모델은 gpt-6-luna(run당 약 $0.03)이고, 그다음이 pi × DeepSeek V4.1-Flash(약 $0.06), Claude Code의 DeepSeek V4.1-Flash(약 $0.09)입니다. 빠르다고 싸지는 않습니다. Fable 5.1은 6.9분으로 빠른 편이지만 run당 약 $3.5로 Opus 5.5($1.25)의 약 3배입니다.", "<b>KO 정본 토글</b> — 프롬프트를 한국어 번역본으로 바꾸고 산출물(커밋·README)도 한국어로 쓰게 한 조건입니다. 실험한 10개 모델이 모두 완주했습니다. 영어 조건보다 확실히 느려진 모델은 qwen3.8-max 하나(15.1분 → 22.8분)이며, 두 조건의 실행 날짜가 달라 언어 때문이라고 단정하지 않습니다."],

  cards:{
    sonnet55:{"exp": "Claude Code · EXP-031 · 영어·한국어 · Sonnet 5 후속", "li": ["<b>Claude Code에서 가장 짧은 세션</b> — 6 run 모두 iteration 1에 2.5–4.2분 만에 끝났습니다(영어 중앙값 3.2분, 한국어 2.9분). run당 API 호출도 16–24회로 다른 네이티브 Claude 조건(Opus 5.5 22–41회)보다 적습니다.", "<b>run당 약 $0.68</b>(0.60–0.82, 한국어 0.70) — 단가는 Sonnet 5와 같지만 run당 output이 15.2–20.9K, 캐시 읽기가 1.1–1.6M 토큰에 그쳐 Sonnet 5의 약 1/5, Opus 5.5의 약 절반입니다.", "셸 명령(Bash)만 썼고 Read/Write/Edit·MCP·스킬·서브에이전트는 한 번도 쓰지 않았습니다. heredoc으로 파일을 쓰며 공식 리포 clone → Hurl 테스트 요약 → 코드 대량 작성 → 실행 검증 → 완료 선언의 짧은 경로를 밟았고, 6 run 모두 Fastify + Prisma + SQLite를 골랐습니다."], "cav": "2026-09-29에 Claude Code 2.1.284로, 다른 Claude 모델보다 며칠 뒤에 사용자 글로벌 설정이 노출된 상태(EXP-023/026/028과 동일)로 실행했습니다. 이 실험부터 하네스가 빈 포트를 PORT로 넘기며, 한국어 3 run은 이를 따랐고 영어 3 run은 변수명을 바꿔 무시했습니다. 날짜·CLI 버전·포트 주입이 모두 달라 '가장 짧다'는 이 조건에서의 관측이며 모델만의 순위가 아닙니다. 캐시 쓰기 단가는 표준 배수로 가정한 값이며 확인하지 않았습니다."},
    pisonnet55:{"exp": "pi coding agent → Anthropic API(API 키) 직결 · EXP-032 · 영어", "li": ["<b>전 조건 중 중앙값 최단, 영어 2.4분</b>(1.8–3.2분). 이 리포에서 가장 짧은 완주 세션(1분 49초)도 이 조건입니다(종전 최단은 EXP-029 pi × DeepSeek V4.1-Flash의 1.9분). 3 run 모두 iteration 1에 완주했고 커밋은 1–3개, API 호출은 13–23회입니다.", "<b>run당 약 $0.30</b>(0.25–0.32), output 10.9–14.7K로 같은 날 Claude Code의 Sonnet 5.5(영어 약 $0.68, 15.2–20.0K)보다 낮습니다. 비용 차이의 일부는 캐시 보관 시간 차이입니다. pi는 5분 캐시($2.50/1M 토큰), Claude Code는 1시간 캐시($4)로 기록됐습니다.", "pi 0.87.1 내장 목록에 Sonnet 5.5가 없어 내장 claude-sonnet-5 정의를 복사한 사용자 정의 모델 항목으로 호출했습니다. 작업은 거의 pi의 bash 도구만으로 했고(run 1에서 write 1회), 3 run 모두 Fastify + Prisma를 골랐으며, thinking은 pi 기본값(medium)이었습니다."], "cav": "같은 날 Claude Code의 Sonnet 5.5(EXP-031)와 비교하면 에이전트, thinking 설정(pi medium 대 Claude Code 기본값), 캐시 보관 시간(5분 대 1시간)이 함께 달라 차이를 pi만의 효과로 보지 않습니다. n=3, 영어 조건만 실행했습니다. 종량제 API 키로 실행했으나 청구액은 확인하지 않았고, 캐시 쓰기 단가는 표준 배수로 가정한 미확인 값입니다."},
    piflash:{"exp": "pi coding agent → DeepSeek API(OpenAI 호환) 직결 · EXP-029 · 영어", "li": ["<b>영어 중앙값 3.3분</b>으로 pi × Sonnet 5.5(EXP-032)와 Claude Code의 Sonnet 5.5(EXP-031) 다음으로 짧습니다. 가장 빠른 run(1.9분)은 EXP-032(1분 49초) 전까지 이 리포에서 가장 짧은 완주 세션이었습니다. 가장 느린 run은 4.1분이었습니다(run 간 변동 2.1배).", "<b>run당 약 $0.06</b>(0.04–0.07)로 gpt-6-luna 다음으로 저렴합니다.", "3 run 모두 iteration 1에 완주했고 커밋은 2–4개입니다. thinking은 pi 기본값(high) 그대로였습니다. run 1은 재실행 결과입니다. 원 run(7.7분)은 VS Code가 포트 3000–3001을 점유해 약 2.6분을 잃었습니다(D-3)."], "cav": "Claude Code로 실행한 DeepSeek V4.1-Flash(EXP-025, 4.6–6.0분)와 같은 모델이지만, 도구와 API 형식이 함께 다르고 실행 시점도 3일 차이가 나므로 차이를 pi의 효과로 보지 않습니다. 비용은 피크 단가 기준이며 실제 청구액은 측정하지 않았습니다."},
    pikimi:{"exp": "pi coding agent → Moonshot API(OpenAI 호환) 직결 · EXP-029 · 영어", "li": ["<b>영어 중앙값 9.9분</b>(9.5–9.9분). 세 run의 시간 차이가 0.4분 이내이고 output도 17.4–18.7K로, pi 조건 중 가장 일정했습니다.", "<b>run당 약 $0.65</b>. 3 run 모두 iteration 1에 완주했고 커밋은 3–4개입니다.", "에이전트가 PATH의 <span class=\"mono\">hurl</span>이 npm 패키지라는 사실을 스스로 발견하고, 자기 테스트 스크립트가 실제 Hurl 실행 파일을 쓰도록 고쳤습니다. 판정은 채점기가 고정한 경로로 했으므로 영향이 없습니다."], "cav": "Claude Code로 실행한 kimi-k3(EXP-014/016, 7.6–21.3분)와는 도구와 API 형식이 함께 달라 차이를 pi의 효과로 보지 않습니다. pi에서는 Moonshot이 캐시 쓰기를 기록했고, 이를 입력 단가로 계산했습니다."},
    piqwen:{"exp": "pi coding agent → DashScope API(OpenAI 호환) 직결 · EXP-029 · 영어", "li": ["<b>영어 중앙값 18.7분</b>(15.6–29.0분)으로 pi 조건 중 가장 깁니다. 원인은 확인하지 않았습니다(요청별 지연을 계측하지 않음).", "run 1은 다른 프로그램(VS Code Live Preview)이 채점 포트를 점유해 iteration 1–4가 실패로 잘못 판정되는 바람에 iteration 5 완주(29.0분, 커밋 12개)로 기록됐습니다. iteration 1 코드도 재채점에서 통과했으며, 이 run의 시간·커밋·토큰에는 교란이 포함돼 있습니다.", "<b>run당 약 $0.75</b>(0.59–1.52, 상단은 교란된 run 1)."], "cav": "thinking은 이 모델에 대한 pi 기본값(medium)으로, 다른 두 조건(high)과 다릅니다. qwen3.8-max는 오픈웨이트가 아닌 API 전용 모델일 수 있습니다(미확인). 비용은 싱가포르 리전 단가 기준입니다."},
    piopus:{"exp": "pi coding agent → Anthropic API(API 키) 직결 · EXP-030 · 영어", "li": ["<b>영어 중앙값 3.9분</b>(3.1–4.9분). 3 run 모두 iteration 1에 완주했고 커밋은 2–4개입니다. Claude Code의 Opus 5.5(EXP-026, 4.0–8.4분)와 범위가 겹칩니다.", "<b>run당 약 $0.81</b>(0.74–0.87), output 16.6–19.8K로 둘 다 Claude Code run(약 $1.25, 18.6–28.2K)보다 낮았습니다. 비용 차이의 일부는 캐시 보관 방식 때문입니다. pi는 5분 캐시(1M 토큰당 $5)로, Claude Code는 1시간 캐시($8)로 썼습니다.", "pi의 도구 중 bash만 썼고(run당 17–27회), 파일도 셸 heredoc으로 작성했습니다. thinking은 pi 기본값(medium effort)으로 실행했습니다."], "cav": "에이전트와 API 경로(시스템 프롬프트·도구·thinking 전달 방식·캐시 보관)가 Claude Code와 함께 다르고 실행일도 하루 차이라, 차이를 pi의 효과로 보지 않습니다. 종량제 API 키로 실행했으며 실제 청구액은 측정하지 않았습니다."},
    pisol:{"exp": "pi coding agent → ChatGPT(OAuth 로그인) · EXP-030 · 영어", "li": ["<b>영어 중앙값 4.4분</b>(4.2–5.6분). 3 run 모두 iteration 1에 완주했고 커밋은 2개씩입니다. Codex CLI의 gpt-6-sol(EXP-027, 4.8–5.2분)과 범위가 겹칩니다.", "<b>run당 약 $0.27</b>, output 7.0–8.6K로 Codex CLI run(약 $0.43, 10.4–11.0K)보다 낮았습니다.", "pi에서 bash만 쓴 Opus 5.5와 달리 bash와 pi의 write·edit·read 도구를 섞어 썼습니다. reasoning effort는 pi 기본값 medium으로, Codex run과 명목 설정이 같습니다."], "cav": "ChatGPT 플랜 로그인으로 실행해 청구되지 않았고, 비용은 API 단가 환산 추정치입니다. Codex run과 같은 날 오전·오후로 가깝지만 에이전트와 요청 구성이 달라 차이를 pi의 효과로 보지 않습니다."},
    gemflash:{"exp": "Antigravity CLI → Gemini API(API 키) · EXP-035 · 영어 · 이 하네스의 첫 실험", "li": ["<b>영어 중앙값 17.5분</b>(15.5–22.4분). run 1·2는 iteration 1에 완주했고, run 3은 모델 실패가 아니라 하네스 때문에 iteration 2에 완주했습니다(다음 항목).", "<b>run 3 (D-1)</b>: 에이전트가 하네스 채점기(<span class=\"mono\">../measure.sh</span>)를 직접 실행했고, 채점기의 정리 단계가 agy 프로세스를 종료시켰습니다. 코드는 이미 13/13이었지만 완료 선언 전이어서 iteration 2가 완료를 선언했습니다. run 2는 완료 뒤 503 오류가 한 번 기록됐으나 판정에는 영향이 없었습니다(D-4).", "<b>run당 모델 응답 스텝 119–192회</b>, output 50.5–63.4K(thinking 포함). 다른 Flash급 모델보다 응답이 훨씬 많습니다. 예: pi × DeepSeek V4.1-Flash(EXP-029) 응답 25–40회·1.9–4.1분. 관측일 뿐 원인은 확인되지 않았습니다.", "<b>run당 환산 비용 $1.39–1.68</b>(중앙값 $1.47). 2026-10-07에 확인한 공개 단가(1M 토큰당 $0.75 / 캐시 $0.075 / $3.75, 2026-12-31까지, 2027-01-01부터 두 배)로 계산했습니다. 종량 과금 Gemini API 키로 실행해 실제 과금이 있었지만 청구액은 확인하지 않았습니다."], "cav": "Antigravity CLI 1.3.1의 첫 실험입니다. agy 제품 내장 스킬과 시스템 프롬프트를 끄지 않았고 토큰 usage 정의도 다른 하네스와 달라, 같은 날의 pi × gemini-3.8-flash(EXP-036)와는 조합 전체의 차이로만 비교하세요. n=3, 영어만."},
    pigemflash:{"exp": "pi coding agent → Gemini API(API 키) 직결 · EXP-036 · 영어", "li": ["<b>영어 중앙값 14.0분</b>(13.1–15.6분). 3 run 모두 iteration 1에 완주했고 커밋은 4–7개입니다.", "<b>run당 응답 102–119회</b>, output 29.7–47.1K. 같은 pi 0.87.1에서 pi × DeepSeek V4.1-Flash(EXP-029)는 응답 25–40회·1.9–4.1분이었습니다. 모델과 날짜가 함께 달라 원인을 지목하지 않은 관측입니다.", "같은 날 같은 모델의 Antigravity CLI(EXP-035, 15.5–22.4분, 50.5–63.4K)보다 세션이 짧고 output이 적었습니다. 하네스·시스템 프롬프트·usage 정의가 모두 다릅니다.", "<b>run당 환산 비용 $0.80–1.14</b>(중앙값 $1.11). 2026-10-07에 확인한 공개 단가(1M 토큰당 $0.75 / 캐시 $0.075 / $3.75, 2026-12-31까지, 2027-01-01부터 두 배)로 계산했습니다. 종량 과금 Gemini API 키이며 청구액은 확인하지 않았습니다."], "cav": "run 3은 하네스 디렉터리를 탐색해 채점기를 읽고 실행했고, 이전 run의 로그·metrics를 읽었으며, Hurl 정본을 복사했습니다(D-2). 판정은 절대 경로 재검증으로 유효하지만 이 run의 시간·토큰은 독립 시행 값이 아닙니다. run 1 세션 로그에 env | grep으로 비밀값이 남아 보관본을 마스킹하고 하네스를 고쳤습니다(D-3). n=3, 영어만."},
    pisol61:{"exp": "pi coding agent → ChatGPT(OAuth 로그인) · EXP-034 · 영어", "li": ["<b>영어 중앙값 8.7분</b>(8.3–9.2분). 3 run 모두 iteration 1에 완주했고 커밋은 3–5개, 응답은 29–34회입니다.", "<b>약 2배 길어진 이유 (세션 기록 분석)</b>: EXP-030과 같은 pi 0.87.1에서 도구 실행 시간(43–59초 대 36–37초)과 모델 호출 수(29–34회 대 31–35회)는 비슷했고, 모델 호출 한 번당 대기가 약 2배(14–15초 대 7–8초)로 늘고 run당 output이 약 1.6배가 되었습니다. 같은 시각 비교에서도 gpt-6.1-sol이 약 1.4배 느리고 생성 속도가 약 20% 낮아, 날짜나 클라이언트만이 아니라 모델 또는 그 서빙 경로에서 온 차이입니다. <a href=\"https://github.com/roboco-io/coding-agent-benchmark/tree/main/analysis/gpt61-sol-slowdown\">분석 문서</a>", "run당 output은 12.5–13.3K로, pi × gpt-6-sol(EXP-030, 4.2–5.6분, 7.0–8.6K)과 같은 날 Codex CLI × gpt-6.1-sol(EXP-033, 6.2–9.8분)을 함께 보면 두 하네스 모두 이전 gpt-6-sol 측정보다 길었습니다. 모델 쪽 변화와 부합하지만 입증된 것은 아닙니다.", "<b>run당 환산 비용 $0.30–0.35</b>(중앙값 $0.30). 2026-10-03에 확인한 공개 API 단가(1M 토큰당 $2 / 캐시 $0.10 / $10)로 계산했습니다. ChatGPT 로그인으로 실행해 청구되지 않았습니다."], "cav": "pi 0.87.1 내장 목록에 이 모델이 없어 내장 gpt-6-sol 정의를 복사한 사용자 정의 항목으로 호출했으므로 컨텍스트 창 등의 설정이 실제 모델과 다를 수 있습니다. 날짜와 항목이 EXP-030과 달라 모델만의 순위가 아닙니다. n=3, 영어만 실험했습니다."},
    opus55:{"exp": "Claude Code · EXP-026 · 영어·한국어 · 2026-09 출시", "li": ["<b>Claude Code에서 Sonnet 5.5(EXP-031) 다음으로 짧은 모델</b> — 6 run 중 5 run이 4.0–4.2분에 끝났습니다(영어 중앙값 4.2분, 한국어 4.0분). 나머지 한 run(8.4분)은 에이전트가 직접 만든 테스트 스크립트의 포트 충돌을 해결하느라 길어졌습니다.", "<b>run당 약 $1.25</b> — 생성 토큰이 약 20K로 Claude 모델 중 Sonnet 5.5 다음으로 적고, 캐시 읽기 단가도 입력 단가의 1/20로 낮아 Opus 5의 약 1/5입니다.", "한국어 조건에서도 속도가 같았고 커밋 메시지와 README를 모두 한국어로 썼습니다. 셸 명령(Bash)만으로 작업했으며, 연결돼 있던 외부 도구(MCP)는 한 번도 쓰지 않았습니다."], "cav": "다른 Claude 모델보다 몇 주 뒤, 새 Claude Code 버전(2.1.280)으로 실행했습니다. 이 순위는 이 조건에서의 관측이며 확정된 우위가 아닙니다."},
    dsflash:{"exp": "Claude Code → DeepSeek API 직접 연결 · EXP-025 · 영어·한국어 · 2026-09-10 출시", "li": ["<b>Claude Code로 실행한 모델 중 가장 저렴</b> — run당 약 $0.09(한국어 $0.12)로 V4-Pro($0.52)의 약 1/6입니다. 이보다 낮은 모델은 Codex CLI로 실행한 gpt-6-luna(약 $0.03)뿐입니다. 캐시 읽기 단가가 1M 토큰당 $0.006으로 매우 낮기 때문입니다.", "<b>Claude Code에서 세 번째로 빠른 모델</b> — 영어 중앙값 4.8분(4.6–6.0분). 한국어는 4.2–8.4분으로 run마다 차이가 더 컸습니다.", "파일 읽기·쓰기·수정 도구(Read/Write/Edit)를 고루 썼습니다. 다른 직접 연결 모델은 대부분 셸 명령(Bash)에 의존했습니다. 한국어 조건에서도 커밋과 README를 모두 한국어로 썼습니다."], "cav": "쓴 만큼 과금되는 API로 실행했습니다. 비용은 가장 비싼 시간대 단가 기준이며, 다른 시간대에는 절반입니다."},
    sol:{"exp": "Codex CLI · EXP-011/016(영어) · EXP-019(한국어)", "li": ["<b>영어 중앙값 5.8분</b>(5.3–10.0분), run당 약 $1.05. Codex CLI 모델 중 gpt-6-sol(4.9분)보다 느리고 gpt-6-astra(7.1분)보다 빠릅니다.", "3 run 중 1 run이 두 번째 반복에서 완주했습니다. Solar 두 모델을 빼면 첫 반복에 끝내지 못한 유일한 경우입니다.", "영어 중심 모델이지만 한국어 조건에서 커밋과 README를 모두 한국어로 썼습니다."], "cav": "실행 도구(Codex CLI)가 Claude Code와 달라 시간은 참고용입니다. output은 Codex 기록 방식이라 다른 모델과 직접 비교할 수 없습니다. 비용은 11월 21일까지의 할인 단가 기준입니다."},
    fable:{"exp": "Claude Code · EXP-023 · 영어 · Claude 5 세대 최상위 모델", "li": ["<b>영어 중앙값 6.9분</b>(6.2–7.8분)으로 Opus 4.8보다 빠르지만, 단가가 Opus의 두 배라 <b>run당 약 $3.5</b>로 Opus 5.5의 약 3배입니다.", "생성 토큰(28.7–35.8K)은 Opus 4.8과 비슷하고 Opus 5(41–48K)보다 적습니다. 즉 Opus 5의 많은 생성량은 Claude 5 세대 공통 특징이 아니라 Opus 5만의 특징입니다.", "3 run 동안 셸 명령(Bash) 71회와 파일 쓰기 2회만 사용했고, 파일 읽기·수정 도구는 쓰지 않았습니다."], "cav": "사용자 전역 설정(외부 도구 MCP, 응답 언어)이 노출된 상태로 실행했습니다. Opus 4.8·Opus 5 실험과 같은 조건이지만 7주 뒤에 실행했습니다."},
    sol6:{"exp": "Codex CLI · EXP-027 · 영어 · GPT-6 세대", "li": ["<b>영어 중앙값 4.9분</b>(4.8–5.2분), run당 약 $0.43. 세 run 모두 약 5분·커밋 3회·output 약 11K로 run 사이 차이가 매우 작았습니다.", "이 과제에서 gpt-5.6-sol(중앙값 5.8분)과 gpt-6-astra(7.1분)보다 짧았습니다. 다만 astra는 2주 먼저, 이전 Codex CLI(0.153.4, 이번은 0.155.1)로 실행했으므로 이 차이를 모델 차이로 단정하지 않습니다.", "모든 응답이 gpt-6-sol에서 왔습니다(대체 모델 없음). 채점 후 서버 프로세스가 남은 채점 인프라 문제 1건(이탈 D-1)은 에이전트에 개입하지 않고 처리했으며 판정에 영향이 없습니다."], "cav": "2026-09-24에 Codex CLI 0.155.1, reasoning effort medium, ChatGPT 플랜 로그인으로 실행해 청구된 금액은 없습니다. 비용은 2026-09-24에 확인한 표준 단문맥 단가로 환산했습니다. 처음 요청된 gpt-6-earth는 존재하지 않는 모델 ID였습니다."},
    sol61:{"exp": "Codex CLI · EXP-033 · 영어 · GPT-6 세대, gpt-6-sol 후속", "li": ["<b>영어 중앙값 8.7분</b>(6.2–9.8분). 3 run 모두 iteration 1에 완주했고 커밋은 각 4개입니다. 루프의 복구 기여는 관측되지 않았습니다.", "<b>약 2배 길어진 이유 (세션 기록 분석)</b>: 도구 실행 시간(27–39초 대 40–55초)과 모델 호출 수(21–31회 대 26–35회)는 비슷했고, 모델 호출 한 번당 대기 시간이 약 2배(16–23초 대 7–10초)로 늘었으며 모델 대기 1초당 output은 42–45에서 29–30 토큰으로 줄었습니다. 같은 시각에 같은 요청을 번갈아 3회씩 보낸 비교(2026-10-03)에서도 gpt-6.1-sol이 약 1.4배 오래 걸렸고 output은 10–17% 많고 생성 속도는 약 20% 낮았습니다. 클라이언트 버전이 같은 pi에서도 같은 차이가 나서 클라이언트 버전은 주원인이 아닙니다. <a href=\"https://github.com/roboco-io/coding-agent-benchmark/tree/main/analysis/gpt61-sol-slowdown\">분석 문서</a>", "run당 output은 10.0–16.2K, 캐시 히트율은 92–94%였습니다. 같은 하네스의 gpt-6-sol(EXP-027, 4.8–5.2분, 10.4–11.0K)보다 세션이 길고 output 산포가 컸지만, 관측일 뿐 순위가 아닙니다.", "<b>run당 환산 비용 $0.27–0.46</b>(중앙값 $0.36). 2026-10-03에 확인한 공개 API 단가(1M 토큰당 입력 $2, 캐시 입력 $0.10, 출력 $10, Standard 272K 이하)로 계산했습니다. 캐시 입력 단가가 gpt-6-sol($0.20)의 절반인데, 입력의 92–94%가 캐시 읽기라 영향이 큽니다. ChatGPT 플랜 로그인으로 실행해 청구되지 않았습니다."], "cav": "Codex CLI 0.160.0에 이 모델의 로컬 항목이 없어 fallback 메타데이터로 동작했고, CLI 버전·날짜도 EXP-027(0.155.1/0.156.1, 2026-09-24)과 다릅니다. 세션 기록 분석은 클라이언트보다 모델 호출 지연을 가리키지만, run 단위 차이 중 측정일 영향이 얼마인지는 분리하지 못했습니다. n=3, 영어만 실험했습니다."},
    luna6:{"exp": "Codex CLI · EXP-027 · 영어 · GPT-6 세대", "li": ["<b>영어 중앙값 6.6분</b>(5.4–10.0분). <b>run당 약 $0.03으로 전체 모델 중 추정 비용이 가장 낮습니다.</b> 공개 단가가 gpt-6-sol의 1/20이기 때문입니다.", "Codex 설명은 'fast and affordable'이지만, 이 과제에서는 세 run 모두 gpt-6-sol의 어느 run보다 오래 걸렸습니다. run 1이 가장 길었고(10.0분, 커밋 8회, output 21.5K, input 누계 4.0M) run 2·3은 sol과 가까웠습니다.", "output(13.4–21.5K)과 커밋 수(4–8회)의 차이가 sol보다 컸습니다."], "cav": "gpt-6-sol과 같은 날·같은 조건에서 번갈아 실행했습니다. n=3이므로 'sol보다 느림'은 관측값이며 확정된 순위가 아닙니다. 비용은 표준 단문맥 단가로 환산했고 청구된 금액은 없습니다."},
    sonnet5:{"exp": "Claude Code · EXP-028 · 영어·한국어 · Claude 5 세대", "li": ["<b>영어 중앙값 14.2분</b>(13.0–15.3분), 한국어 14.2분(11.2–16.8분). 6 run 모두 완주했고 그중 5 run이 iteration 1에 끝났습니다.", "en-1 run에서는 에이전트가 스캐폴딩 후 한 번, 테스트 준비 후 한 번 스스로 멈췄고, iteration 3에서 API를 구현했습니다. 랄프 루프가 이렇게 나뉜 작업을 이어 받아 완주로 이어졌으며, 반려된 완료 선언은 없었습니다.", "<b>run당 약 $3.1</b>($2.67–4.21) — 입력·출력 단가가 Opus 5.5의 절반인데도 Opus 5.5(약 $1.25)보다 비쌉니다. output이 약 3배(57.6–73.7K)이고 run마다 캐시 읽기가 7–14M 토큰이었기 때문입니다."], "cav": "Opus 5.5보다 하루 늦게 Claude Code 2.1.281에서, 사용자 글로벌 설정이 노출된 상태로 실행했습니다(EXP-023/026과 같은 조건). 글로벌 '한국어로 응답' 규칙 때문에 영어 run의 최종 요약도 대부분 한국어였습니다. Opus 5.5·Fable 5.1보다 느리다는 것은 n=3 관측이며 확정된 순위가 아닙니다."},
    astra:{"exp": "Codex CLI · EXP-021 · 영어 · GPT-6 세대 첫 모델", "li": ["<b>영어 중앙값 7.1분</b>, run당 약 $2.0. 세 run의 시간 차이가 0.5분뿐이라 가장 일정한 모델 중 하나입니다.", "이전 모델 gpt-5.6-sol보다 23–32% 오래 걸렸습니다. OpenAI가 발표한 '1.9배 빠름'은 이 과제에서 재현되지 않았습니다.", "OpenAI는 Anthropic 호환 API를 제공하지 않아 Codex CLI로만 실행할 수 있습니다. sol 실험과 달라진 것은 모델 이름 하나뿐입니다."], "cav": "출시 6일 뒤에 실행했습니다. ChatGPT 플랜 로그인으로 실행해 실제 과금은 없었고, 비용은 짧은 문맥 단가로 환산했습니다."},
    kimi:{"exp": "Claude Code → Moonshot API 직접 연결 · EXP-014/016(영어) · EXP-017(한국어)", "li": ["<b>영어 중앙값 7.9분</b>, run당 약 $0.78. 하지만 run마다 7.6분에서 21.3분까지(2.8배) 달라져 <b>Claude Code에서 소요 시간을 예측하기 가장 어려운 모델</b>입니다. 커밋 수도 1–4개로 제각각입니다.", "생성 토큰이 가장 적은 편(14.4K)인데도 같은 테스트를 통과했습니다. 생성량이 적다고 결과가 나쁜 것은 아닙니다."], "cav": "thinking(추론) 기능을 끌 수 없어 켠 상태로 실행했습니다. Moonshot은 캐시 쓰기 토큰을 0으로 기록합니다."},
    opus48:{"exp": "Claude Code · EXP-010(영어) · EXP-019(한국어)", "li": ["<b>가장 안정적인 모델</b> — 6 run 모두 7.1–8.7분이었고, 영어·한국어 모두 중앙값 8.3분입니다. run당 약 $3.2.", "대부분 전체를 구현한 뒤 <b>커밋을 한 번만</b> 합니다(중앙값 1). 한국어 3 run은 모두 커밋이 1개였습니다."], "cav": ""},
    opus5:{"exp": "Claude Code · EXP-009/010(영어, 6 run) · EXP-019(한국어)", "li": ["<b>Sonnet 5 다음으로 생성 토큰이 많은 Claude 모델</b>(중앙값 47.0K)이고, <b>run당 약 $5.8로 Claude 모델 중 가장 비쌉니다.</b> 영어 중앙값 11.9분.", "작업을 <b>여러 커밋으로 나눕니다</b>(중앙값 6). 같은 프롬프트를 받은 Opus 4.8(중앙값 1)과 정반대 방식입니다."], "cav": ""},
    dspro:{"exp": "Claude Code → DeepSeek API 직접 연결 · EXP-025 · 영어·한국어", "li": ["<b>영어 중앙값 13.3분</b>으로 Flash보다 2.5–3배 느리지만, <b>run당 약 $0.52</b>로 두 번째로 쌉니다.", "한국어 3 run의 시간 차이가 0.4분뿐이고 커밋도 4·4·4개로 같아, <b>한국어 조건에서 가장 일정한 모델</b>이었습니다.", "문서에는 V4-Pro 요청이 Flash로 넘겨질 수 있다는 안내가 있었지만, 6 run의 모든 응답이 실제로 V4-Pro였습니다."], "cav": "Flash보다 먼저 나온 버전(08-13, Flash는 09-10)이라 같은 회사 안에서도 세대가 다릅니다. 비용은 가장 비싼 시간대 단가 기준입니다."},
    qwen:{"exp": "Claude Code → DashScope API 직접 연결 · EXP-013/016(영어) · EXP-017(한국어)", "li": ["<b>영어 중앙값 15.1분</b>, run당 약 $1.1. 세 run의 차이가 1.0분뿐으로 <b>소요 시간을 예측하기 가장 쉬운 모델</b>입니다.", "한국어 조건에서 <b>22.8분으로 확실히 느려진 유일한 모델</b>입니다. 두 조건의 실행 날짜가 달라 원인을 언어로 단정하지 않습니다.", "API 주소·키·모델 이름 세 가지만 바꿔 연결했고 따로 문제를 해결할 일이 없었습니다. 이 결과로 '제공자 API 직접 연결'이 이 벤치마크의 기본 방식이 됐습니다."], "cav": "비용은 싱가포르 리전 단가 기준입니다."},

    pro4:{"exp": "Claude Code → Upstage API 직접 연결 · EXP-020 · 영어", "li": ["<b>가장 오래 걸린 모델</b>(119–258분). 세션 기록을 분석해 보니 캐시 미지원, 요청당 평균 37초의 왕복 시간, 생성 토큰의 88%가 thinking이라는 세 요인이 겹친 결과였습니다.", "3 run 모두 완주했습니다. 느린 원인은 프리뷰 서비스의 응답 속도와 캐시 부재이며, 모델이 과제를 풀지 못한 것은 아닙니다.", "run 1에서는 관련 없는 npm 패키지가 채점 프로그램을 가려 정상 완주 선언이 9번 실패로 처리됐습니다. 나중에 다시 채점해 실제 완주 시점을 확정했습니다."], "cav": "비용 $8.0은 정가 환산입니다. 캐시가 기록되지 않아 입력 전체가 비캐시 단가로 계산돼 높게 나왔으며, 실행 당시는 무료·할인 기간이었습니다."}

  notesTitle:"조사 노트", notesSmall:"변환 프록시를 쓰지 않는 이유 · 채점기 오류 3건 · 정정 기록",
  notes:[["① 모델 연결에 변환 프록시(ccr)를 쓰지 않는 이유", "Claude Code는 Anthropic API 형식으로 요청을 보냅니다. OpenAI 형식만 받는 모델에 연결하려면 중간에서 형식을 바꿔 주는 프록시(ccr, claude-code-router)가 필요한데, 초기 실험에서 이 프록시가 여러 문제를 일으켰습니다. 도구 호출 인자가 훼손됐고(EXP-006: 여러 조각으로 나뉘어 온 응답 중 첫 조각만 처리해 <span class=\"mono\">python3</span>가 <span class=\"mono\">3</span>으로 바뀜), 토큰 사용량 기록이 빠졌으며(EXP-012), 모델마다 변환 코드를 따로 작성해야 했고, 응답이 멈추거나 컨텍스트 한도 설정 누락으로 실행이 중단됐습니다. 반면 제공자가 공식 제공하는 Anthropic 호환 API(Upstage·DashScope·Moonshot·DeepSeek)에 직접 연결하면 이런 문제가 한 번도 없었습니다. 그래서 프록시를 거친 결과는 비교에서 뺐습니다. 빼는 이유는 속도가 아니라 오류와 측정 왜곡입니다(프록시가 느리다는 점은 모델 차이와 구분되지 않아 확인되지 않았습니다). Anthropic 호환 API가 없는 OpenAI 모델은 OpenAI 공식 도구인 Codex CLI로 실행합니다. EXP-029에서 추가한 제3의 도구 pi coding agent는 OpenAI 형식을 기본으로 쓰므로, 변환 프록시 없이 제공자의 OpenAI 호환 API에 연결했습니다. EXP-005/006/012의 원자료와 보고서는 리포에 그대로 남아 있습니다."], ["② 채점기가 정상 완주를 실패로 처리한 3건", "에이전트가 완료를 선언하면 채점 스크립트가 서버를 띄워 공식 테스트를 돌립니다. 이 스크립트가 실제로는 완주한 결과를 실패로 처리한 경우가 세 번 있었습니다. EXP-010 run 48-1은 채점용 테스트 파일이 복사되지 않았습니다. EXP-015 iteration 2는 <span class=\"mono\">npx tsx</span>로 띄운 서버의 명령줄에 리포 경로가 없어 채점기가 서버 포트를 찾지 못했습니다(프로세스의 작업 디렉토리로 찾도록 채점 스크립트를 고침, measure v4). EXP-020 pro4-1은 실험 11일 전에 설치된 관련 없는 npm 패키지(<span class=\"mono\">@hurl/cli</span>)가 진짜 테스트 도구 Hurl 8.0.1을 PATH에서 가려, 정상 완주 선언이 9번 연속 실패로 처리됐습니다. <b>교훈: 실패 판정은 채점 로그를 확인한 뒤에만 확정하고, 채점에 쓰는 프로그램의 경로까지 고정해야 합니다.</b> EXP-021부터 처음부터 절대 경로를 고정했고, 그 뒤로 이런 오류는 없었습니다."], ["③ 정정·제외 기록 (2026-08-04)", "초기 정리에서 EXP-006 open2-2와 EXP-008을 프록시(ccr)를 거친 실행으로 잘못 적었지만, 확인해 보니 둘 다 Upstage API 직접 연결이었습니다. 대시보드와 리포 문서를 함께 고치고 '직접 연결이 프록시보다 빠르다'는 설명을 철회했습니다. EXP-008은 지금의 표준 프롬프트가 정해지기 전 프롬프트로 실행했기 때문에(iteration 10, 약 173분), 같은 모델·연결 방식을 표준 조건으로 다시 실행한 EXP-015로 대체하고 비교에서 뺐습니다."], ["", "<b>세 조사의 공통 교훈:</b> 벤치마크 결과의 신뢰성은 모델보다 실험 환경 관리에 달려 있었습니다. 형식 변환 프록시를 없애고, 실행 환경을 다른 설정과 격리하고, 채점기의 실패 판정도 로그로 검증해야 합니다."]],

  cavs:["<b>판정 기준은 완주 여부 하나뿐입니다.</b> 109 run이 모두 완주했기 때문에 모델 사이의 차이는 시간·커밋·output·비용에서만 보입니다. 그런데 소요 시간만 봐도 같은 모델·같은 조건에서 run마다 최대 2.8배까지 달라지고, 조건마다 3번(일부 1번)만 실행했으며, 과제도 RealWorld 백엔드 하나뿐입니다. 표의 순위는 참고용이며 '어느 모델이 더 효율적이다'라는 결론의 근거로 쓰지 마세요.", "<b>비용은 실제로 낸 돈이 아니라 추정치입니다.</b> run마다 쓴 토큰을 비캐시 입력·캐시 읽기·캐시 쓰기·출력으로 나누고, 2026-09-23(gpt-6-sol·gpt-6-luna는 09-24, Sonnet 5.5는 09-29이며 캐시 쓰기 단가는 표준 배수로 가정해 미확인)에 확인한 각 제공자의 공개 API 단가를 곱했습니다. gpt-6.1-sol(EXP-033/034)은 2026-10-03에 확인한 공개 API 단가(1M 토큰당 $2 / 캐시 $0.10 / $10)를 썼습니다. gemini-3.8-flash(EXP-035/036)는 2026-10-07에 확인한 공개 단가(1M 토큰당 $0.75 / 캐시 $0.075 / $3.75, 2026-12-31까지이며 2027-01-01부터 두 배)를 썼습니다. 이 run들은 종량 과금 Gemini API 키로 실행해 실제 과금이 있었지만 청구액은 확인하지 않았습니다. 실제 실행은 Claude는 구독, GPT 다섯 모델은 ChatGPT 플랜 로그인, Solar는 무료·할인 기간의 프리뷰로 했기 때문에 이 금액이 청구되지 않았습니다. 적용한 단가: DeepSeek는 가장 비싼 시간대 단가(다른 시간대는 절반이므로 상한값), gpt-5.6-sol은 11월 21일까지의 할인 단가, qwen은 싱가포르 리전 단가, Claude의 캐시 쓰기는 1시간 보관 단가. run 안의 재시도와 추가 세션도 포함했습니다. Solar Open 2는 공개 단가가 없어 계산하지 않았습니다. pi run(EXP-029/030/032)은 pi 세션 토큰 기록에 같은 단가를 곱했습니다. pi × Opus 5.5(EXP-030)와 pi × Sonnet 5.5(EXP-032)는 종량제 Anthropic API 키로 실행했고 캐시 쓰기는 pi 기본값인 5분 보관 단가로 계산했습니다. pi × gpt-6-sol은 ChatGPT 플랜 로그인이라 청구되지 않았습니다. 실제 청구액은 측정하지 않았습니다. <a href=\"https://github.com/roboco-io/coding-agent-benchmark/tree/main/analysis/cost\">계산 방법·단가 출처·run별 데이터 ↗</a>", "<b>모델마다 토큰 기록 방식이 다릅니다.</b> output은 Claude Code 세션 기록(칠한 막대)과 Codex 기록(테두리 막대) 두 가지 방식으로 측정했고, 둘은 서로 비교할 수 없습니다. 캐시 사용량도 제공자마다 기록 범위가 다릅니다. Anthropic·DashScope는 캐시 읽기와 쓰기를 모두 기록하고, Moonshot·DeepSeek는 읽기만, Upstage는 둘 다 기록하지 않습니다. pi(EXP-029)에서는 Moonshot도 캐시 쓰기를 기록했고, output은 pi 세션 기록으로 계측했습니다.", "<b>실행 도구가 다르면 시간은 참고용입니다.</b> GPT 네 모델(gpt-5.6-sol, gpt-6-astra, gpt-6-sol, gpt-6-luna)은 OpenAI의 Codex CLI로, 나머지는 Claude Code로 실행했습니다. 두 도구는 시작에 걸리는 시간과 도구 호출 방식이 달라, 시간 차이의 일부는 도구 차이일 수 있습니다. 같은 도구끼리(Claude Code 모델끼리, 또는 GPT 모델끼리) 비교할 때만 도구 차이가 빠집니다. pi 세 행(EXP-029)은 제3의 도구인 pi coding agent를 각 제공자의 OpenAI 호환 API에 연결해 실행했습니다. 같은 모델의 Claude Code 실행과 비교하면 도구와 API 형식이 함께 달라, 차이를 어느 한쪽 탓으로 돌릴 수 없습니다.", "<b>실험마다 클라이언트 버전이 다릅니다.</b> 각 행에는 사용한 에이전트 CLI 버전(Claude Code·Codex CLI·pi)을 적었고, 실험 상세와 원 수치 표의 클라이언트 열에서도 볼 수 있습니다. 여기 표시한 실험에서 버전은 Claude Code 2.1.220부터 2.1.284까지, Codex CLI 0.144.0부터 0.160.0까지 걸쳐 있고, EXP-027 한 실험은 Codex 두 버전에서 실행됐습니다. 시작 시간·도구 호출 처리·컨텍스트 관리가 버전마다 달라질 수 있어, 실험 사이의 시간 차이에는 모델 차이와 함께 클라이언트 버전 차이가 들어 있습니다. “미기록”은 실험 문서와 세션 기록 어디에서도 버전을 확인하지 못했다는 뜻입니다. 전체 표: <a href=\"https://github.com/roboco-io/coding-agent-benchmark/blob/main/analysis/client-versions.md\">analysis/client-versions.md ↗</a>", "<b>실험마다 실행 날짜가 다릅니다</b>(2026-07-24 – 10-07). 그사이 제공자 서버 상태와 Claude Code 버전이 바뀌었을 수 있습니다. 영어와 한국어 조건을 다른 날 실행한 경우가 많아(최대 12일 차이) 언어 때문에 달라졌다고 단정하지 않습니다. 최근 모델(gpt-6-astra, gpt-6-sol, gpt-6-luna, Fable 5.1, Opus 5.5, Sonnet 5.5)은 다른 모델보다 3–10주 뒤에 실행해, 세대 간 속도 비교에도 날짜 차이가 섞여 있습니다.", "<b>Solar 두 모델은 정식 서비스가 아닌 프리뷰 API로 측정했습니다.</b> 신청해야 쓸 수 있는 베타 서비스로, 캐시를 지원하지 않고 요청 한 번의 왕복에 평균 37초가 걸렸으며 예고 없이 종료되기도 했습니다. 이 두 모델의 시간과 토큰 수를 정식 서비스 성능으로 읽지 마세요.", "<b>이전 실험의 미완주 2건(EXP-005/006)은 모델 탓이 아니었습니다.</b> 원인 분석 실험(EXP-007)에서 실행 환경에 섞여 들어간 설정과 토큰 측정 오류가 주된 원인으로 확인됐고, 환경을 격리하자 같은 모델이 완주했습니다. '이 모델은 완주하지 못한다'는 결론은 환경 격리와 원인 분석 없이 내릴 수 없습니다."],
