<style>
:root{
  --ground:#EDF0F4; --surface:#FBFCFE; --sunk:#E4E8EE;
  --ink:#131A24; --ink-2:#3C4757; --muted:#5B6879; --faint:#8B97A6;
  --line:#DCE2EA; --hair:#E9EDF2; --track:#DFE4EB;
  --native:#3E63DD; --direct:#0E9384; --codex:#C4551A;
  --flag:#8A6A1E; --flag-bg:#F4EEDD;
  --focus:#3E63DD;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0E1116; --surface:#14181F; --sunk:#191E26;
  --ink:#E3E9F1; --ink-2:#B8C2CF; --muted:#8C97A7; --faint:#6B7686;
  --line:#252C36; --hair:#1E242C; --track:#252C36;
  --native:#6E8BF5; --direct:#1FA189; --codex:#D0722F;
  --flag:#C9A85C; --flag-bg:#221E14;
  --focus:#6E8BF5;
}}
:root[data-theme="dark"]{
  --ground:#0E1116; --surface:#14181F; --sunk:#191E26;
  --ink:#E3E9F1; --ink-2:#B8C2CF; --muted:#8C97A7; --faint:#6B7686;
  --line:#252C36; --hair:#1E242C; --track:#252C36;
  --native:#6E8BF5; --direct:#1FA189; --codex:#D0722F;
  --flag:#C9A85C; --flag-bg:#221E14;
  --focus:#6E8BF5;
}

*{box-sizing:border-box}
body{
  background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-weight:400; line-height:1.6; letter-spacing:-.005em;
  margin:0; padding-block:clamp(28px,5vw,56px); padding-left:20px; padding-right:20px;
}
html[lang="ja"] body{font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",-apple-system,BlinkMacSystemFont,sans-serif; letter-spacing:0;}
html[lang="zh-CN"] body{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,sans-serif; letter-spacing:0;}
html[lang="en"] body{font-family:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
.wrap{max-width:1120px; margin:0 auto; display:flex; flex-direction:column; gap:clamp(28px,4vw,44px);}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; font-variant-numeric:tabular-nums;}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:.68rem; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); margin:0;}
a{color:var(--native); text-underline-offset:3px; text-decoration-thickness:1px;}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:2px;}

/* ── header ───────────────────────────── */
header{display:flex; flex-direction:column; gap:14px;}
.topbar{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; justify-content:space-between;}
.langs{display:inline-flex; border:1px solid var(--line); border-radius:2px; overflow:hidden; background:var(--sunk);}
.langs button{font:inherit; font-size:.74rem; font-weight:500; padding:5px 11px; border:none; background:transparent; color:var(--muted); cursor:pointer; white-space:nowrap;}
.langs button[aria-pressed="true"]{background:var(--ink); color:var(--surface);}
h1{font-size:clamp(1.6rem,4.4vw,2.3rem); font-weight:700; letter-spacing:-.03em; margin:0; text-wrap:balance; line-height:1.2;}
html[lang="ja"] h1, html[lang="zh-CN"] h1{letter-spacing:-.01em;}
.deck{color:var(--ink-2); margin:0; font-size:.95rem; max-width:64ch;}
.deck b{font-weight:600; color:var(--ink);}
.repo{display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; max-width:78ch;
  border-left:3px solid var(--native); padding:4px 0 4px 14px;}
.repo p{margin:0; flex:1 1 320px; font-size:.88rem; color:var(--ink-2);}
.repo p b{color:var(--ink); font-weight:600;}
.repo-link{flex:none; font-size:.84rem; font-weight:600; text-decoration:none; border:1px solid var(--native);
  padding:6px 12px; border-radius:2px; white-space:nowrap;}
.repo-link:hover{background:var(--native); color:var(--surface);}
.flagnote{display:flex; gap:10px; align-items:flex-start; font-size:.82rem; color:var(--ink-2);
  background:var(--flag-bg); border:1px solid color-mix(in srgb,var(--flag) 26%,transparent);
  padding:11px 14px; border-radius:2px; max-width:78ch;}
.flagnote::before{content:"⚑"; color:var(--flag); font-size:.9rem; line-height:1.5;}


/* ── panel ────────────────────────────── */
.panel{background:var(--surface); border:1px solid var(--line); border-radius:3px; padding:clamp(18px,3vw,26px);}
.panel-head{display:flex; flex-wrap:wrap; gap:12px 20px; align-items:flex-end; justify-content:space-between; margin-bottom:6px;}
h2{font-size:1.12rem; font-weight:600; letter-spacing:-.02em; margin:0;}
.sub{color:var(--muted); font-size:.82rem; margin:6px 0 0; max-width:76ch;}

/* ── controls ─────────────────────────── */
.controls{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:18px 0 12px;}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:2px; overflow:hidden; background:var(--sunk);}
.seg button{font:inherit; font-size:.78rem; font-weight:500; padding:6px 15px; border:none; background:transparent; color:var(--muted); cursor:pointer;}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--surface);}
.hint{font-size:.74rem; color:var(--faint);}
.legend{display:flex; flex-wrap:wrap; gap:8px 16px; font-size:.74rem; color:var(--muted); align-items:center;}
.legend i{display:inline-block; width:10px; height:10px; border-radius:1px; margin-right:6px; vertical-align:-1px;}
.legend i.out{background:transparent; border:1.5px solid var(--muted);}

/* ── matrix ───────────────────────────── */
.scroller{overflow-x:auto; margin-top:4px;}
table.mx{border-collapse:collapse; width:100%; min-width:940px;}
table.mx th{text-align:left; vertical-align:bottom; padding:0 12px 8px 0; border-bottom:1px solid var(--line);}
table.mx th button{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:.68rem; letter-spacing:.12em; text-transform:uppercase;
  color:var(--muted); background:none; border:none; padding:0; cursor:pointer; display:inline-flex; gap:5px; align-items:center;}
html[lang="ja"] table.mx th button, html[lang="zh-CN"] table.mx th button, html[lang="ko"] table.mx th button{font-family:inherit; letter-spacing:.04em; font-size:.72rem;}
table.mx th button:hover{color:var(--ink);}
table.mx th button .dir{font-size:.7rem; opacity:0; }
table.mx th[aria-sort] button{color:var(--ink); font-weight:600;}
table.mx th[aria-sort] button .dir{opacity:1;}
.scale{margin-top:7px; height:11px; position:relative; overflow:hidden; font-family:"IBM Plex Mono",monospace; font-size:.6rem; color:var(--faint); letter-spacing:0; font-weight:400; text-transform:none;}
.scale span{position:absolute; top:0; transform:translateX(-50%); white-space:nowrap;}
.scale span:first-child{transform:none;}
.scale span:last-child{transform:translateX(-100%);}
.scale span:only-child{transform:none;}
table.mx td{padding:11px 12px 11px 0; border-bottom:1px solid var(--hair); vertical-align:middle;}
table.mx tbody tr:hover{background:var(--sunk);}
table.mx tbody tr.dim td{opacity:.42;}

.mdl{display:flex; flex-direction:column; gap:3px; min-width:172px;}
.mdl .nm{font-weight:600; font-size:.92rem; letter-spacing:-.01em; display:flex; align-items:center; gap:7px;}
.swatch{width:9px; height:9px; border-radius:1px; flex:none;}
.mdl .st{font-family:"IBM Plex Mono",monospace; font-size:.66rem; color:var(--muted); letter-spacing:.02em; padding-left:16px;}
.pv{font-family:"IBM Plex Mono",monospace; font-size:.6rem; letter-spacing:.06em; color:var(--flag);
  border:1px solid color-mix(in srgb,var(--flag) 40%,transparent); border-radius:2px; padding:0 4px; white-space:nowrap;}
.done{font-family:"IBM Plex Mono",monospace; font-size:.8rem; white-space:nowrap;}
.done small{display:block; font-size:.64rem; color:var(--muted); letter-spacing:.02em; font-family:"IBM Plex Mono",monospace;}

.cell{display:flex; flex-direction:column; gap:5px; min-width:150px;}
.bar{position:relative; height:13px; background:var(--track); border-radius:1px;}
.bar .rng{position:absolute; top:0; height:13px; border-radius:1px; min-width:3px;}
.bar .rng.out{background:transparent!important; border:1.5px solid currentColor;}
.bar .med{position:absolute; top:-2px; width:2px; height:17px; background:var(--ink); border-radius:1px;}
.bar .pt{position:absolute; top:1px; width:11px; height:11px; border-radius:50%; transform:translateX(-5.5px);}
.figs{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-size:.76rem; white-space:nowrap; letter-spacing:-.01em;}
.figs em{font-style:normal; font-weight:600;}
.figs small{color:var(--muted); font-size:.92em;}
.na{font-family:"IBM Plex Mono",monospace; font-size:.75rem; color:var(--faint);}

.dots{display:flex; gap:3px; align-items:center; min-width:96px;}
.dots i{width:7px; height:7px; border-radius:50%; background:var(--track); flex:none;}
.dots i.on{background:currentColor;}

.callout{margin-top:20px; display:grid; grid-template-columns:auto 1fr; gap:14px; align-items:start;
  border-top:2px solid var(--ink); padding-top:14px;}
.callout .eyebrow{white-space:nowrap; padding-top:3px;}
.callout p{margin:0; font-size:.87rem; color:var(--ink-2); max-width:80ch;}
.callout p b{color:var(--ink); font-weight:600;}
.callout p + p{margin-top:8px;}
.howlist{margin:0; padding-left:18px; display:flex; flex-direction:column; gap:8px; max-width:80ch;}
.howlist li{font-size:.87rem; color:var(--ink-2); line-height:1.6;}
.howlist li b{color:var(--ink); font-weight:600;}

/* ── cards ────────────────────────────── */
.cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(310px,1fr)); gap:14px;}
.card{background:var(--surface); border:1px solid var(--line); border-radius:3px; padding:18px 20px 20px; display:flex; flex-direction:column; gap:9px;}
.card h3{margin:0; font-size:.98rem; font-weight:600; letter-spacing:-.015em; display:flex; align-items:center; gap:7px; flex-wrap:wrap;}
.card .exp{font-family:"IBM Plex Mono",monospace; font-size:.66rem; color:var(--faint); letter-spacing:.04em; margin:0;}
.card ul{margin:0; padding-left:15px; display:flex; flex-direction:column; gap:6px;}
.card li{font-size:.83rem; color:var(--ink-2); line-height:1.55;}
.card li b{color:var(--ink); font-weight:600;}
.card .cav{margin:2px 0 0; font-size:.73rem; color:var(--muted); padding-top:9px; border-top:1px dotted var(--line);}

/* ── drawers ──────────────────────────── */
details{background:var(--surface); border:1px solid var(--line); border-radius:3px;}
details + details{margin-top:10px;}
summary{cursor:pointer; padding:15px 20px; font-weight:600; font-size:.92rem; letter-spacing:-.015em; display:flex; gap:10px; align-items:baseline; list-style:none;}
summary::-webkit-details-marker{display:none}
summary::before{content:"+"; font-family:"IBM Plex Mono",monospace; color:var(--faint); font-weight:400;}
details[open] summary::before{content:"–";}
summary small{font-weight:400; color:var(--muted); font-size:.76rem;}
.body{padding:0 20px 20px; display:flex; flex-direction:column; gap:12px;}
.body p, .body li{font-size:.84rem; color:var(--ink-2); max-width:82ch; margin:0; line-height:1.62;}
.body h4{margin:8px 0 0; font-size:.85rem; font-weight:600; color:var(--ink);}
.body ul{margin:0; padding-left:17px; display:flex; flex-direction:column; gap:7px;}
table.raw{border-collapse:collapse; width:100%; min-width:840px; font-size:.78rem;}
table.raw th{font-family:"IBM Plex Mono",monospace; font-size:.63rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); text-align:left; font-weight:500; padding:7px 10px 7px 0; border-bottom:1px solid var(--line);}
html[lang="ja"] table.raw th, html[lang="zh-CN"] table.raw th, html[lang="ko"] table.raw th{font-family:inherit; letter-spacing:.04em; font-size:.68rem;}
table.raw td{padding:7px 10px 7px 0; border-bottom:1px solid var(--hair); vertical-align:top;}
table.raw td.n{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; white-space:nowrap;}
table.raw td.g{font-weight:600;}

footer{font-size:.75rem; color:var(--faint); border-top:1px solid var(--line); padding-top:16px;}

@media (max-width:640px){
  .callout{grid-template-columns:1fr; gap:6px;}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>

  notesTitle:"Investigation notes", notesSmall:"why no translation proxy · 3 grader errors · corrections",
  notes:[["① Why models are not connected through a translation proxy (ccr)", "Claude Code sends requests in Anthropic's API format. Connecting it to a model that only accepts OpenAI's format needs a proxy that converts between them (ccr, claude-code-router), and in early experiments that proxy caused several problems. Tool-call arguments were corrupted (EXP-006: only the first of several streamed pieces was handled, turning <span class=\"mono\">python3</span> into <span class=\"mono\">3</span>), token usage went unrecorded (EXP-012), each model needed its own conversion code, and runs stalled or crashed when context limits weren't set. Connecting directly to the provider's official Anthropic-compatible API (Upstage, DashScope, Moonshot, DeepSeek) never caused any of this. So results that went through the proxy are left out of the comparison. The reason is errors and distorted measurement, not speed (whether the proxy was slower could not be separated from model differences). OpenAI models, which have no Anthropic-compatible API, run through OpenAI's own Codex CLI. The raw data and reports for EXP-005/006/012 remain in the repository."], ["② Three times the grader failed a genuine completion", "When the agent declares it is done, a grading script starts the server and runs the official tests. Three times this script marked a real completion as failed. EXP-010 run 48-1: the test files were not copied. EXP-015 iteration 2: a server started with <span class=\"mono\">npx tsx</span> has no repository path on its command line, so the grader could not find its port (fixed by locating it through the process's working directory, measure v4). EXP-020 pro4-1: an unrelated npm package (<span class=\"mono\">@hurl/cli</span>) installed 11 days earlier hid the real Hurl 8.0.1 test tool on PATH, and 9 genuine completion claims in a row were marked as failed. <b>Lesson: confirm a failure only after reading the grader's log, and pin even the paths of the programs the grader uses.</b> From EXP-021 on, absolute paths were pinned from the start, and this error has not happened since."], ["③ Corrections and exclusions (2026-08-04)", "An early write-up recorded EXP-006 open2-2 and EXP-008 as going through the proxy (ccr); both were in fact direct Upstage API connections. The dashboard and repository documents were corrected together and the claim that direct connection is faster than the proxy was withdrawn. EXP-008 ran on a prompt from before the current standard prompt was fixed (iteration 10, about 173 min), so it was replaced by EXP-015 — the same model and connection re-run under standard conditions — and left out of the comparison."], ["", "<b>What all three have in common:</b> the reliability of the results depended more on managing the test environment than on the models. Remove format-converting proxies, isolate the runs from other settings, and check even the grader's failures against its log."]],
  cavTitle:"Reading caveats", cavSmall:"what these numbers cannot tell you",
  cavs:["<b>The only verdict is whether a run finished.</b> All 73 runs finished, so differences between models show up only in time, commits, output and cost. Those numbers vary up to 2.8× between runs of the same model under the same condition, each condition ran only 3 times (some once), and there is a single task, a RealWorld backend. Treat the rankings as a reference, not as evidence that one model is more efficient.", "<b>Cost is an estimate, not money actually spent.</b> Each run's tokens are split into uncached input, cache read, cache write and output, then multiplied by each provider's public API price as checked on 2026-09-23 (gpt-6-sol and gpt-6-luna on 09-24). The runs themselves used a Claude subscription, a ChatGPT-plan login for the four GPT models, and a free/promotional preview for Solar, so none of this was billed. Prices used: DeepSeek at its peak-hour price (an upper bound — off-peak is half), gpt-5.6-sol at its promotional price valid until Nov 21, qwen at Singapore-region prices, and Claude cache writes at the 1-hour retention price. Retries and extra sessions within a run are included. Solar Open 2 has no public price, so it has no cost. <a href=\"https://github.com/roboco-io/coding-agent-benchmark/tree/main/analysis/cost\">Method, price sources and per-run data ↗</a>", "<b>Models record tokens differently.</b> Output was measured two ways — Claude Code session logs (filled bars) and Codex records (outlined bars) — and the two can't be compared. Providers also record caching differently: Anthropic and DashScope record both cache reads and writes, Moonshot and DeepSeek only reads, and Upstage neither.", "<b>With different tools, treat time as a reference.</b> The four GPT models (gpt-5.6-sol, gpt-6-astra, gpt-6-sol, gpt-6-luna) ran on OpenAI's Codex CLI; everything else ran on Claude Code. The two tools start up and call tools differently, so part of a time gap may come from the tool. Only comparisons within one tool (Claude Code models with each other, or the GPT models with each other) remove that difference.", "<b>Experiments ran on different dates</b> (2026-07-24 – 09-24). Provider servers and the Claude Code version may have changed in between. EN and KO often ran on different days (up to 12 days apart), so differences are not attributed to language. The newest models (gpt-6-astra, gpt-6-sol, gpt-6-luna, Fable 5.1, Opus 5.5) ran 3–9 weeks after the others, so date differences also mix into cross-generation speed comparisons.", "<b>Both Solar models were measured on preview APIs, not the full service.</b> These were apply-to-use betas with no caching, a 37-second average round-trip per request, and shutdowns without notice. Don't read their time or token counts as production performance.", "<b>The two earlier non-completions (EXP-005/006) were not the model's fault.</b> A follow-up investigation (EXP-007) found stray settings in the run environment and token-measurement errors to be the main causes; once the environment was isolated, the same model finished. “This model can't finish” is not a conclusion you can draw without isolating the environment and investigating the cause."],
  footer:"coding-agent-benchmark · latest update EXP-028 (2026-09-24) · raw logs, usage CSVs and orchestrator logs are kept in each experiment's <span class=\"mono\">runs/</span> directory."

    fable:{"exp": "Claude Code · EXP-023 · 영어 · Claude 5 세대 최상위 모델", "li": ["<b>영어 중앙값 6.9분</b>(6.2–7.8분)으로 Opus 4.8보다 빠르지만, 단가가 Opus의 두 배라 <b>run당 약 $3.5</b>로 Opus 5.5의 약 3배입니다.", "생성 토큰(28.7–35.8K)은 Opus 4.8과 비슷하고 Opus 5(41–48K)보다 적습니다. 즉 Opus 5의 많은 생성량은 Claude 5 세대 공통 특징이 아니라 Opus 5만의 특징입니다.", "3 run 동안 셸 명령(Bash) 71회와 파일 쓰기 2회만 사용했고, 파일 읽기·수정 도구는 쓰지 않았습니다."], "cav": "사용자 전역 설정(외부 도구 MCP, 응답 언어)이 노출된 상태로 실행했습니다. Opus 4.8·Opus 5 실험과 같은 조건이지만 7주 뒤에 실행했습니다."},
    sol6:{"exp": "Codex CLI · EXP-027 · 영어 · GPT-6 세대", "li": ["<b>영어 중앙값 4.9분</b>(4.8–5.2분), run당 약 $0.43. 세 run 모두 약 5분·커밋 3회·output 약 11K로 run 사이 차이가 매우 작았습니다.", "이 과제에서 gpt-5.6-sol(중앙값 5.8분)과 gpt-6-astra(7.1분)보다 짧았습니다. 다만 astra는 2주 먼저, 이전 Codex CLI(0.153.4, 이번은 0.155.1)로 실행했으므로 이 차이를 모델 차이로 단정하지 않습니다.", "모든 응답이 gpt-6-sol에서 왔습니다(대체 모델 없음). 채점 후 서버 프로세스가 남은 채점 인프라 문제 1건(이탈 D-1)은 에이전트에 개입하지 않고 처리했으며 판정에 영향이 없습니다."], "cav": "2026-09-24에 Codex CLI 0.155.1, reasoning effort medium, ChatGPT 플랜 로그인으로 실행해 청구된 금액은 없습니다. 비용은 2026-09-24에 확인한 표준 단문맥 단가로 환산했습니다. 처음 요청된 gpt-6-earth는 존재하지 않는 모델 ID였습니다."},
    luna6:{"exp": "Codex CLI · EXP-027 · 영어 · GPT-6 세대", "li": ["<b>영어 중앙값 6.6분</b>(5.4–10.0분). <b>run당 약 $0.03으로 전체 모델 중 추정 비용이 가장 낮습니다.</b> 공개 단가가 gpt-6-sol의 1/20이기 때문입니다.", "Codex 설명은 'fast and affordable'이지만, 이 과제에서는 세 run 모두 gpt-6-sol의 어느 run보다 오래 걸렸습니다. run 1이 가장 길었고(10.0분, 커밋 8회, output 21.5K, input 누계 4.0M) run 2·3은 sol과 가까웠습니다.", "output(13.4–21.5K)과 커밋 수(4–8회)의 차이가 sol보다 컸습니다."], "cav": "gpt-6-sol과 같은 날·같은 조건에서 번갈아 실행했습니다. n=3이므로 'sol보다 느림'은 관측값이며 확정된 순위가 아닙니다. 비용은 표준 단문맥 단가로 환산했고 청구된 금액은 없습니다."},
    sonnet5:{"exp": "Claude Code · EXP-028 · 영어·한국어 · Claude 5 세대", "li": ["<b>영어 중앙값 14.2분</b>(13.0–15.3분), 한국어 14.2분(11.2–16.8분). 6 run 모두 완주했고 그중 5 run이 iteration 1에 끝났습니다.", "en-1 run에서는 에이전트가 스캐폴딩 후 한 번, 테스트 준비 후 한 번 스스로 멈췄고, iteration 3에서 API를 구현했습니다. 랄프 루프가 이렇게 나뉜 작업을 이어 받아 완주로 이어졌으며, 반려된 완료 선언은 없었습니다.", "<b>run당 약 $3.1</b>($2.67–4.21) — 입력·출력 단가가 Opus 5.5의 절반인데도 Opus 5.5(약 $1.25)보다 비쌉니다. output이 약 3배(57.6–73.7K)이고 run마다 캐시 읽기가 7–14M 토큰이었기 때문입니다."], "cav": "Opus 5.5보다 하루 늦게 Claude Code 2.1.281에서, 사용자 글로벌 설정이 노출된 상태로 실행했습니다(EXP-023/026과 같은 조건). 글로벌 '한국어로 응답' 규칙 때문에 영어 run의 최종 요약도 대부분 한국어였습니다. Opus 5.5·Fable 5.1보다 느리다는 것은 n=3 관측이며 확정된 순위가 아닙니다."},
    astra:{"exp": "Codex CLI · EXP-021 · 영어 · GPT-6 세대 첫 모델", "li": ["<b>영어 중앙값 7.1분</b>, run당 약 $2.0. 세 run의 시간 차이가 0.5분뿐이라 가장 일정한 모델 중 하나입니다.", "이전 모델 gpt-5.6-sol보다 23–32% 오래 걸렸습니다. OpenAI가 발표한 '1.9배 빠름'은 이 과제에서 재현되지 않았습니다.", "OpenAI는 Anthropic 호환 API를 제공하지 않아 Codex CLI로만 실행할 수 있습니다. sol 실험과 달라진 것은 모델 이름 하나뿐입니다."], "cav": "출시 6일 뒤에 실행했습니다. ChatGPT 플랜 로그인으로 실행해 실제 과금은 없었고, 비용은 짧은 문맥 단가로 환산했습니다."},
    kimi:{"exp": "Claude Code → Moonshot API 직접 연결 · EXP-014/016(영어) · EXP-017(한국어)", "li": ["<b>영어 중앙값 7.9분</b>, run당 약 $0.78. 하지만 run마다 7.6분에서 21.3분까지(2.8배) 달라져 <b>소요 시간을 예측하기 가장 어려운 모델</b>입니다. 커밋 수도 1–4개로 제각각입니다.", "생성 토큰이 가장 적은 편(14.4K)인데도 같은 테스트를 통과했습니다. 생성량이 적다고 결과가 나쁜 것은 아닙니다."], "cav": "thinking(추론) 기능을 끌 수 없어 켠 상태로 실행했습니다. Moonshot은 캐시 쓰기 토큰을 0으로 기록합니다."},
    opus48:{"exp": "Claude Code · EXP-010(영어) · EXP-019(한국어)", "li": ["<b>가장 안정적인 모델</b> — 6 run 모두 7.1–8.7분이었고, 영어·한국어 모두 중앙값 8.3분입니다. run당 약 $3.2.", "대부분 전체를 구현한 뒤 <b>커밋을 한 번만</b> 합니다(중앙값 1). 한국어 3 run은 모두 커밋이 1개였습니다."], "cav": ""},
    opus5:{"exp": "Claude Code · EXP-009/010(영어, 6 run) · EXP-019(한국어)", "li": ["<b>Sonnet 5 다음으로 생성 토큰이 많은 Claude 모델</b>(중앙값 47.0K)이고, <b>run당 약 $5.8로 Claude 모델 중 가장 비쌉니다.</b> 영어 중앙값 11.9분.", "작업을 <b>여러 커밋으로 나눕니다</b>(중앙값 6). 같은 프롬프트를 받은 Opus 4.8(중앙값 1)과 정반대 방식입니다."], "cav": ""},
    dspro:{"exp": "Claude Code → DeepSeek API 직접 연결 · EXP-025 · 영어·한국어", "li": ["<b>영어 중앙값 13.3분</b>으로 Flash보다 2.5–3배 느리지만, <b>run당 약 $0.52</b>로 두 번째로 쌉니다.", "한국어 3 run의 시간 차이가 0.4분뿐이고 커밋도 4·4·4개로 같아, <b>한국어 조건에서 가장 일정한 모델</b>이었습니다.", "문서에는 V4-Pro 요청이 Flash로 넘겨질 수 있다는 안내가 있었지만, 6 run의 모든 응답이 실제로 V4-Pro였습니다."], "cav": "Flash보다 먼저 나온 버전(08-13, Flash는 09-10)이라 같은 회사 안에서도 세대가 다릅니다. 비용은 가장 비싼 시간대 단가 기준입니다."},
    qwen:{"exp": "Claude Code → DashScope API 직접 연결 · EXP-013/016(영어) · EXP-017(한국어)", "li": ["<b>영어 중앙값 15.1분</b>, run당 약 $1.1. 세 run의 차이가 1.0분뿐으로 <b>소요 시간을 예측하기 가장 쉬운 모델</b>입니다.", "한국어 조건에서 <b>22.8분으로 확실히 느려진 유일한 모델</b>입니다. 두 조건의 실행 날짜가 달라 원인을 언어로 단정하지 않습니다.", "API 주소·키·모델 이름 세 가지만 바꿔 연결했고 따로 문제를 해결할 일이 없었습니다. 이 결과로 '제공자 API 직접 연결'이 이 벤치마크의 기본 방식이 됐습니다."], "cav": "비용은 싱가포르 리전 단가 기준입니다."},
    open2:{"exp": "Claude Code → Upstage API 직접 연결 · EXP-015 · 영어, 1 run", "li": ["<b>58분 15초</b>로 빠른 모델들보다 약 10배 오래 걸렸고, 두 번째 반복에서 완주했습니다. 생성 토큰은 252.3K로 thinking 비중이 컸습니다.", "채점기가 정상 완주를 한 번 실패로 처리했습니다(서버 포트를 찾지 못한 채점기 오류). 채점기를 고친 뒤 다시 두 번 채점해 통과를 확인했습니다."], "cav": "시험 서비스가 끝나 2026-08-05에 API가 종료됐습니다. 추가 실행이 불가능해 1 run이 마지막 기록입니다. 공개 단가가 없어 비용은 계산하지 않았습니다. 후속 모델은 Solar Pro 4입니다."},
    pro4:{"exp": "Claude Code → Upstage API 직접 연결 · EXP-020 · 영어", "li": ["<b>가장 오래 걸린 모델</b>(119–258분). 세션 기록을 분석해 보니 캐시 미지원, 요청당 평균 37초의 왕복 시간, 생성 토큰의 88%가 thinking이라는 세 요인이 겹친 결과였습니다.", "3 run 모두 완주했습니다. 느린 원인은 프리뷰 서비스의 응답 속도와 캐시 부재이며, 모델이 과제를 풀지 못한 것은 아닙니다.", "run 1에서는 관련 없는 npm 패키지가 채점 프로그램을 가려 정상 완주 선언이 9번 실패로 처리됐습니다. 나중에 다시 채점해 실제 완주 시점을 확정했습니다."], "cav": "비용 $8.0은 정가 환산입니다. 캐시가 기록되지 않아 입력 전체가 비캐시 단가로 계산돼 높게 나왔으며, 실행 당시는 무료·할인 기간이었습니다."}

  notes:[["① 모델 연결에 변환 프록시(ccr)를 쓰지 않는 이유", "Claude Code는 Anthropic API 형식으로 요청을 보냅니다. OpenAI 형식만 받는 모델에 연결하려면 중간에서 형식을 바꿔 주는 프록시(ccr, claude-code-router)가 필요한데, 초기 실험에서 이 프록시가 여러 문제를 일으켰습니다. 도구 호출 인자가 훼손됐고(EXP-006: 여러 조각으로 나뉘어 온 응답 중 첫 조각만 처리해 <span class=\"mono\">python3</span>가 <span class=\"mono\">3</span>으로 바뀜), 토큰 사용량 기록이 빠졌으며(EXP-012), 모델마다 변환 코드를 따로 작성해야 했고, 응답이 멈추거나 컨텍스트 한도 설정 누락으로 실행이 중단됐습니다. 반면 제공자가 공식 제공하는 Anthropic 호환 API(Upstage·DashScope·Moonshot·DeepSeek)에 직접 연결하면 이런 문제가 한 번도 없었습니다. 그래서 프록시를 거친 결과는 비교에서 뺐습니다. 빼는 이유는 속도가 아니라 오류와 측정 왜곡입니다(프록시가 느리다는 점은 모델 차이와 구분되지 않아 확인되지 않았습니다). Anthropic 호환 API가 없는 OpenAI 모델은 OpenAI 공식 도구인 Codex CLI로 실행합니다. EXP-005/006/012의 원자료와 보고서는 리포에 그대로 남아 있습니다."], ["② 채점기가 정상 완주를 실패로 처리한 3건", "에이전트가 완료를 선언하면 채점 스크립트가 서버를 띄워 공식 테스트를 돌립니다. 이 스크립트가 실제로는 완주한 결과를 실패로 처리한 경우가 세 번 있었습니다. EXP-010 run 48-1은 채점용 테스트 파일이 복사되지 않았습니다. EXP-015 iteration 2는 <span class=\"mono\">npx tsx</span>로 띄운 서버의 명령줄에 리포 경로가 없어 채점기가 서버 포트를 찾지 못했습니다(프로세스의 작업 디렉토리로 찾도록 채점 스크립트를 고침, measure v4). EXP-020 pro4-1은 실험 11일 전에 설치된 관련 없는 npm 패키지(<span class=\"mono\">@hurl/cli</span>)가 진짜 테스트 도구 Hurl 8.0.1을 PATH에서 가려, 정상 완주 선언이 9번 연속 실패로 처리됐습니다. <b>교훈: 실패 판정은 채점 로그를 확인한 뒤에만 확정하고, 채점에 쓰는 프로그램의 경로까지 고정해야 합니다.</b> EXP-021부터 처음부터 절대 경로를 고정했고, 그 뒤로 이런 오류는 없었습니다."], ["③ 정정·제외 기록 (2026-08-04)", "초기 정리에서 EXP-006 open2-2와 EXP-008을 프록시(ccr)를 거친 실행으로 잘못 적었지만, 확인해 보니 둘 다 Upstage API 직접 연결이었습니다. 대시보드와 리포 문서를 함께 고치고 '직접 연결이 프록시보다 빠르다'는 설명을 철회했습니다. EXP-008은 지금의 표준 프롬프트가 정해지기 전 프롬프트로 실행했기 때문에(iteration 10, 약 173분), 같은 모델·연결 방식을 표준 조건으로 다시 실행한 EXP-015로 대체하고 비교에서 뺐습니다."], ["", "<b>세 조사의 공통 교훈:</b> 벤치마크 결과의 신뢰성은 모델보다 실험 환경 관리에 달려 있었습니다. 형식 변환 프록시를 없애고, 실행 환경을 다른 설정과 격리하고, 채점기의 실패 판정도 로그로 검증해야 합니다."]],
  cavTitle:"해석 주의", cavSmall:"이 숫자로 말할 수 없는 것",
  cavs:["<b>판정 기준은 완주 여부 하나뿐입니다.</b> 73 run이 모두 완주했기 때문에 모델 사이의 차이는 시간·커밋·output·비용에서만 보입니다. 그런데 이 수치는 같은 모델·같은 조건에서도 run마다 최대 2.8배까지 달라지고, 조건마다 3번(일부 1번)만 실행했으며, 과제도 RealWorld 백엔드 하나뿐입니다. 표의 순위는 참고용이며 '어느 모델이 더 효율적이다'라는 결론의 근거로 쓰지 마세요.", "<b>비용은 실제로 낸 돈이 아니라 추정치입니다.</b> run마다 쓴 토큰을 비캐시 입력·캐시 읽기·캐시 쓰기·출력으로 나누고, 2026-09-23(gpt-6-sol·gpt-6-luna는 09-24)에 확인한 각 제공자의 공개 API 단가를 곱했습니다. 실제 실행은 Claude는 구독, GPT 네 모델은 ChatGPT 플랜 로그인, Solar는 무료·할인 기간의 프리뷰로 했기 때문에 이 금액이 청구되지 않았습니다. 적용한 단가: DeepSeek는 가장 비싼 시간대 단가(다른 시간대는 절반이므로 상한값), gpt-5.6-sol은 11월 21일까지의 할인 단가, qwen은 싱가포르 리전 단가, Claude의 캐시 쓰기는 1시간 보관 단가. run 안의 재시도와 추가 세션도 포함했습니다. Solar Open 2는 공개 단가가 없어 계산하지 않았습니다. <a href=\"https://github.com/roboco-io/coding-agent-benchmark/tree/main/analysis/cost\">계산 방법·단가 출처·run별 데이터 ↗</a>", "<b>모델마다 토큰 기록 방식이 다릅니다.</b> output은 Claude Code 세션 기록(칠한 막대)과 Codex 기록(테두리 막대) 두 가지 방식으로 측정했고, 둘은 서로 비교할 수 없습니다. 캐시 사용량도 제공자마다 기록 범위가 다릅니다. Anthropic·DashScope는 캐시 읽기와 쓰기를 모두 기록하고, Moonshot·DeepSeek는 읽기만, Upstage는 둘 다 기록하지 않습니다.", "<b>실행 도구가 다르면 시간은 참고용입니다.</b> GPT 네 모델(gpt-5.6-sol, gpt-6-astra, gpt-6-sol, gpt-6-luna)은 OpenAI의 Codex CLI로, 나머지는 Claude Code로 실행했습니다. 두 도구는 시작에 걸리는 시간과 도구 호출 방식이 달라, 시간 차이의 일부는 도구 차이일 수 있습니다. 같은 도구끼리(Claude Code 모델끼리, 또는 GPT 모델끼리) 비교할 때만 도구 차이가 빠집니다.", "<b>실험마다 실행 날짜가 다릅니다</b>(2026-07-24 – 09-24). 그사이 제공자 서버 상태와 Claude Code 버전이 바뀌었을 수 있습니다. 영어와 한국어 조건을 다른 날 실행한 경우가 많아(최대 12일 차이) 언어 때문에 달라졌다고 단정하지 않습니다. 최근 모델(gpt-6-astra, gpt-6-sol, gpt-6-luna, Fable 5.1, Opus 5.5)은 다른 모델보다 3–9주 뒤에 실행해, 세대 간 속도 비교에도 날짜 차이가 섞여 있습니다.", "<b>Solar 두 모델은 정식 서비스가 아닌 프리뷰 API로 측정했습니다.</b> 신청해야 쓸 수 있는 베타 서비스로, 캐시를 지원하지 않고 요청 한 번의 왕복에 평균 37초가 걸렸으며 예고 없이 종료되기도 했습니다. 이 두 모델의 시간과 토큰 수를 정식 서비스 성능으로 읽지 마세요.", "<b>이전 실험의 미완주 2건(EXP-005/006)은 모델 탓이 아니었습니다.</b> 원인 분석 실험(EXP-007)에서 실행 환경에 섞여 들어간 설정과 토큰 측정 오류가 주된 원인으로 확인됐고, 환경을 격리하자 같은 모델이 완주했습니다. '이 모델은 완주하지 못한다'는 결론은 환경 격리와 원인 분석 없이 내릴 수 없습니다."],

  deck:"実際のWebサービスのバックエンドをゼロからコーディングエージェントに任せたら、人の助けなしに最後まで作り上げられるでしょうか。このベンチマークは<b>15モデル</b>（Claude、GPT、DeepSeek、Qwen、Kimi、Solar）に同じ課題を与え、<b>Ralphループ</b>で実行します。Ralphループとは、同じ指示を新しいセッションで繰り返し実行し、エージェントが完了を宣言して公式テストに合格するまで人の介入なしで回す方式です。",

  howEyebrow:"読み方",
  howItems:["<b>バーの読み方</b>——1行が1モデルです。バーはそのモデルのrunの最小値から最大値までの範囲で、白い縦線が中央値です。列見出しをクリックするとその基準で並び替わります。", "<b>所要時間</b>——1回のrunで課題を完走するまでにかかったエージェントのセッション時間です。ほとんどのモデルは中央値で4–15分に集まっています。Solarの2モデル（58分、119–258分）はプレビューAPIの遅い応答とキャッシュ非対応の影響も含むため、モデル性能の比較には使わないでください。", "<b>run間変動</b>——同じ条件で最も遅いrunが最も速いrunの何倍かかったかです。大きいほど次のrunの所要時間を予測しにくくなります。例：kimi-k3 2.8倍、qwen3.8-max 1.1倍。", "<b>コミット規律</b>——1回のrunで作られたgitコミット数です（塗りつぶし点 = 中央値）。結果の品質ではなく作業スタイルの違いを示します。同じプロンプトでもOpus 4.8はたいてい一度にコミットし（中央値1）、Opus 5は何度にも分けてコミットします（中央値6）。", "<b>outputトークン</b>——モデルが生成したトークン数（thinkingを含む）です。枠線だけのバー（GPTの4モデル）はCodexの記録方式で計測した値のため、塗りつぶしバーとは直接比較できません。", "<b>runあたり換算コスト</b>——runで使ったトークンに公開API単価を掛けた推定値です。実際の請求額ではありません（サブスクリプション・プレビューで実行）。適用した単価と前提は下の「解釈上の注意」にあります。", "<b>主な観察</b>——最も速いのはOpus 5.5（中央値4.2分）、最も安いのはgpt-6-luna（runあたり約$0.03）、次がDeepSeek V4.1-Flash（約$0.09）です。速いからといって安いわけではありません。Fable 5.1は6.9分と速いほうですが、runあたり約$3.5でOpus 5.5（$1.25）の約3倍です。", "<b>KO正本トグル</b>——プロンプトを韓国語訳に替え、成果物（コミット・README）も韓国語で書かせた条件です。実験した9モデルはすべて完走しました。英語条件より明らかに遅くなったのはqwen3.8-maxだけ（15.1分 → 22.8分）で、2条件の実行日が異なるため言語の影響とは断定しません。"],

  cards:{
    opus55:{"exp": "Claude Code · EXP-026 · 英語・韓国語 · 2026-09リリース", "li": ["<b>最も速いモデル</b>——6 run中5 runが4.0–4.2分で終わりました（英語の中央値4.2分、韓国語4.0分）。残る1 run（8.4分）は、エージェントが自分で作ったテストスクリプトのポート競合を解決するのに時間がかかりました。", "<b>runあたり約$1.25</b>——生成トークンが約20KとClaudeモデルで最も少なく、キャッシュ読み取り単価も入力単価の1/20と低いため、Opus 5の約1/5です。", "韓国語条件でも速さは同じで、コミットメッセージとREADMEをすべて韓国語で書きました。シェルコマンド（Bash）だけで作業し、接続されていた外部ツール（MCP）は一度も使いませんでした。"], "cav": "他のClaudeモデルより数週間後に、新しいClaude Code（2.1.280）で実行しました。「最速」はこの条件での観測であり、確定した優位ではありません。"},
    dsflash:{"exp": "Claude Code → DeepSeek APIに直接接続 · EXP-025 · 英語・韓国語 · 2026-09-10リリース", "li": ["<b>Claude Codeで実行したモデルの中で最も安い</b>——runあたり約$0.09（韓国語$0.12）で、V4-Pro（$0.52）の約1/6です。これより安いのはCodex CLIで実行したgpt-6-luna（約$0.03）だけです。キャッシュ読み取り単価が100万トークンあたり$0.006と非常に低いためです。", "<b>2番目に速いモデル</b>——英語の中央値4.8分（4.6–6.0分）。韓国語は4.2–8.4分でrunごとの差が大きめでした。", "ファイルの読み取り・書き込み・編集ツール（Read/Write/Edit）をまんべんなく使いました。他の直接接続モデルは主にシェルコマンド（Bash）に頼っていました。韓国語条件でもコミットとREADMEをすべて韓国語で書きました。"], "cav": "使った分だけ課金されるAPIで実行しました。コストはピーク時間帯の単価で、それ以外の時間帯は半額です。"},
    sol:{"exp": "Codex CLI · EXP-011/016（英語） · EXP-019（韓国語）", "li": ["<b>英語の中央値5.8分</b>（5.3–10.0分）、runあたり約$1.05。Codex CLIのモデルの中ではgpt-6-sol（4.9分）より遅く、gpt-6-astra（7.1分）より速いです。", "3 run中1 runが2回目の反復で完走しました。Solarの2モデルを除けば、1回目で終わらなかった唯一のケースです。", "英語中心のモデルですが、韓国語条件ではコミットとREADMEをすべて韓国語で書きました。"], "cav": "実行ツール（Codex CLI）がClaude Codeと異なるため、時間は参考値です。outputはCodexの記録方式のため、他のモデルと直接比較できません。コストは11月21日までのプロモーション単価です。"},
    fable:{"exp": "Claude Code · EXP-023 · 英語 · Claude 5世代の最上位モデル", "li": ["<b>英語の中央値6.9分</b>（6.2–7.8分）とOpus 4.8より速いものの、単価がOpusの2倍なので<b>runあたり約$3.5</b>とOpus 5.5の約3倍です。", "生成トークン（28.7–35.8K）はOpus 4.8と同程度で、Opus 5（41–48K）より少なめです。つまりOpus 5の多い生成量はClaude 5世代共通の特徴ではなく、Opus 5だけの特徴です。", "3 runを通じてシェルコマンド（Bash）71回とファイル書き込み2回だけを使い、ファイルの読み取り・編集ツールは使いませんでした。"], "cav": "ユーザーのグローバル設定（外部ツールMCP、応答言語）が露出した状態で実行しました。Opus 4.8・Opus 5の実験と同じ条件ですが、7週間後の実行です。"},
    sol6:{"exp": "Codex CLI · EXP-027 · 英語 · GPT-6世代", "li": ["<b>英語の中央値4.9分</b>（4.8–5.2分）、runあたり約$0.43。3 runとも約5分・コミット3回・output約11Kで、run間の差がごく小さいです。", "この課題ではgpt-5.6-sol（中央値5.8分）やgpt-6-astra（7.1分）より短くかかりました。ただしastraは2週間早く、旧Codex CLI（0.153.4、今回は0.155.1）で実行したため、この差をモデルの違いとは断定しません。", "すべての応答がgpt-6-solから返りました（代替モデルなし）。採点後にサーバープロセスが残った採点インフラの問題1件（逸脱D-1）はエージェントに介入せず処理し、判定への影響はありません。"], "cav": "2026-09-24にCodex CLI 0.155.1、reasoning effort medium、ChatGPTプランのログインで実行したため、請求額はありません。コストは2026-09-24に確認した標準の短文脈単価で換算しました。最初に依頼されたgpt-6-earthは存在しないモデルIDでした。"},
    luna6:{"exp": "Codex CLI · EXP-027 · 英語 · GPT-6世代", "li": ["<b>英語の中央値6.6分</b>（5.4–10.0分）。<b>runあたり約$0.03で、全モデル中もっとも推定コストが低いです。</b>公開単価がgpt-6-solの1/20だからです。", "Codexの説明は「fast and affordable」ですが、この課題では3 runすべてがgpt-6-solのどのrunよりも長くかかりました。run 1が最長で（10.0分、コミット8回、output 21.5K、input累計4.0M）、run 2・3はsolに近い値でした。", "output（13.4–21.5K）とコミット数（4–8回）のばらつきはsolより大きいです。"], "cav": "gpt-6-solと同じ日・同じ条件で交互に実行しました。n=3なので「solより遅い」は観測値であり、確定した順位ではありません。コストは標準の短文脈単価で換算し、請求額はありません。"},
    sonnet5:{"exp": "Claude Code · EXP-028 · 英語・韓国語 · Claude 5世代", "li": ["<b>英語の中央値14.2分</b>（13.0–15.3分）、韓国語14.2分（11.2–16.8分）。6 runすべてが完走し、うち5 runはiteration 1で終わりました。", "en-1ではエージェントがスキャフォールド後とテスト準備後に自ら止まり、iteration 3でAPIを実装しました。Ralphループが分割された作業を引き継いで完走につなげ、rejectedされた完了宣言はありませんでした。", "<b>runあたり約$3.1</b>（$2.67–4.21）——入力・出力単価はOpus 5.5の半分なのに、Opus 5.5（約$1.25）より高くなりました。outputが約3倍（57.6–73.7K）で、runごとのキャッシュ読み取りが7–14Mトークンあったためです。"], "cav": "Opus 5.5の翌日にClaude Code 2.1.281で、ユーザーのグローバル設定が見える状態で実行しました（EXP-023/026と同条件）。グローバルの「韓国語で応答」ルールにより、英語runの最終要約も大半が韓国語でした。Opus 5.5・Fable 5.1より遅いというのはn=3の観測で、確定した順位ではありません。"},
    astra:{"exp": "Codex CLI · EXP-021 · 英語 · GPT-6世代の最初のモデル", "li": ["<b>英語の中央値7.1分</b>、runあたり約$2.0。3 runの時間差が0.5分しかなく、最も安定したモデルの一つです。", "前のモデルgpt-5.6-solより23–32%長くかかりました。OpenAIが発表した「1.9倍高速」はこの課題では再現しませんでした。", "OpenAIはAnthropic互換APIを提供していないため、Codex CLIでしか実行できません。solの実験から変えたのはモデル名だけです。"], "cav": "リリース6日後に実行しました。ChatGPTプランのログインで実行したため実際の課金はなく、コストは短いコンテキストの単価で換算しています。"},
    kimi:{"exp": "Claude Code → Moonshot APIに直接接続 · EXP-014/016（英語） · EXP-017（韓国語）", "li": ["<b>英語の中央値7.9分</b>、runあたり約$0.78。ただしrunごとに7.6分から21.3分（2.8倍）まで変わり、<b>所要時間を最も予測しにくいモデル</b>です。コミット数も1–4とばらばらです。", "生成トークンが最も少ない部類（14.4K）なのに、同じテストに合格しました。生成量が少ないからといって結果が悪いわけではありません。"], "cav": "thinking（推論）機能をオフにできないため、オンのまま実行しました。Moonshotはキャッシュ書き込みトークンを0と記録します。"},
    opus48:{"exp": "Claude Code · EXP-010（英語） · EXP-019（韓国語）", "li": ["<b>最も安定したモデル</b>——6 runすべて7.1–8.7分で、英語・韓国語ともに中央値は8.3分です。runあたり約$3.2。", "たいてい全体を実装してから<b>一度だけコミット</b>します（中央値1）。韓国語の3 runはすべてコミット1回でした。"], "cav": ""},
    opus5:{"exp": "Claude Code · EXP-009/010（英語、6 run） · EXP-019（韓国語）", "li": ["<b>Sonnet 5に次いで生成トークンが多いClaudeモデル</b>（中央値47.0K）で、<b>runあたり約$5.8とClaudeモデルで最も高価です。</b>英語の中央値11.9分。", "作業を<b>何度にも分けてコミット</b>します（中央値6）。同じプロンプトを受けたOpus 4.8（中央値1）とは正反対のやり方です。"], "cav": ""},
    dspro:{"exp": "Claude Code → DeepSeek APIに直接接続 · EXP-025 · 英語・韓国語", "li": ["<b>英語の中央値13.3分</b>とFlashより2.5–3倍遅いものの、<b>runあたり約$0.52</b>で2番目に安いモデルです。", "韓国語3 runの時間差は0.4分だけで、コミットも4・4・4回と同じ。<b>韓国語条件で最も安定したモデル</b>でした。", "ドキュメントにはV4-ProのリクエストがFlashに回される場合があるとの案内がありましたが、6 runのすべての応答が実際にV4-Proでした。"], "cav": "Flashより前のバージョン（08-13、Flashは09-10）なので、同じ会社の中でも世代が異なります。コストはピーク時間帯の単価です。"},
    qwen:{"exp": "Claude Code → DashScope APIに直接接続 · EXP-013/016（英語） · EXP-017（韓国語）", "li": ["<b>英語の中央値15.1分</b>、runあたり約$1.1。3 runの差が1.0分だけで、<b>所要時間を最も予測しやすいモデル</b>です。", "韓国語条件で<b>22.8分と明らかに遅くなった唯一のモデル</b>です。2条件の実行日が異なるため、原因を言語とは断定しません。", "APIアドレス・キー・モデル名の3つを変えるだけで接続でき、トラブル対応は不要でした。この結果から「プロバイダのAPIに直接接続」がこのベンチマークの標準になりました。"], "cav": "コストはシンガポールリージョンの単価です。"},
    open2:{"exp": "Claude Code → Upstage APIに直接接続 · EXP-015 · 英語、1 run", "li": ["<b>58分15秒</b>と速いモデルの約10倍かかり、2回目の反復で完走しました。生成トークンは252.3Kで、thinkingの比重が大きめでした。", "採点器が正常な完走を一度失敗と判定しました（サーバーのポートを見つけられなかった採点器のエラー）。採点器を直してから2回再採点し、合格を確認しました。"], "cav": "試験サービスが終了し、2026-08-05にAPIが停止しました。追加の実行ができないため、この1 runが最後の記録です。公開単価がないためコストは計算していません。後継モデルはSolar Pro 4です。"},
    pro4:{"exp": "Claude Code → Upstage APIに直接接続 · EXP-020 · 英語", "li": ["<b>最も時間がかかったモデル</b>（119–258分）。セッションログを分析すると、キャッシュ非対応、リクエストあたり平均37秒の往復時間、生成トークンの88%がthinkingという3つの要因が重なった結果でした。", "3 runすべて完走しました。遅さの原因はプレビューサービスの応答速度とキャッシュがないことで、モデルが課題を解けなかったわけではありません。", "run 1では無関係なnpmパッケージが採点プログラムを隠し、正常な完走宣言が9回失敗と判定されました。後で再採点し、実際の完走時点を確定しました。"], "cav": "コスト$8.0は定価での換算です。キャッシュが記録されず入力全体が非キャッシュ単価で計算されたため高く出ており、実行当時は無料・割引期間でした。"}
  },

  rawNotes:{ r1:"同時点交差A/B", r2:"全て韓国語 · EN分布と重なる", r3:"ENプロンプト正本の確立", r4:"出力量拡大プロファイル", r6:"Claude 5上位モデル · outputは4.8水準", r16:"直結最速 · 最低コスト · Read/Write/Edit軌跡", r17:"全て韓国語", r20:"全条件最速（中央値4.2分）· ネイティブ最低output", r21:"全て韓国語 · KO条件最速（3.95–4.22分）", r18:"モデル維持確認（全応答v4-pro）· Flash比2.5–3倍", r19:"全て韓国語 · 変動最小（0.4分）", r22:"GPT中で最小のばらつき（4.8–5.2分）· 毎runコミット3回 · 採点インフラ逸脱1件、判定に影響なし", r23:"推定コスト最低 · 全runがsolより長い · run 1最長（10.0分、コミット8回）", r24:"en-1はエージェント自身が3 iterationに分けて完走（rejectedなし）· Claudeモデル中output最多", r25:"全run iter 1 · 最長run 16.8分", r7:"sol-2のみiter 2", r8:"英語圏モデルでも全て韓国語", r9:"GPT-6初検証 · 誤棄却0件 · sol比+23–32%", r10:"トラブルシューティング0 · 変動最小", r11:"全て韓国語 · ENと分布が重ならない", r12:"run間変動最大（2.8倍）", r13:"全て韓国語（feat:接頭辞1件）", r14:"ゲート誤棄却1件 · measure v4で修正", r15:"全条件最長 · pro4-1は誤棄却でループ延長、遡及確定" },
  notesTitle:"調査ノート", notesSmall:"変換プロキシを使わない理由 · 採点器のエラー3件 · 訂正記録",
  notes:[["① モデル接続に変換プロキシ（ccr）を使わない理由", "Claude CodeはAnthropic APIの形式でリクエストを送ります。OpenAI形式しか受け付けないモデルにつなぐには、途中で形式を変換するプロキシ（ccr、claude-code-router）が必要ですが、初期の実験ではこのプロキシが複数の問題を起こしました。ツール呼び出しの引数が壊れ（EXP-006：分割されて届いた応答の最初の断片だけを処理し、<span class=\"mono\">python3</span>が<span class=\"mono\">3</span>に変わった）、トークン使用量の記録が抜け（EXP-012）、モデルごとに変換コードを書く必要があり、応答が止まったりコンテキスト上限の設定漏れで実行が中断したりしました。一方、プロバイダが公式に提供するAnthropic互換API（Upstage・DashScope・Moonshot・DeepSeek）に直接つなぐと、こうした問題は一度も起きませんでした。そのため、プロキシを経由した結果は比較から外しました。理由は速度ではなく、エラーと計測の歪みです（プロキシが遅いかどうかはモデルの違いと切り分けられず、確認できていません）。Anthropic互換APIがないOpenAIのモデルは、OpenAI公式のCodex CLIで実行します。EXP-005/006/012の生データとレポートはリポジトリに残っています。"], ["② 採点器が正常な完走を失敗と判定した3件", "エージェントが完了を宣言すると、採点スクリプトがサーバーを起動して公式テストを実行します。このスクリプトが、実際には完走した結果を失敗と判定したことが3回ありました。EXP-010 run 48-1では、採点用のテストファイルがコピーされていませんでした。EXP-015 iteration 2では、<span class=\"mono\">npx tsx</span>で起動したサーバーのコマンドラインにリポジトリのパスがなく、採点器がサーバーのポートを見つけられませんでした（プロセスの作業ディレクトリで探すよう採点スクリプトを修正、measure v4）。EXP-020 pro4-1では、実験の11日前に入れた無関係なnpmパッケージ（<span class=\"mono\">@hurl/cli</span>）が本物のテストツールHurl 8.0.1をPATH上で隠し、正常な完走宣言が9回連続で失敗と判定されました。<b>教訓：失敗の判定は採点ログを確認してから確定し、採点に使うプログラムのパスまで固定すること。</b>EXP-021からは最初から絶対パスを固定しており、それ以降このエラーは起きていません。"], ["③ 訂正・除外の記録（2026-08-04）", "初期の整理でEXP-006 open2-2とEXP-008をプロキシ（ccr）経由の実行と誤って記録しましたが、確認したところどちらもUpstage APIへの直接接続でした。ダッシュボードとリポジトリの文書をまとめて修正し、「直接接続はプロキシより速い」という説明を撤回しました。EXP-008は現在の標準プロンプトが決まる前のプロンプトで実行していたため（iteration 10、約173分）、同じモデル・接続方式を標準条件で再実行したEXP-015に置き換え、比較から外しました。"], ["", "<b>3つの調査に共通する教訓：</b>ベンチマーク結果の信頼性は、モデルよりも実験環境の管理にかかっていました。形式変換プロキシをなくし、実行環境を他の設定から隔離し、採点器の失敗判定もログで検証する必要があります。"]],
  cavTitle:"解釈上の注意", cavSmall:"この数字から言えないこと",
  cavs:["<b>判定基準は完走したかどうかだけです。</b>73 runすべてが完走したため、モデル間の違いは時間・コミット・output・コストにしか現れません。しかしこれらの数値は同じモデル・同じ条件でもrunごとに最大2.8倍変わり、各条件は3回（一部は1回）しか実行しておらず、課題もRealWorldバックエンド1つだけです。表の順位は参考値であり、「どのモデルがより効率的か」という結論の根拠にはしないでください。", "<b>コストは実際に支払った額ではなく推定値です。</b>runごとのトークンを非キャッシュ入力・キャッシュ読み取り・キャッシュ書き込み・出力に分け、2026-09-23（gpt-6-sol・gpt-6-lunaは09-24）に確認した各プロバイダの公開API単価を掛けました。実際の実行はClaudeがサブスクリプション、GPTの4モデルがChatGPTプランのログイン、Solarが無料・割引期間のプレビューだったため、この金額は請求されていません。適用した単価：DeepSeekはピーク時間帯の単価（他の時間帯は半額なので上限値）、gpt-5.6-solは11月21日までのプロモーション単価、qwenはシンガポールリージョンの単価、Claudeのキャッシュ書き込みは1時間保持の単価。run内の再試行や追加セッションも含みます。Solar Open 2は公開単価がないため計算していません。<a href=\"https://github.com/roboco-io/coding-agent-benchmark/tree/main/analysis/cost\">計算方法・単価の出典・runごとのデータ ↗</a>", "<b>モデルによってトークンの記録方式が異なります。</b>outputはClaude Codeのセッション記録（塗りつぶしバー）とCodexの記録（枠線バー）の2通りで計測しており、両者は比較できません。キャッシュ使用量もプロバイダごとに記録範囲が違います。Anthropic・DashScopeはキャッシュの読み取りと書き込みの両方を記録し、Moonshot・DeepSeekは読み取りのみ、Upstageはどちらも記録しません。", "<b>実行ツールが違えば、時間は参考値です。</b>GPTの4モデル（gpt-5.6-sol、gpt-6-astra、gpt-6-sol、gpt-6-luna）はOpenAIのCodex CLIで、残りはClaude Codeで実行しました。2つのツールは起動にかかる時間やツール呼び出しの方式が異なるため、時間差の一部はツールの違いによるかもしれません。同じツール同士（Claude Codeのモデル同士、またはGPTモデル同士）で比べたときだけ、ツールの違いが除かれます。", "<b>実験ごとに実行日が異なります</b>（2026-07-24 – 09-24）。その間にプロバイダのサーバー状態やClaude Codeのバージョンが変わった可能性があります。英語と韓国語の条件を別の日に実行したことも多く（最大12日差）、言語のせいで変わったとは断定しません。最近のモデル（gpt-6-astra、gpt-6-sol、gpt-6-luna、Fable 5.1、Opus 5.5）は他のモデルより3–9週間後に実行しており、世代間の速度比較にも日付の違いが混ざっています。", "<b>Solarの2モデルは正式サービスではなくプレビューAPIで計測しました。</b>申請制のベータサービスで、キャッシュに対応せず、リクエスト1回の往復に平均37秒かかり、予告なく終了することもありました。この2モデルの時間とトークン数を正式サービスの性能として読まないでください。", "<b>以前の実験の未完走2件（EXP-005/006）はモデルのせいではありませんでした。</b>原因分析の実験（EXP-007）で、実行環境に紛れ込んだ設定とトークン計測の誤りが主な原因と確認され、環境を隔離すると同じモデルが完走しました。「このモデルは完走できない」という結論は、環境の隔離と原因分析なしには下せません。"],
  footer:"coding-agent-benchmark · 最新反映 EXP-028（2026-09-24）· 生ログ・usage CSV・オーケストレータログは各実験の<span class=\"mono\">runs/</span>ディレクトリに保存。"
},

zh: {
  htmlLang:"zh-CN", title:"Ralph 循环各模型完成率对比",
  eyebrow:"Ralph loop benchmark · 2026-07-24 → 09-24",
  h1:"Ralph 循环各模型完成率对比",
  deck:"如果把一个真实 Web 服务的后端交给编码代理从零开始构建，它能在没有人帮助的情况下完成吗？本基准给 <b>15 个模型</b>（Claude、GPT、DeepSeek、Qwen、Kimi、Solar）同样的任务，并用 <b>Ralph 循环</b>运行：在新会话中反复执行同一条指令，直到代理宣布完成并通过官方测试，全程无人干预。",
  deck2:"任务是 <b>RealWorld 后端</b>——一个具备注册登录、文章、评论、关注和标签的博客型服务 API。选择它有三个原因：它是实际项目中经常实现的模式；难度足以区分模型的能力；并且有写得很好的公开规范和官方测试（154 个 Hurl 请求），可以客观地评判结果。到目前为止 73 次运行全部完成，因此下表比较的是每个模型<b>如何</b>完成：花了多长时间、有多稳定、如何工作，以及要花多少钱。",
  repoPitch:"<b>一切都是公开的。</b>实验设计、逐 run 的原始日志和 token 记录、评分脚本以及成本计算都在仓库中。你可以亲自核对任何数字，或用同一套框架加入你想测试的模型。",
  metaLink:"在 GitHub 上查看 ↗",
  flag:"<b>Solar Open 2 和 Solar Pro 4 是在预览 API 而非正式服务上测得的。</b>这是需要申请的测试服务，不支持缓存、响应慢，还可能无预告关闭。因此这两个模型的时间和 token 数同时反映了模型性能与预览服务的限制，请不要当作正式服务的性能。",
  mxTitle:"性能矩阵",
  mxSub:"每行一个模型，各列的含义见下方“阅读方法”。时间、output 和成本在模型之间相差可达数十倍，因此使用<b>对数刻度</b>（见列标题下方的刻度）。点击列标题即可按该列排序。",
  segEn:"EN 标准版", segKo:"KO 标准版",
  hintEn:"英文标准提示词——全部 15 个模型", hintKo:"韩文翻译标准版（要求全部产出为韩文）——仅 9 个模型测试",
  lgNative:"Claude Code 原生", lgDirect:"Claude Code 直连(ANTHROPIC_BASE_URL)", lgCodex:"Codex CLI",
  lgOut:"output 按 rollout 累计计量——不可与 jsonl 计量（实心条）直接比较",
  colModel:"模型", colDone:"完成", colTime:"耗时", colSpread:"run 间波动", colCommits:"提交纪律", colOutput:"output token", colCost:"每 run 折算成本", costNa:"无公开单价",
  min:"分钟", minTick:"分钟", commitsScale:"实心点 = 中位数 · 刻度 1–8",
  iterAll1:"全部 iter 1", iterMixed:"iter 1 ×2 · 2 ×1", iter2:"iter 2", iter123:"iter 1·2·3", iter311:"iter 3·1·1",
  stNative:"Claude Code 原生", stDirect:"直连", stCodex:"Codex CLI",
  koMissing:"KO 条件未测试——", noteAstra:"GPT-6 世代新模型", noteFable:"Claude 5 高阶新模型", notePreview:"端点已下线/新模型",
  n1na:"n=1 · 无法判断", span:"跨度 {x} 分钟", n1:"n=1", singleRun:"单个 run", sameAll:"所有 run 相同",
  howEyebrow:"阅读方法",
  howItems:["<b>如何看横条</b>——每一行是一个模型。横条表示该模型各次 run 的最小值到最大值的范围，白色竖线为中位数。点击列标题即可按该列排序。", "<b>耗时</b>——一次 run 完成任务所用的代理会话时间。大多数模型的中位数集中在 4–15 分钟。两个 Solar 模型（58 分钟、119–258 分钟）同时反映了预览 API 响应慢和不支持缓存的影响，请勿用于比较模型性能。", "<b>run 间波动</b>——同一条件下最慢的 run 是最快的 run 的几倍。数值越大，越难预测下一次 run 的耗时。例如：kimi-k3 2.8 倍，qwen3.8-max 1.1 倍。", "<b>提交纪律</b>——一次 run 中产生的 git 提交数（实心点 = 中位数）。它反映的是工作方式，而非结果质量。在同一提示词下，Opus 4.8 通常一次提交（中位数 1），Opus 5 则分成多次提交（中位数 6）。", "<b>output token</b>——模型生成的 token 数（含 thinking）。只有描边的横条（4 个 GPT 模型）按 Codex 的记录方式计量，不能与实心横条直接比较。", "<b>每 run 折算成本</b>——将 run 使用的 token 乘以公开 API 单价得到的估算值，并非实际计费金额（使用订阅和预览运行）。所用单价与假设见下方“解读注意”。", "<b>主要观察</b>——最快的是 Opus 5.5（中位数 4.2 分钟），最便宜的是 gpt-6-luna（每 run 约 $0.03），其次是 DeepSeek V4.1-Flash（约 $0.09）。快不等于便宜：Fable 5.1 用时 6.9 分钟，算快的，但每 run 约 $3.5，约为 Opus 5.5（$1.25）的 3 倍。", "<b>KO 标准版切换</b>——把提示词换成韩文译本，并要求产出物（提交信息、README）也用韩文书写。参与测试的 9 个模型全部完成。比英文条件明显变慢的只有 qwen3.8-max（15.1 分钟 → 22.8 分钟）；两个条件的运行日期不同，因此不将其归因于语言。"],
  cardsEyebrow:"各模型特点 · 按耗时排序",
  cards:{
    opus55:{"exp": "Claude Code · EXP-026 · 英文与韩文 · 2026-09 发布", "li": ["<b>最快的模型</b>——6 个 run 中有 5 个在 4.0–4.2 分钟内完成（英文中位数 4.2 分钟，韩文 4.0 分钟）。剩下的 1 个 run（8.4 分钟）是因为代理在排查自己写的测试脚本中的端口冲突。", "<b>每 run 约 $1.25</b>——生成 token 约 20K，是 Claude 模型中最少的；缓存读取单价仅为输入单价的 1/20，因此约为 Opus 5 的 1/5。", "韩文条件下速度相同，提交信息和 README 全部用韩文书写。它只通过 shell 命令（Bash）工作，已连接的外部工具（MCP）一次也没用。"], "cav": "比其他 Claude 模型晚几周、用新版 Claude Code（2.1.280）运行。“最快”是在这些条件下的观测，并非确定的优势。"},
    dsflash:{"exp": "Claude Code → DeepSeek API 直连 · EXP-025 · 英文与韩文 · 2026-09-10 发布", "li": ["<b>在 Claude Code 上运行的模型中最便宜</b>——每 run 约 $0.09（韩文 $0.12），约为 V4-Pro（$0.52）的 1/6。比它更低的只有用 Codex CLI 运行的 gpt-6-luna（约 $0.03）。原因是其缓存读取单价极低（每百万 token $0.006）。", "<b>第二快的模型</b>——英文中位数 4.8 分钟（4.6–6.0 分钟）。韩文为 4.2–8.4 分钟，各 run 差异更大。", "均衡地使用文件读取、写入、编辑工具（Read/Write/Edit），而其他直连模型大多依赖 shell 命令（Bash）。韩文条件下提交和 README 也全部用韩文书写。"], "cav": "通过按量计费的 API 运行。成本按高峰时段单价计算，其他时段为一半。"},
    sol:{"exp": "Codex CLI · EXP-011/016（英文） · EXP-019（韩文）", "li": ["<b>英文中位数 5.8 分钟</b>（5.3–10.0 分钟），每 run 约 $1.05。在 Codex CLI 模型中比 gpt-6-sol（4.9 分钟）慢，比 gpt-6-astra（7.1 分钟）快。", "3 个 run 中有 1 个在第二次迭代完成。除两个 Solar 模型外，这是唯一没有在第一次迭代完成的情况。", "虽然是以英文为主的模型，但在韩文条件下提交和 README 全部用韩文书写。"], "cav": "运行工具（Codex CLI）与 Claude Code 不同，时间仅供参考。output 按 Codex 的记录方式计量，不能与其他模型直接比较。成本按 11 月 21 日前的促销单价计算。"},
    fable:{"exp": "Claude Code · EXP-023 · 英文 · Claude 5 世代最高端模型", "li": ["<b>英文中位数 6.9 分钟</b>（6.2–7.8 分钟），比 Opus 4.8 快；但单价是 Opus 的两倍，<b>每 run 约 $3.5</b>，约为 Opus 5.5 的 3 倍。", "生成 token（28.7–35.8K）与 Opus 4.8 相近，少于 Opus 5（41–48K）。也就是说，Opus 5 生成量大是它自己的特点，而不是 Claude 5 世代的共同特点。", "3 个 run 中只用了 71 次 shell 命令（Bash）和 2 次文件写入，没有用文件读取和编辑工具。"], "cav": "运行时暴露了用户的全局设置（外部工具 MCP、回复语言）。与 Opus 4.8、Opus 5 的实验条件相同，但晚了 7 周。"},
    sol6:{"exp": "Codex CLI · EXP-027 · 英文 · GPT-6 世代", "li": ["<b>英文中位数 4.9 分钟</b>（4.8–5.2 分钟），每 run 约 $0.43。3 个 run 都约 5 分钟、提交 3 次、output 约 11K，run 之间差异很小。", "在这个任务上比 gpt-5.6-sol（中位数 5.8 分钟）和 gpt-6-astra（7.1 分钟）用时更短。但 astra 早两周运行，且使用旧版 Codex CLI（0.153.4，本次为 0.155.1），因此不把这一差异断定为模型差异。", "所有响应都来自 gpt-6-sol（无备用模型）。评分后服务器进程残留的评分基础设施问题 1 起（偏离 D-1）在不干预代理的情况下处理，不影响判定。"], "cav": "于 2026-09-24 使用 Codex CLI 0.155.1、reasoning effort medium、ChatGPT 套餐登录运行，未产生计费。成本按 2026-09-24 核实的标准短上下文单价折算。最初请求的 gpt-6-earth 是不存在的模型 ID。"},
    luna6:{"exp": "Codex CLI · EXP-027 · 英文 · GPT-6 世代", "li": ["<b>英文中位数 6.6 分钟</b>（5.4–10.0 分钟）。<b>每 run 约 $0.03，是所有模型中估算成本最低的。</b>原因是其公开单价为 gpt-6-sol 的 1/20。", "Codex 将其描述为 “fast and affordable”，但在这个任务上，3 个 run 都比 gpt-6-sol 的任何一个 run 用时更长。run 1 最长（10.0 分钟、提交 8 次、output 21.5K、input 累计 4.0M），run 2、3 与 sol 接近。", "output（13.4–21.5K）和提交次数（4–8 次）的波动比 sol 大。"], "cav": "与 gpt-6-sol 在同一天、同一条件下交替运行。n=3，“比 sol 慢”只是观测结果，不是确定的排名。成本按标准短上下文单价折算，未产生计费。"},

/* ───────────────────────── i18n plumbing ───────────────────────── */
const LANGS = ["en","ko","ja","zh"];
let lang = "en";
const t = k => (T[lang] && T[lang][k] != null) ? T[lang][k] : T.en[k];

function detectLang() {
  try {
    const q = new URLSearchParams(location.search).get("lang");
    if (q && LANGS.includes(q)) return q;
  } catch (e) {}
  try {
    const s = localStorage.getItem("dash-lang");
    if (s && LANGS.includes(s)) return s;
  } catch (e) {}
  try {
    const navs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""];
    for (const n of navs) {
      const p = String(n).toLowerCase().split("-")[0];
      if (p === "ko" || p === "ja" || p === "zh") return p;
      if (p === "en") return "en";
    }
  } catch (e) {}
  return "en";
}

function setLang(l, persist) {
  lang = LANGS.includes(l) ? l : "en";
  document.documentElement.setAttribute("lang", t("htmlLang"));
  document.title = t("title");
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  if (persist) { try { localStorage.setItem("dash-lang", lang); } catch (e) {} }
  applyStatic();
  scales();
  render();
  renderCards();
  renderRaw();
  renderNotes();
}

function applyStatic() {
  document.querySelectorAll("[data-i18n]").forEach(el => { el.innerHTML = t(el.dataset.i18n); });
  document.getElementById("langhint").textContent = plang === "en" ? t("hintEn") : t("hintKo");
}

/* ───────────────────────── matrix ───────────────────────── */
const U_MIN = 0.05, U_MAX = 20, T_MIN = 3.5, T_MAX = 260, O_MIN = 10, O_MAX = 260, S_MAX = 3, C_MAX = 8;
const lg = (v, lo, hi) => Math.max(0, Math.min(100, (Math.log10(v) - Math.log10(lo)) / (Math.log10(hi) - Math.log10(lo)) * 100));
const med = a => { const s = [...a].sort((x, y) => x - y), h = s.length >> 1; return s.length % 2 ? s[h] : (s[h - 1] + s[h]) / 2; };
const lo = a => Math.min(...a), hi = a => Math.max(...a);
const f1 = v => (Math.round(v * 10) / 10).toFixed(1);
const usd = v => v < 1 ? v.toFixed(2) : v < 10 ? v.toFixed(1) : Math.round(v).toString();

let plang = "en", sortKey = "time", sortDir = 1;

function stackLabel(m) {
  if (m.stack === "native") return t("stNative");
  if (m.stack === "codex") return t("stCodex");
  return t("stDirect") + " · " + m.provider;
}

function stats(d) {
  if (!d) return null;
  return { tMed: med(d.t), tLo: lo(d.t), tHi: hi(d.t), n: d.t.length,
           spread: lo(d.t) > 0 ? hi(d.t) / lo(d.t) : 1,
           cMed: med(d.c), cLo: lo(d.c), cHi: hi(d.c),
           oMed: med(d.o), oLo: lo(d.o), oHi: hi(d.o), done: d.done, iter: t(d.iter), exp: d.exp,
           usd: (d.usd || []).filter(v => v != null) };
}

function rangeBar(loV, hiV, medV, n, scaleLo, scaleHi, color, outlined) {
  if (n === 1) {
    return `<div class="bar"><div class="pt" style="left:${lg(medV, scaleLo, scaleHi)}%;background:${color}"></div></div>`;
  }
  const a = lg(loV, scaleLo, scaleHi), b = lg(hiV, scaleLo, scaleHi);
  const fill = outlined ? `color:${color}` : `background:${color}`;
  return `<div class="bar"><div class="rng${outlined ? " out" : ""}" style="left:${a}%;width:${Math.max(b - a, 0.8)}%;${fill}"></div>`
       + `<div class="med" style="left:calc(${lg(medV, scaleLo, scaleHi)}% - 1px)"></div></div>`;
}

function linBar(v, max, color) {
  return `<div class="bar"><div class="rng" style="left:0;width:${Math.max(v / max * 100, 1)}%;background:${color}"></div></div>`;
}

function dots(medV, color) {
  let h = `<div class="dots" style="color:${color}">`;
  for (let i = 1; i <= C_MAX; i++) h += `<i class="${i <= medV ? "on" : ""}"></i>`;
  return h + "</div>";
}

function render() {
  const rows = M.map(m => ({ m, s: stats(m[plang]) }));
  const present = rows.filter(r => r.s), absent = rows.filter(r => !r.s);
  const key = {
    name: r => r.m.name.toLowerCase(),
    time: r => r.s.tMed, spread: r => r.s.spread, commits: r => r.s.cMed, output: r => r.s.oMed,
    cost: r => r.s.usd.length ? med(r.s.usd) : Infinity
  }[sortKey];
  present.sort((a, b) => { const x = key(a), y = key(b); return (x > y ? 1 : x < y ? -1 : 0) * sortDir; });
  const min = t("min");

  const body = [...present, ...absent].map(({ m, s }) => {
    const color = `var(--${m.stack})`;
    const nameCell = `<td><div class="mdl"><span class="nm"><span class="swatch" style="background:${color}"></span>${m.name}`
      + (m.preview ? ` <span class="pv">PREVIEW</span>` : "") + `</span>`
      + `<span class="st">${stackLabel(m)}${s ? " · " + s.exp : ""}${s && m[plang].iter !== "iterAll1" ? " · " + s.iter : ""}</span></div></td>`;
    if (!s) return `<tr class="dim">${nameCell}<td colspan="5"><span class="na">${t("koMissing")}${t(m.koNote || "notePreview")}</span></td></tr>`;

    const spreadTxt = s.n === 1 ? `<span class="na">${t("n1na")}</span>`
      : `<span class="figs"><em>${f1(s.spread)}×</em> <small>${t("span").replace("{x}", f1(s.tHi - s.tLo))}</small></span>`;
    const spreadBar = s.n === 1 ? `<div class="bar"></div>` : linBar(Math.min(s.spread, S_MAX) - 1, S_MAX - 1, color);

    return `<tr>${nameCell}`
      + `<td><div class="cell">${rangeBar(s.tLo, s.tHi, s.tMed, s.n, T_MIN, T_MAX, color, false)}`
      + `<span class="figs"><em>${f1(s.tMed)}${min}</em>${s.n > 1 ? ` <small>${f1(s.tLo)}–${f1(s.tHi)}</small>` : ` <small>${t("n1")}</small>`}</span></div></td>`
      + `<td><div class="cell">${spreadBar}${spreadTxt}</div></td>`
      + `<td><div class="cell">${dots(s.cMed, color)}`
      + `<span class="figs"><em>${s.cMed}</em> <small>${s.n === 1 ? t("singleRun") : s.cLo === s.cHi ? t("sameAll") : s.cLo + "–" + s.cHi}</small></span></div></td>`
      + `<td><div class="cell">${rangeBar(s.oLo, s.oHi, s.oMed, s.n, O_MIN, O_MAX, color, m.meas === "rollout")}`
      + `<span class="figs"><em>${f1(s.oMed)}K</em> <small>${m.meas}</small></span></div></td>`
      + (s.usd.length
          ? `<td><div class="cell">${rangeBar(lo(s.usd), hi(s.usd), med(s.usd), s.usd.length, U_MIN, U_MAX, color, false)}`
            + `<span class="figs"><em>$${usd(med(s.usd))}</em>${s.usd.length > 1 ? ` <small>${usd(lo(s.usd))}–${usd(hi(s.usd))}</small>` : ""}</span></div></td>`
          : `<td><span class="na">${t("costNa")}</span></td>`)
      + `</tr>`;
  }).join("");

  document.getElementById("mxbody").innerHTML = body;
  document.querySelectorAll("table.mx th").forEach(th => {
    const b = th.querySelector("button");
    if (!b) return;
    if (b.dataset.sort === sortKey) { th.setAttribute("aria-sort", sortDir === 1 ? "ascending" : "descending"); b.querySelector(".dir").textContent = sortDir === 1 ? "↑" : "↓"; }
    else th.removeAttribute("aria-sort");
  });
}

function scales() {
  const put = (sel, marks) => {
    const el = document.querySelector(`.scale[data-scale="${sel}"]`);
    if (el) el.innerHTML = marks.map(([label, pct]) => `<span style="left:${pct}%">${label}</span>`).join("");
  };
  const mt = t("minTick");
  put("time", [["3.5", 0], ["10", lg(10, T_MIN, T_MAX)], ["30", lg(30, T_MIN, T_MAX)], ["260 " + mt, 100]]);
  put("spread", [["1.0×", 0], ["2×", 50], ["3×", 100]]);
  const cm = document.querySelector('.scale[data-scale="commits"]');
  if (cm) cm.innerHTML = `<span style="left:0">${t("commitsScale")}</span>`;
  put("cost", [["$0.05", 0], ["$0.5", lg(0.5, U_MIN, U_MAX)], ["$20", 100]]);
  put("output", [["10K", 0], ["30", lg(30, O_MIN, O_MAX)], ["100", lg(100, O_MIN, O_MAX)], ["260K", 100]]);
}

/* ───────────────────────── cards / raw / notes ───────────────────────── */
const NAMES = { dsflash:"DeepSeek V4.1-Flash", dspro:"DeepSeek V4-Pro", sol:"gpt-5.6-sol", astra:"gpt-6-astra", sol6:"gpt-6-sol", luna6:"gpt-6-luna", kimi:"kimi-k3", opus55:"Opus 5.5", opus48:"Opus 4.8", fable:"Fable 5.1", opus5:"Opus 5", sonnet5:"Sonnet 5", qwen:"qwen3.8-max", open2:"Solar Open 2", pro4:"Solar Pro 4" };

function renderCards() {
  const cards = t("cards");
  document.getElementById("cards").innerHTML = CARDS.map(c => {
    const d = cards[c.key];
    return `<article class="card">
      <h3><span class="swatch" style="background:var(--${c.stack})"></span>${NAMES[c.key]}${c.preview ? ` <span class="pv">PREVIEW API</span>` : ""}</h3>
      <p class="exp">${d.exp}</p>
      <ul>${d.li.map(x => `<li>${x}</li>`).join("")}</ul>
      ${d.cav ? `<p class="cav">${d.cav}</p>` : ""}
    </article>`;
  }).join("");
}

function renderRaw() {
  document.getElementById("rawhead").innerHTML = t("rawHead").map(h => `<th>${h}</th>`).join("");
  const notes = t("rawNotes"), min = t("min");
  const cond = { native: t("condNative"), direct: t("condDirect"), codex: t("condCodex") };
  const span = {}; RAW.forEach(r => { span[r[0]] = (span[r[0]] || 0) + 1; });
  const seen = {};
  document.getElementById("rawbody").innerHTML = RAW.map(r => {
    const [model, exp, stack, pl, n, done, iter, tlo, thi, commits, out, nk] = r;
    let first = "";
    if (!seen[model]) { seen[model] = true; first = `<td${span[model] > 1 ? ` rowspan="${span[model]}"` : ""} class="g">${model}</td>`; }
    const time = tlo === "58m15s" ? t("t58") : `${tlo}–${thi}${min}`;
    return `<tr>${first}<td class="n">${exp}</td><td>${cond[stack]} · ${pl}</td><td class="n">${n}</td><td class="n">${done === "one" ? t("doneOne") : done}</td><td class="n">${iter}</td><td class="n">${time}</td><td class="n">${commits}</td><td class="n">${out}</td><td>${notes[nk]}</td></tr>`;
  }).join("");
}

function renderNotes() {
  document.getElementById("notesBody").innerHTML = t("notes").map(([h, p]) => (h ? `<h4>${h}</h4>` : "") + `<p>${p}</p>`).join("");
  document.getElementById("howList").innerHTML = t("howItems").map(x => `<li>${x}</li>`).join("");
  document.getElementById("cavList").innerHTML = t("cavs").map(x => `<li>${x}</li>`).join("");
}

/* ───────────────────────── events ───────────────────────── */
document.querySelectorAll("table.mx th button").forEach(b => {
  b.addEventListener("click", () => {
    const k = b.dataset.sort;
    if (sortKey === k) sortDir *= -1; else { sortKey = k; sortDir = 1; }
    render();
  });
});
document.querySelectorAll(".seg button").forEach(b => {
  b.addEventListener("click", () => {
    plang = b.dataset.plang;
    document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.plang === plang)));
    document.getElementById("langhint").textContent = plang === "en" ? t("hintEn") : t("hintKo");
    render();
  });
});
document.querySelectorAll(".langs button").forEach(b => {
  b.addEventListener("click", () => setLang(b.dataset.lang, true));
});

setLang(detectLang(), false);
</script>

</body></html>
