  howLat:"<b>呼び出しあたりの観測待ち時間とモデル待ち比率</b> — セッションログを時間順に読み、直前のイベントから次のイベントまでの時間を、次のイベントがモデルの出力（応答・ツール呼び出し・reasoning）なら<b>モデル待ち</b>、ツール結果なら<b>ツール実行</b>に帰属します。呼び出しあたり待ち時間は、モデル待ちをそのrunのモデル応答数で割った値です（バー = run間の範囲、目盛 = 中央値）。モデル待ち比率は モデル待ち /（モデル待ち + ツール実行）です。いずれも英語runのセッションログのみから得ており、「—」は未計測です。モデルの速度ではなく観測された待ち時間です。下の注意点も参照してください。",
  cavLat:"<b>呼び出しあたりの待ち時間はモデルの速度ではありません。</b> 呼び出しごとの生成トークン数、コンテキストの大きさ、クライアントがツール呼び出しをまとめる方法、プロバイダのエンドポイントとその時間帯のサーバー負荷、ネットワーク・待ち行列の時間がすべて含まれます。実験ごとに日付とクライアントのバージョンが異なるため、行どうしの比較は参考です。方法・定義・run別データ: <a href=\"https://github.com/roboco-io/coding-agent-benchmark/tree/main/analysis/latency\">analysis/latency ↗</a>",
  latRawNote:"モデル待ち・ツール時間・モデル呼び出し・モデル待ち1秒あたりのoutputは英語runの範囲で、runの時間として集計したiterationを合算したセッションログに基づきます（モデルの速度ではなく観測待ち時間、「—」= 未計測）。定義: analysis/latency/README.md。",
  howEyebrow:"読み方",
  howItems:["<b>バーの読み方</b>——1行が1つのモデル×エージェントの組み合わせです。バーはそのモデルのrunの最小値から最大値までの範囲で、白い縦線が中央値です。列見出しをクリックするとその基準で並び替わります。", "<b>エージェント</b>——Ralphループを実行したコーディングエージェントのハーネス（Claude Code、Codex CLI、pi、Antigravity CLI）です。2行目はモデルの接続方式で、ネイティブ・OpenAI・Google、または表示されたプロバイダーAPIへの直結を示します。同じモデルが複数のエージェントに現れることがあります。", "<b>所要時間</b>——1回のrunで課題を完走するまでにかかったエージェントのセッション時間です。ほとんどの条件は中央値で3–19分に集まっています。Solarの2モデル（58分、119–258分）はプレビューAPIの遅い応答とキャッシュ非対応の影響も含むため、モデル性能の比較には使わないでください。", "<b>run間変動</b>——同じ条件で最も遅いrunが最も速いrunの何倍かかったかです。大きいほど次のrunの所要時間を予測しにくくなります。例：kimi-k3 2.8倍、pi × DeepSeek V4.1-Flash 2.1倍、qwen3.8-max 1.1倍。", "<b>コミット規律</b>——1回のrunで作られたgitコミット数です（塗りつぶし点 = 中央値）。結果の品質ではなく作業スタイルの違いを示します。同じプロンプトでもOpus 4.8はたいてい一度にコミットし（中央値1）、Opus 5は何度にも分けてコミットします（中央値6）。", "<b>outputトークン</b>——モデルが生成したトークン数（thinkingを含む）です。枠線だけのバー（GPTの4モデル）はCodexの記録方式で計測した値のため、塗りつぶしバーとは直接比較できません。piの6行はpi自身のセッション記録で計測しました（outputにthinkingを含む）。", "<b>runあたり換算コスト</b>——runで使ったトークンに公開API単価を掛けた推定値です。実際の請求額ではありません（サブスクリプション・プレビューで実行）。適用した単価と前提は下の「解釈上の注意」にあります。", "<b>主な観察</b>——中央値が最も短い条件はpi × Sonnet 5.5（英語2.4分、runごとに1.8–3.2分、このリポで最短の完走セッション1分49秒を含む）、Claude CodeのSonnet 5.5（英語3.2分、韓国語2.9分、runごとに2.5–4.2分）、pi × DeepSeek V4.1-Flash（3.3分、runごとに1.9–4.1分）です。Sonnet 5.5は実行日とCLIバージョンが異なり、piとClaude Codeの条件の間でもエージェント・thinking設定・キャッシュ保持時間が同時に異なるため、モデル単独の順位とは見なしません。最も安いのはgpt-6-luna（runあたり約$0.03）、次がpi × DeepSeek V4.1-Flash（約$0.06）、Claude CodeのDeepSeek V4.1-Flash（約$0.09）です。速いからといって安いわけではありません。Fable 5.1は6.9分と速いほうですが、runあたり約$3.5でOpus 5.5（$1.25）の約3倍です。", "<b>KO正本トグル</b>——プロンプトを韓国語訳に替え、成果物（コミット・README）も韓国語で書かせた条件です。実験した10モデルはすべて完走しました。英語条件より明らかに遅くなったのはqwen3.8-maxだけ（15.1分 → 22.8分）で、2条件の実行日が異なるため言語の影響とは断定しません。"],
  cardsEyebrow:"モデル別の特徴 · 所要時間順",
  cards:{
    sonnet55:{"exp": "Claude Code · EXP-031 · 英語・韓国語 · Sonnet 5の後継", "li": ["<b>Claude Codeで最も短いセッション</b>——6 runすべてがiteration 1で2.5–4.2分で終わりました（英語の中央値3.2分、韓国語2.9分）。runあたりのAPI呼び出しも16–24回で、他のネイティブClaude条件（Opus 5.5は22–41回）より少なくなっています。", "<b>runあたり約$0.68</b>（0.60–0.82、韓国語0.70）——単価はSonnet 5と同じですが、runあたりのoutputが15.2–20.9K、キャッシュ読み取りが1.1–1.6Mトークンにとどまり、Sonnet 5の約1/5、Opus 5.5の約半分です。", "シェルコマンド（Bash）だけを使い、Read/Write/Edit・MCP・スキル・サブエージェントは一度も使いませんでした。heredocでファイルを書き、公式リポのclone → Hurlテストの要約 → コードの一括作成 → 実行検証 → 完了宣言という短い経路をたどり、6 runすべてがFastify + Prisma + SQLiteを選びました。"], "cav": "2026-09-29にClaude Code 2.1.284で、他のClaudeモデルの数日後に、ユーザーのグローバル設定が見える状態（EXP-023/026/028と同じ）で実行しました。この実験からハーネスが空きポートをPORTとして渡しており、韓国語3 runはそれに従い、英語3 runは変数名を変えて無視しました。日付・CLIバージョン・ポート注入がすべて異なるため、「最も短い」はこの条件での観測であり、モデル単独の順位ではありません。キャッシュ書き込み単価は標準倍率による仮定で、未確認です。"},
    pisonnet55:{"exp": "pi coding agent → Anthropic API（APIキー）直結 · EXP-032 · 英語", "li": ["<b>全条件で中央値が最短、英語2.4分</b>（1.8–3.2分）。このリポで最短の完走セッション（1分49秒）もこの条件です（従来の最短はEXP-029 pi × DeepSeek V4.1-Flashの1.9分）。3 runすべてiteration 1で完走し、コミットは1–3、API呼び出しは13–23回です。", "<b>runあたり約$0.30</b>（0.25–0.32）、output 10.9–14.7Kで、同じ日のClaude CodeのSonnet 5.5（英語約$0.68、15.2–20.0K）より低い値です。コスト差の一部はキャッシュ保持時間の違いで、piは5分キャッシュ（100万トークンあたり$2.50）、Claude Codeは1時間キャッシュ（$4）でした。", "pi 0.87.1の内蔵リストにSonnet 5.5がないため、内蔵のclaude-sonnet-5定義をコピーしたユーザー定義モデル項目で呼び出しました。作業はほぼpiのbashツールだけで行い（run 1でwrite 1回）、3 runすべてがFastify + Prismaを選び、thinkingはpiのデフォルト（medium）でした。"], "cav": "同じ日のClaude CodeのSonnet 5.5（EXP-031）と比べると、エージェント、thinking設定（pi medium対Claude Codeのデフォルト）、キャッシュ保持時間（5分対1時間）が同時に異なるため、差をpiだけの効果とは見なしません。n=3、英語条件のみ。従量課金のAPIキーで実行しましたが請求額は確認しておらず、キャッシュ書き込み単価は標準倍率による未確認の仮定です。"},
    piflash:{"exp": "pi coding agent → DeepSeek API（OpenAI互換）直結 · EXP-029 · 英語", "li": ["<b>英語の中央値3.3分</b>で、pi × Sonnet 5.5（EXP-032）とClaude CodeのSonnet 5.5（EXP-031）に次いで短い値です。最も速いrun（1.9分）は、EXP-032（1分49秒）まではこのリポで最短の完走セッションでした。最も遅いrunは4.1分でした（run間変動2.1倍）。", "<b>runあたり約$0.06</b>（0.04–0.07）で、gpt-6-lunaに次いで安価です。", "3 runすべてiteration 1で完走し、コミットは2–4。thinkingはpiのデフォルト（high）のままでした。run 1は再実行の結果です。元のrun（7.7分）はVS Codeがポート3000–3001を占有していたため約2.6分を失いました（D-3）。"], "cav": "Claude Codeで実行したDeepSeek V4.1-Flash（EXP-025、4.6–6.0分）と同じモデルですが、ツールとAPI形式が同時に異なり、実行時期も3日ずれているため、差をpiの効果とはみなしません。コストはピーク時間帯の単価で、実際の請求額は計測していません。"},
    pikimi:{"exp": "pi coding agent → Moonshot API（OpenAI互換）直結 · EXP-029 · 英語", "li": ["<b>英語の中央値9.9分</b>（9.5–9.9分）。3 runの時間差は0.4分以内、outputも17.4–18.7Kで、pi条件の中で最も安定していました。", "<b>runあたり約$0.65</b>。3 runすべてiteration 1で完走し、コミットは3–4。", "エージェントはPATH上の<span class=\"mono\">hurl</span>がnpmパッケージであることに自分で気づき、自作のテストスクリプトが本物のHurl実行ファイルを使うように直しました。判定は採点側が固定したパスで行ったため影響はありません。"], "cav": "Claude Codeで実行したkimi-k3（EXP-014/016、7.6–21.3分）とはツールとAPI形式が同時に異なるため、差をpiの効果とはみなしません。piではMoonshotがキャッシュ書き込みを記録し、入力単価で計算しました。"},
    piqwen:{"exp": "pi coding agent → DashScope API（OpenAI互換）直結 · EXP-029 · 英語", "li": ["<b>英語の中央値18.7分</b>（15.6–29.0分）で、pi条件の中で最も長い。原因は確認していません（リクエストごとの遅延は未計測）。", "run 1は別のプログラム（VS Code Live Preview）が採点ポートを占有し、iteration 1–4が誤って失敗と判定されたため、iteration 5で完走（29.0分、コミット12）と記録されました。iteration 1のコードも再採点で通過しており、このrunの時間・コミット・トークンには撹乱が含まれます。", "<b>runあたり約$0.75</b>（0.59–1.52、上端は撹乱されたrun 1）。"], "cav": "thinkingはこのモデルに対するpiのデフォルト（medium）で、他の2条件（high）と異なります。qwen3.8-maxはオープンウェイトではなくAPI専用モデルの可能性があります（未確認）。コストはシンガポールリージョンの単価です。"},
    piopus:{"exp": "pi coding agent → Anthropic API（APIキー）直結 · EXP-030 · 英語", "li": ["<b>英語の中央値3.9分</b>（3.1–4.9分）。3 runすべてiteration 1で完走し、コミットは2–4。Claude CodeのOpus 5.5（EXP-026、4.0–8.4分）と範囲が重なります。", "<b>runあたり約$0.81</b>（0.74–0.87）、output 16.6–19.8Kで、どちらもClaude Codeのrun（約$1.25、18.6–28.2K）より低い値でした。コスト差の一部はキャッシュ保持方式によるものです。piは5分キャッシュ（100万トークンあたり$5）、Claude Codeは1時間キャッシュ（$8）で書き込みました。", "piのツールのうちbashだけを使い（runあたり17–27回）、ファイルもシェルのheredocで作成しました。thinkingはpiのデフォルト（medium effort）です。"], "cav": "エージェントとAPI経路（システムプロンプト・ツール・thinkingの渡し方・キャッシュ保持）がClaude Codeと同時に異なり、実行日も1日違うため、差をpiの効果とはみなしません。従量課金のAPIキーで実行し、実際の請求額は計測していません。"},
    pisol:{"exp": "pi coding agent → ChatGPT（OAuthログイン）· EXP-030 · 英語", "li": ["<b>英語の中央値4.4分</b>（4.2–5.6分）。3 runすべてiteration 1で完走し、コミットは各2。Codex CLIのgpt-6-sol（EXP-027、4.8–5.2分）と範囲が重なります。", "<b>runあたり約$0.27</b>、output 7.0–8.6Kで、Codex CLIのrun（約$0.43、10.4–11.0K）より低い値でした。", "piでbashだけを使ったOpus 5.5と違い、bashとpiのwrite・edit・readツールを併用しました。reasoning effortはpiのデフォルトmediumで、Codexのrunと名目上の設定は同じです。"], "cav": "ChatGPTプランのログインで実行したため請求はなく、コストはAPI単価による推定値です。Codexのrunと同じ日ですが、エージェントとリクエスト構成が異なるため、差をpiの効果とはみなしません。"},
    gemflash:{"exp": "Antigravity CLI → Gemini API（APIキー）· EXP-035 · 英語 · このハーネスの初実験", "li": ["<b>英語の中央値17.5分</b>（15.5–22.4分）。run 1・2はiteration 1で完走し、run 3はモデルの失敗ではなくハーネスが原因でiteration 2で完走しました（次項）。", "<b>run 3（D-1）</b>：エージェントがハーネスの採点器（<span class=\"mono\">../measure.sh</span>）を自ら実行し、採点器のクリーンアップ段階がagyプロセスを終了させました。コードは既に13/13でしたが完了宣言前だったため、iteration 2が完了を宣言しました。run 2は完了後に503エラーが1回記録されましたが、判定には影響しません（D-4）。", "<b>runあたりモデル応答ステップ119–192回</b>、output 50.5–63.4K（thinking含む）。他のFlash級モデルよりはるかに応答が多いです。例：pi × DeepSeek V4.1-Flash（EXP-029）は応答25–40回・1.9–4.1分。観測であり、原因は確認されていません。", "<b>runあたり換算コスト$1.39–1.68</b>（中央値$1.47）。2026-10-07に確認した公開単価（1Mトークンあたり$0.75 / キャッシュ$0.075 / $3.75、2026-12-31まで、2027-01-01から2倍）で計算しました。従量課金のGemini APIキーで実行したため実際の課金がありましたが、請求額は確認していません。"], "cav": "Antigravity CLI 1.3.1の初実験です。agy製品内蔵スキルとシステムプロンプトは無効化しておらず、トークンusageの定義も他のハーネスと異なるため、同日のpi × gemini-3.8-flash（EXP-036）とは組み合わせ全体の違いとしてのみ比較してください。n=3、英語のみ。"},
    pigemflash:{"exp": "pi coding agent → Gemini API（APIキー）直結 · EXP-036 · 英語", "li": ["<b>英語の中央値14.0分</b>（13.1–15.6分）。3 runすべてiteration 1で完走し、コミットは4–7。", "<b>runあたり応答102–119回</b>、output 29.7–47.1K。同じpi 0.87.1でpi × DeepSeek V4.1-Flash（EXP-029）は応答25–40回・1.9–4.1分でした。モデルと日付が同時に異なるため、原因を特定しない観測です。", "同日・同モデルのAntigravity CLI（EXP-035、15.5–22.4分、50.5–63.4K）よりセッションが短く、outputも少なめでした。ハーネス・システムプロンプト・usage定義がすべて異なります。", "<b>runあたり換算コスト$0.80–1.14</b>（中央値$1.11）。2026-10-07に確認した公開単価（1Mトークンあたり$0.75 / キャッシュ$0.075 / $3.75、2026-12-31まで、2027-01-01から2倍）で計算しました。従量課金のGemini APIキーで、請求額は確認していません。"], "cav": "run 3はハーネスディレクトリを探索し、採点器を読んで実行し、以前のrunのログ・metricsを読み、Hurl正本をコピーしました（D-2）。判定は絶対パスでの再検証により有効ですが、このrunの時間・トークンは独立試行の値ではありません。run 1のセッションログにenv | grepで秘密値が残ったため、保管版をマスキングしハーネスを修正しました（D-3）。n=3、英語のみ。"},
    pisol61:{"exp": "pi coding agent → ChatGPT（OAuthログイン）· EXP-034 · 英語", "li": ["<b>英語の中央値8.7分</b>（8.3–9.2分）。3 runすべてiteration 1で完走し、コミットは3–5、応答は29–34回です。", "<b>約2倍長くなった理由（セッション記録の分析）</b>：EXP-030と同じpi 0.87.1で、ツール実行時間（43–59秒 対 36–37秒）とモデル呼び出し回数（29–34回 対 31–35回）は同程度でしたが、モデル呼び出し1回あたりの待ちが約2倍（14–15秒 対 7–8秒）になり、runあたりのoutputは約1.6倍になりました。同時刻比較でもgpt-6.1-solは約1.4倍遅く生成速度が約20%低いため、日付やクライアントだけでなくモデルまたはその配信経路による差です。<a href=\"https://github.com/roboco-io/coding-agent-benchmark/tree/main/analysis/gpt61-sol-slowdown\">分析</a>", "runあたりのoutputは12.5–13.3Kで、pi × gpt-6-sol（EXP-030、4.2–5.6分、7.0–8.6K）と同日のCodex CLI × gpt-6.1-sol（EXP-033、6.2–9.8分）を並べると、両ハーネスとも以前のgpt-6-sol測定より長くなりました。モデル側の変化と整合しますが、立証されたわけではありません。", "<b>runあたり換算コスト$0.30–0.35</b>（中央値$0.30）。2026-10-03に確認した公開API単価（1Mトークンあたり$2 / キャッシュ$0.10 / $10）で計算しました。ChatGPTログインで実行したため請求はありません。"], "cav": "pi 0.87.1の内蔵リストにこのモデルがないため、内蔵gpt-6-sol定義を複製したユーザー定義項目で呼び出しており、コンテキストウィンドウなどの設定が実際のモデルと異なる可能性があります。日付と項目がEXP-030と異なるため、モデルだけの順位ではありません。n=3、英語のみ。"},
    opus55:{"exp": "Claude Code · EXP-026 · 英語・韓国語 · 2026-09リリース", "li": ["<b>Claude CodeでSonnet 5.5（EXP-031）に次いで短いモデル</b>——6 run中5 runが4.0–4.2分で終わりました（英語の中央値4.2分、韓国語4.0分）。残る1 run（8.4分）は、エージェントが自分で作ったテストスクリプトのポート競合を解決するのに時間がかかりました。", "<b>runあたり約$1.25</b>——生成トークンが約20KとClaudeモデルでSonnet 5.5に次いで少なく、キャッシュ読み取り単価も入力単価の1/20と低いため、Opus 5の約1/5です。", "韓国語条件でも速さは同じで、コミットメッセージとREADMEをすべて韓国語で書きました。シェルコマンド（Bash）だけで作業し、接続されていた外部ツール（MCP）は一度も使いませんでした。"], "cav": "他のClaudeモデルより数週間後に、新しいClaude Code（2.1.280）で実行しました。この順位はこの条件での観測であり、確定した優位ではありません。"},
    dsflash:{"exp": "Claude Code → DeepSeek APIに直接接続 · EXP-025 · 英語・韓国語 · 2026-09-10リリース", "li": ["<b>Claude Codeで実行したモデルの中で最も安い</b>——runあたり約$0.09（韓国語$0.12）で、V4-Pro（$0.52）の約1/6です。これより安いのはCodex CLIで実行したgpt-6-luna（約$0.03）だけです。キャッシュ読み取り単価が100万トークンあたり$0.006と非常に低いためです。", "<b>Claude Codeで3番目に速いモデル</b>——英語の中央値4.8分（4.6–6.0分）。韓国語は4.2–8.4分でrunごとの差が大きめでした。", "ファイルの読み取り・書き込み・編集ツール（Read/Write/Edit）をまんべんなく使いました。他の直接接続モデルは主にシェルコマンド（Bash）に頼っていました。韓国語条件でもコミットとREADMEをすべて韓国語で書きました。"], "cav": "使った分だけ課金されるAPIで実行しました。コストはピーク時間帯の単価で、それ以外の時間帯は半額です。"},
    sol:{"exp": "Codex CLI · EXP-011/016（英語） · EXP-019（韓国語）", "li": ["<b>英語の中央値5.8分</b>（5.3–10.0分）、runあたり約$1.05。Codex CLIのモデルの中ではgpt-6-sol（4.9分）より遅く、gpt-6-astra（7.1分）より速いです。", "3 run中1 runが2回目の反復で完走しました。Solarの2モデルを除けば、1回目で終わらなかった唯一のケースです。", "英語中心のモデルですが、韓国語条件ではコミットとREADMEをすべて韓国語で書きました。"], "cav": "実行ツール（Codex CLI）がClaude Codeと異なるため、時間は参考値です。outputはCodexの記録方式のため、他のモデルと直接比較できません。コストは11月21日までのプロモーション単価です。"},
    fable:{"exp": "Claude Code · EXP-023 · 英語 · Claude 5世代の最上位モデル", "li": ["<b>英語の中央値6.9分</b>（6.2–7.8分）とOpus 4.8より速いものの、単価がOpusの2倍なので<b>runあたり約$3.5</b>とOpus 5.5の約3倍です。", "生成トークン（28.7–35.8K）はOpus 4.8と同程度で、Opus 5（41–48K）より少なめです。つまりOpus 5の多い生成量はClaude 5世代共通の特徴ではなく、Opus 5だけの特徴です。", "3 runを通じてシェルコマンド（Bash）71回とファイル書き込み2回だけを使い、ファイルの読み取り・編集ツールは使いませんでした。"], "cav": "ユーザーのグローバル設定（外部ツールMCP、応答言語）が露出した状態で実行しました。Opus 4.8・Opus 5の実験と同じ条件ですが、7週間後の実行です。"},
    sol6:{"exp": "Codex CLI · EXP-027 · 英語 · GPT-6世代", "li": ["<b>英語の中央値4.9分</b>（4.8–5.2分）、runあたり約$0.43。3 runとも約5分・コミット3回・output約11Kで、run間の差がごく小さいです。", "この課題ではgpt-5.6-sol（中央値5.8分）やgpt-6-astra（7.1分）より短くかかりました。ただしastraは2週間早く、旧Codex CLI（0.153.4、今回は0.155.1）で実行したため、この差をモデルの違いとは断定しません。", "すべての応答がgpt-6-solから返りました（代替モデルなし）。採点後にサーバープロセスが残った採点インフラの問題1件（逸脱D-1）はエージェントに介入せず処理し、判定への影響はありません。"], "cav": "2026-09-24にCodex CLI 0.155.1、reasoning effort medium、ChatGPTプランのログインで実行したため、請求額はありません。コストは2026-09-24に確認した標準の短文脈単価で換算しました。最初に依頼されたgpt-6-earthは存在しないモデルIDでした。"},
    sol61:{"exp": "Codex CLI · EXP-033 · 英語 · GPT-6世代、gpt-6-solの後継", "li": ["<b>英語の中央値8.7分</b>（6.2–9.8分）。3 runすべてiteration 1で完走し、コミットは各4。ループの復旧寄与は観測されませんでした。", "<b>約2倍長くなった理由（セッション記録の分析）</b>：ツール実行時間（27–39秒 対 40–55秒）とモデル呼び出し回数（21–31回 対 26–35回）は同程度で、モデル呼び出し1回あたりの待ち時間が約2倍（16–23秒 対 7–10秒）になり、モデル待ち1秒あたりのoutputは42–45から29–30トークンに減りました。同時刻に同じリクエストを交互に3回ずつ送った比較（2026-10-03）でもgpt-6.1-solは約1.4倍長く、outputは10–17%多く生成速度は約20%低い結果でした。クライアントバージョンが同じpiでも同じ差が出たため、クライアントバージョンは主因ではありません。<a href=\"https://github.com/roboco-io/coding-agent-benchmark/tree/main/analysis/gpt61-sol-slowdown\">分析</a>", "runあたりのoutputは10.0–16.2K、キャッシュヒット率は92–94%でした。同じハーネスのgpt-6-sol（EXP-027、4.8–5.2分、10.4–11.0K）よりセッションが長くoutputのばらつきも大きいですが、観測であって順位ではありません。", "<b>runあたり換算コスト$0.27–0.46</b>（中央値$0.36）。2026-10-03に確認した公開API単価（1Mトークンあたり入力$2、キャッシュ入力$0.10、出力$10、Standard 272K以下）で計算しました。キャッシュ入力単価はgpt-6-sol（$0.20）の半分で、入力の92–94%がキャッシュ読み込みのため影響が大きいです。ChatGPTプランのログインで実行したため請求はありません。"], "cav": "Codex CLI 0.160.0にはこのモデルのローカル項目がなくfallbackメタデータで動作し、CLIバージョンと日付もEXP-027（0.155.1/0.156.1、2026-09-24）と異なります。セッション記録の分析はクライアントよりモデル呼び出しの遅延を示していますが、run単位の差のうち測定日の影響がどれだけかは分離できていません。n=3、英語のみ。"},
    luna6:{"exp": "Codex CLI · EXP-027 · 英語 · GPT-6世代", "li": ["<b>英語の中央値6.6分</b>（5.4–10.0分）。<b>runあたり約$0.03で、全モデル中もっとも推定コストが低いです。</b>公開単価がgpt-6-solの1/20だからです。", "Codexの説明は「fast and affordable」ですが、この課題では3 runすべてがgpt-6-solのどのrunよりも長くかかりました。run 1が最長で（10.0分、コミット8回、output 21.5K、input累計4.0M）、run 2・3はsolに近い値でした。", "output（13.4–21.5K）とコミット数（4–8回）のばらつきはsolより大きいです。"], "cav": "gpt-6-solと同じ日・同じ条件で交互に実行しました。n=3なので「solより遅い」は観測値であり、確定した順位ではありません。コストは標準の短文脈単価で換算し、請求額はありません。"},
    sonnet5:{"exp": "Claude Code · EXP-028 · 英語・韓国語 · Claude 5世代", "li": ["<b>英語の中央値14.2分</b>（13.0–15.3分）、韓国語14.2分（11.2–16.8分）。6 runすべてが完走し、うち5 runはiteration 1で終わりました。", "en-1ではエージェントがスキャフォールド後とテスト準備後に自ら止まり、iteration 3でAPIを実装しました。Ralphループが分割された作業を引き継いで完走につなげ、rejectedされた完了宣言はありませんでした。", "<b>runあたり約$3.1</b>（$2.67–4.21）——入力・出力単価はOpus 5.5の半分なのに、Opus 5.5（約$1.25）より高くなりました。outputが約3倍（57.6–73.7K）で、runごとのキャッシュ読み取りが7–14Mトークンあったためです。"], "cav": "Opus 5.5の翌日にClaude Code 2.1.281で、ユーザーのグローバル設定が見える状態で実行しました（EXP-023/026と同条件）。グローバルの「韓国語で応答」ルールにより、英語runの最終要約も大半が韓国語でした。Opus 5.5・Fable 5.1より遅いというのはn=3の観測で、確定した順位ではありません。"},
    astra:{"exp": "Codex CLI · EXP-021 · 英語 · GPT-6世代の最初のモデル", "li": ["<b>英語の中央値7.1分</b>、runあたり約$2.0。3 runの時間差が0.5分しかなく、最も安定したモデルの一つです。", "前のモデルgpt-5.6-solより23–32%長くかかりました。OpenAIが発表した「1.9倍高速」はこの課題では再現しませんでした。", "OpenAIはAnthropic互換APIを提供していないため、Codex CLIでしか実行できません。solの実験から変えたのはモデル名だけです。"], "cav": "リリース6日後に実行しました。ChatGPTプランのログインで実行したため実際の課金はなく、コストは短いコンテキストの単価で換算しています。"},
    kimi:{"exp": "Claude Code → Moonshot APIに直接接続 · EXP-014/016（英語） · EXP-017（韓国語）", "li": ["<b>英語の中央値7.9分</b>、runあたり約$0.78。ただしrunごとに7.6分から21.3分（2.8倍）まで変わり、<b>Claude Codeで所要時間を最も予測しにくいモデル</b>です。コミット数も1–4とばらばらです。", "生成トークンが最も少ない部類（14.4K）なのに、同じテストに合格しました。生成量が少ないからといって結果が悪いわけではありません。"], "cav": "thinking（推論）機能をオフにできないため、オンのまま実行しました。Moonshotはキャッシュ書き込みトークンを0と記録します。"},
    opus48:{"exp": "Claude Code · EXP-010（英語） · EXP-019（韓国語）", "li": ["<b>最も安定したモデル</b>——6 runすべて7.1–8.7分で、英語・韓国語ともに中央値は8.3分です。runあたり約$3.2。", "たいてい全体を実装してから<b>一度だけコミット</b>します（中央値1）。韓国語の3 runはすべてコミット1回でした。"], "cav": ""},
    opus5:{"exp": "Claude Code · EXP-009/010（英語、6 run） · EXP-019（韓国語）", "li": ["<b>Sonnet 5に次いで生成トークンが多いClaudeモデル</b>（中央値47.0K）で、<b>runあたり約$5.8とClaudeモデルで最も高価です。</b>英語の中央値11.9分。", "作業を<b>何度にも分けてコミット</b>します（中央値6）。同じプロンプトを受けたOpus 4.8（中央値1）とは正反対のやり方です。"], "cav": ""},
    dspro:{"exp": "Claude Code → DeepSeek APIに直接接続 · EXP-025 · 英語・韓国語", "li": ["<b>英語の中央値13.3分</b>とFlashより2.5–3倍遅いものの、<b>runあたり約$0.52</b>で2番目に安いモデルです。", "韓国語3 runの時間差は0.4分だけで、コミットも4・4・4回と同じ。<b>韓国語条件で最も安定したモデル</b>でした。", "ドキュメントにはV4-ProのリクエストがFlashに回される場合があるとの案内がありましたが、6 runのすべての応答が実際にV4-Proでした。"], "cav": "Flashより前のバージョン（08-13、Flashは09-10）なので、同じ会社の中でも世代が異なります。コストはピーク時間帯の単価です。"},
    qwen:{"exp": "Claude Code → DashScope APIに直接接続 · EXP-013/016（英語） · EXP-017（韓国語）", "li": ["<b>英語の中央値15.1分</b>、runあたり約$1.1。3 runの差が1.0分だけで、<b>所要時間を最も予測しやすいモデル</b>です。", "韓国語条件で<b>22.8分と明らかに遅くなった唯一のモデル</b>です。2条件の実行日が異なるため、原因を言語とは断定しません。", "APIアドレス・キー・モデル名の3つを変えるだけで接続でき、トラブル対応は不要でした。この結果から「プロバイダのAPIに直接接続」がこのベンチマークの標準になりました。"], "cav": "コストはシンガポールリージョンの単価です。"},
    open2:{"exp": "Claude Code → Upstage APIに直接接続 · EXP-015 · 英語、1 run", "li": ["<b>58分15秒</b>と速いモデルの約10倍かかり、2回目の反復で完走しました。生成トークンは252.3Kで、thinkingの比重が大きめでした。", "採点器が正常な完走を一度失敗と判定しました（サーバーのポートを見つけられなかった採点器のエラー）。採点器を直してから2回再採点し、合格を確認しました。"], "cav": "試験サービスが終了し、2026-08-05にAPIが停止しました。追加の実行ができないため、この1 runが最後の記録です。公開単価がないためコストは計算していません。後継モデルはSolar Pro 4です。"},
    pro4:{"exp": "Claude Code → Upstage APIに直接接続 · EXP-020 · 英語", "li": ["<b>最も時間がかかったモデル</b>（119–258分）。セッションログを分析すると、キャッシュ非対応、リクエストあたり平均37秒の往復時間、生成トークンの88%がthinkingという3つの要因が重なった結果でした。", "3 runすべて完走しました。遅さの原因はプレビューサービスの応答速度とキャッシュがないことで、モデルが課題を解けなかったわけではありません。", "run 1では無関係なnpmパッケージが採点プログラムを隠し、正常な完走宣言が9回失敗と判定されました。後で再採点し、実際の完走時点を確定しました。"], "cav": "コスト$8.0は定価での換算です。キャッシュが記録されず入力全体が非キャッシュ単価で計算されたため高く出ており、実行当時は無料・割引期間でした。"}
  },

  notesTitle:"調査ノート", notesSmall:"変換プロキシを使わない理由 · 採点器のエラー3件 · 訂正記録",
  notes:[["① モデル接続に変換プロキシ（ccr）を使わない理由", "Claude CodeはAnthropic APIの形式でリクエストを送ります。OpenAI形式しか受け付けないモデルにつなぐには、途中で形式を変換するプロキシ（ccr、claude-code-router）が必要ですが、初期の実験ではこのプロキシが複数の問題を起こしました。ツール呼び出しの引数が壊れ（EXP-006：分割されて届いた応答の最初の断片だけを処理し、<span class=\"mono\">python3</span>が<span class=\"mono\">3</span>に変わった）、トークン使用量の記録が抜け（EXP-012）、モデルごとに変換コードを書く必要があり、応答が止まったりコンテキスト上限の設定漏れで実行が中断したりしました。一方、プロバイダが公式に提供するAnthropic互換API（Upstage・DashScope・Moonshot・DeepSeek）に直接つなぐと、こうした問題は一度も起きませんでした。そのため、プロキシを経由した結果は比較から外しました。理由は速度ではなく、エラーと計測の歪みです（プロキシが遅いかどうかはモデルの違いと切り分けられず、確認できていません）。Anthropic互換APIがないOpenAIのモデルは、OpenAI公式のCodex CLIで実行します。EXP-029で追加した第3のツールpi coding agentはOpenAI形式を標準で使うため、変換プロキシなしでプロバイダのOpenAI互換APIにつなぎました。EXP-005/006/012の生データとレポートはリポジトリに残っています。"], ["② 採点器が正常な完走を失敗と判定した3件", "エージェントが完了を宣言すると、採点スクリプトがサーバーを起動して公式テストを実行します。このスクリプトが、実際には完走した結果を失敗と判定したことが3回ありました。EXP-010 run 48-1では、採点用のテストファイルがコピーされていませんでした。EXP-015 iteration 2では、<span class=\"mono\">npx tsx</span>で起動したサーバーのコマンドラインにリポジトリのパスがなく、採点器がサーバーのポートを見つけられませんでした（プロセスの作業ディレクトリで探すよう採点スクリプトを修正、measure v4）。EXP-020 pro4-1では、実験の11日前に入れた無関係なnpmパッケージ（<span class=\"mono\">@hurl/cli</span>）が本物のテストツールHurl 8.0.1をPATH上で隠し、正常な完走宣言が9回連続で失敗と判定されました。<b>教訓：失敗の判定は採点ログを確認してから確定し、採点に使うプログラムのパスまで固定すること。</b>EXP-021からは最初から絶対パスを固定しており、それ以降このエラーは起きていません。"], ["③ 訂正・除外の記録（2026-08-04）", "初期の整理でEXP-006 open2-2とEXP-008をプロキシ（ccr）経由の実行と誤って記録しましたが、確認したところどちらもUpstage APIへの直接接続でした。ダッシュボードとリポジトリの文書をまとめて修正し、「直接接続はプロキシより速い」という説明を撤回しました。EXP-008は現在の標準プロンプトが決まる前のプロンプトで実行していたため（iteration 10、約173分）、同じモデル・接続方式を標準条件で再実行したEXP-015に置き換え、比較から外しました。"], ["", "<b>3つの調査に共通する教訓：</b>ベンチマーク結果の信頼性は、モデルよりも実験環境の管理にかかっていました。形式変換プロキシをなくし、実行環境を他の設定から隔離し、採点器の失敗判定もログで検証する必要があります。"]],
  cavTitle:"解釈上の注意", cavSmall:"この数字から言えないこと",
  cavs:["<b>判定基準は完走したかどうかだけです。</b>109 runすべてが完走したため、モデル間の違いは時間・コミット・output・コストにしか現れません。しかし所要時間だけでも同じモデル・同じ条件でrunごとに最大2.8倍変わり、各条件は3回（一部は1回）しか実行しておらず、課題もRealWorldバックエンド1つだけです。表の順位は参考値であり、「どのモデルがより効率的か」という結論の根拠にはしないでください。", "<b>コストは実際に支払った額ではなく推定値です。</b>runごとのトークンを非キャッシュ入力・キャッシュ読み取り・キャッシュ書き込み・出力に分け、2026-09-23（gpt-6-sol・gpt-6-lunaは09-24、Sonnet 5.5は09-29でキャッシュ書き込み単価は標準倍率による仮定・未確認）に確認した各プロバイダの公開API単価を掛けました。gpt-6.1-sol（EXP-033/034）は2026-10-03に確認した公開API単価（1Mトークンあたり$2 / キャッシュ$0.10 / $10）を使いました。gemini-3.8-flash（EXP-035/036）は2026-10-07に確認した公開単価（1Mトークンあたり$0.75 / キャッシュ$0.075 / $3.75、2026-12-31まで、2027-01-01から2倍）を使いました。これらのrunは従量課金のGemini APIキーで実行したため実際の課金がありましたが、請求額は確認していません。実際の実行はClaudeがサブスクリプション、GPTの5モデルがChatGPTプランのログイン、Solarが無料・割引期間のプレビューだったため、この金額は請求されていません。適用した単価：DeepSeekはピーク時間帯の単価（他の時間帯は半額なので上限値）、gpt-5.6-solは11月21日までのプロモーション単価、qwenはシンガポールリージョンの単価、Claudeのキャッシュ書き込みは1時間保持の単価。run内の再試行や追加セッションも含みます。Solar Open 2は公開単価がないため計算していません。pi run（EXP-029/030/032）はpiのセッショントークン記録に同じ単価を掛けました。pi × Opus 5.5（EXP-030）とpi × Sonnet 5.5（EXP-032）は従量課金のAnthropic APIキーで実行し、キャッシュ書き込みはpiのデフォルトである5分保持の単価で計算しました。pi × gpt-6-solはChatGPTプランのログインのため請求されていません。実際の請求額は計測していません。<a href=\"https://github.com/roboco-io/coding-agent-benchmark/tree/main/analysis/cost\">計算方法・単価の出典・runごとのデータ ↗</a>", "<b>モデルによってトークンの記録方式が異なります。</b>outputはClaude Codeのセッション記録（塗りつぶしバー）とCodexの記録（枠線バー）の2通りで計測しており、両者は比較できません。キャッシュ使用量もプロバイダごとに記録範囲が違います。Anthropic・DashScopeはキャッシュの読み取りと書き込みの両方を記録し、Moonshot・DeepSeekは読み取りのみ、Upstageはどちらも記録しません。pi（EXP-029）ではMoonshotもキャッシュ書き込みを記録し、outputはpiのセッション記録で計測しました。", "<b>実行ツールが違えば、時間は参考値です。</b>GPTの4モデル（gpt-5.6-sol、gpt-6-astra、gpt-6-sol、gpt-6-luna）はOpenAIのCodex CLIで、残りはClaude Codeで実行しました。2つのツールは起動にかかる時間やツール呼び出しの方式が異なるため、時間差の一部はツールの違いによるかもしれません。同じツール同士（Claude Codeのモデル同士、またはGPTモデル同士）で比べたときだけ、ツールの違いが除かれます。piの3行（EXP-029）は、第3のツールであるpi coding agentを各プロバイダのOpenAI互換APIにつないで実行しました。同じモデルのClaude Code実行と比べると、ツールとAPI形式が同時に異なるため、差をどちらか一方のせいにはできません。", "<b>実験ごとにクライアントのバージョンが異なります。</b>各行に使用したエージェントCLIのバージョン（Claude Code・Codex CLI・pi）を示しており、実験詳細と原数値表のクライアント列でも確認できます。ここに示す実験でのバージョンはClaude Code 2.1.220から2.1.284まで、Codex CLI 0.144.0から0.160.0までにわたり、EXP-027の1実験はCodexの2つのバージョンで実行されました。起動時間・ツール呼び出しの処理・コンテキスト管理はバージョンによって変わる可能性があるため、実験間の時間差にはモデルの違いに加えてクライアントのバージョン差も含まれます。「未記録」は、実験文書にもセッション記録にもバージョンを確認できなかったという意味です。全体の表：<a href=\"https://github.com/roboco-io/coding-agent-benchmark/blob/main/analysis/client-versions.md\">analysis/client-versions.md ↗</a>", "<b>実験ごとに実行日が異なります</b>（2026-07-24 – 10-07）。その間にプロバイダのサーバー状態やClaude Codeのバージョンが変わった可能性があります。英語と韓国語の条件を別の日に実行したことも多く（最大12日差）、言語のせいで変わったとは断定しません。最近のモデル（gpt-6-astra、gpt-6-sol、gpt-6-luna、Fable 5.1、Opus 5.5、Sonnet 5.5）は他のモデルより3–10週間後に実行しており、世代間の速度比較にも日付の違いが混ざっています。", "<b>Solarの2モデルは正式サービスではなくプレビューAPIで計測しました。</b>申請制のベータサービスで、キャッシュに対応せず、リクエスト1回の往復に平均37秒かかり、予告なく終了することもありました。この2モデルの時間とトークン数を正式サービスの性能として読まないでください。", "<b>以前の実験の未完走2件（EXP-005/006）はモデルのせいではありませんでした。</b>原因分析の実験（EXP-007）で、実行環境に紛れ込んだ設定とトークン計測の誤りが主な原因と確認され、環境を隔離すると同じモデルが完走しました。「このモデルは完走できない」という結論は、環境の隔離と原因分析なしには下せません。"],

  deck:"如果把一个真实 Web 服务的后端交给编码代理从零开始构建，它能在没有人帮助的情况下完成吗？本基准给 <b>18 个模型</b>（Claude、GPT、Gemini、DeepSeek、Qwen、Kimi、Solar）同样的任务，并用 <b>Ralph 循环</b>运行：在新会话中反复执行同一条指令，直到代理宣布完成并通过官方测试，全程无人干预。",

  latRawNote:"模型等待、工具时间、模型调用数和每秒模型等待的 output 为英文 run 的范围，基于对计入 run 时间的 iteration 求和的会话日志（观测等待，不是模型速度；“—”= 未测量）。定义：analysis/latency/README.md。",
  howEyebrow:"阅读方法",
  howItems:["<b>如何看横条</b>——每一行是一个模型×代理组合。横条表示该模型各次 run 的最小值到最大值的范围，白色竖线为中位数。点击列标题即可按该列排序。", "<b>代理</b>——运行 Ralph 循环的编码代理框架（Claude Code、Codex CLI、pi、Antigravity CLI）。第二行为模型的连接方式：原生、OpenAI、Google，或直连所示提供商的 API。同一模型可能出现在多个代理中。", "<b>耗时</b>——一次 run 完成任务所用的代理会话时间。大多数条件的中位数集中在 3–19 分钟。两个 Solar 模型（58 分钟、119–258 分钟）同时反映了预览 API 响应慢和不支持缓存的影响，请勿用于比较模型性能。", "<b>run 间波动</b>——同一条件下最慢的 run 是最快的 run 的几倍。数值越大，越难预测下一次 run 的耗时。例如：kimi-k3 2.8 倍，pi × DeepSeek V4.1-Flash 2.1 倍，qwen3.8-max 1.1 倍。", "<b>提交纪律</b>——一次 run 中产生的 git 提交数（实心点 = 中位数）。它反映的是工作方式，而非结果质量。在同一提示词下，Opus 4.8 通常一次提交（中位数 1），Opus 5 则分成多次提交（中位数 6）。", "<b>output token</b>——模型生成的 token 数（含 thinking）。只有描边的横条（4 个 GPT 模型）按 Codex 的记录方式计量，不能与实心横条直接比较。pi 的 6 行按 pi 自身的会话记录计量（output 含 thinking）。", "<b>每 run 折算成本</b>——将 run 使用的 token 乘以公开 API 单价得到的估算值，并非实际计费金额（使用订阅和预览运行）。所用单价与假设见下方“解读注意”。", "<b>主要观察</b>——中位数最短的条件是 pi × Sonnet 5.5（英文 2.4 分钟，各 run 在 1.8–3.2 分钟之间，包括本仓库最短的完成会话 1 分 49 秒）、Claude Code 上的 Sonnet 5.5（英文 3.2 分钟、韩文 2.9 分钟，各 run 在 2.5–4.2 分钟之间）和 pi × DeepSeek V4.1-Flash（3.3 分钟，各 run 在 1.9–4.1 分钟之间）。Sonnet 5.5 的运行日期和 CLI 版本不同，pi 与 Claude Code 两个条件之间的代理、thinking 设置和缓存保留时间也同时不同，因此不视为仅由模型决定的排名。最便宜的是 gpt-6-luna（每 run 约 $0.03），其次是 pi × DeepSeek V4.1-Flash（约 $0.06）和 Claude Code 上的 DeepSeek V4.1-Flash（约 $0.09）。快不等于便宜：Fable 5.1 用时 6.9 分钟，算快的，但每 run 约 $3.5，约为 Opus 5.5（$1.25）的 3 倍。", "<b>KO 标准版切换</b>——把提示词换成韩文译本，并要求产出物（提交信息、README）也用韩文书写。参与测试的 10 个模型全部完成。比英文条件明显变慢的只有 qwen3.8-max（15.1 分钟 → 22.8 分钟）；两个条件的运行日期不同，因此不将其归因于语言。"],
  cardsEyebrow:"各模型特点 · 按耗时排序",
  cards:{
    sonnet55:{"exp": "Claude Code · EXP-031 · 英文与韩文 · Sonnet 5 的后继", "li": ["<b>Claude Code 上会话最短</b>——6 个 run 全部在 iteration 1 完成，用时 2.5–4.2 分钟（英文中位数 3.2 分钟，韩文 2.9 分钟）。每 run 的 API 调用为 16–24 次，少于其他原生 Claude 条件（Opus 5.5 为 22–41 次）。", "<b>每 run 约 $0.68</b>（0.60–0.82，韩文 0.70）——单价与 Sonnet 5 相同，但每 run 的 output 只有 15.2–20.9K、缓存读取 1.1–1.6M token，因此约为 Sonnet 5 的 1/5、Opus 5.5 的一半。", "只使用 shell 命令（Bash），从未使用 Read/Write/Edit、MCP、技能或子代理。它用 heredoc 写文件，走了一条短路径：克隆官方仓库 → 总结 Hurl 测试 → 一次性写出大部分代码 → 运行验证 → 宣布完成；6 个 run 都选择了 Fastify + Prisma + SQLite。"], "cav": "于 2026-09-29 使用 Claude Code 2.1.284 运行，比其他 Claude 模型晚几天，且用户的全局设置可见（与 EXP-023/026/028 相同）。从本实验起，框架会把空闲端口通过 PORT 传入；韩文 3 个 run 采用了它，英文 3 个 run 改了变量名而忽略它。日期、CLI 版本和端口注入都不同，因此“最短”是这些条件下的观测，而非仅由模型决定的排名。其缓存写入单价按标准倍率假设，未经核实。"},
    pisonnet55:{"exp": "pi coding agent → Anthropic API（API 密钥）直连 · EXP-032 · 英文", "li": ["<b>所有条件中中位数最短，英文 2.4 分钟</b>（1.8–3.2 分钟）。本仓库最短的完成会话（1 分 49 秒）也来自这一条件（此前最短为 EXP-029 pi × DeepSeek V4.1-Flash 的 1.9 分钟）。3 个 run 均在 iteration 1 完成，提交 1–3 次，API 调用 13–23 次。", "<b>每 run 约 $0.30</b>（0.25–0.32），output 10.9–14.7K，低于同一天 Claude Code 上的 Sonnet 5.5（英文约 $0.68，15.2–20.0K）。成本差距的一部分来自缓存保留时间：pi 写入 5 分钟缓存（每百万 token $2.50），Claude Code 写入 1 小时缓存（$4）。", "pi 0.87.1 的内置列表中没有 Sonnet 5.5，因此通过复制内置 claude-sonnet-5 定义的自定义模型条目调用。几乎只用 pi 的 bash 工具工作（run 1 中用过 1 次 write），3 个 run 都选择了 Fastify + Prisma，thinking 为 pi 默认值（medium）。"], "cav": "与同一天 Claude Code 上的 Sonnet 5.5（EXP-031）相比，代理、thinking 设置（pi medium 对 Claude Code 默认值）和缓存保留时间（5 分钟对 1 小时）同时不同，因此不把差距仅归因于 pi。n=3，仅英文条件。使用按量计费的 API 密钥运行，但未核实实际计费金额；缓存写入单价是按标准倍率假设、未经核实的值。"},
    piflash:{"exp": "pi coding agent → DeepSeek API（OpenAI 兼容）直连 · EXP-029 · 英文", "li": ["<b>英文中位数 3.3 分钟</b>，仅次于 pi × Sonnet 5.5（EXP-032）和 Claude Code 上的 Sonnet 5.5（EXP-031）。其最快的 run（1.9 分钟）在 EXP-032（1 分 49 秒）之前是本仓库最短的完成会话。最慢的 run 为 4.1 分钟（run 间波动 2.1 倍）。", "<b>每 run 约 $0.06</b>（0.04–0.07），仅次于 gpt-6-luna。", "3 个 run 均在 iteration 1 完成，提交 2–4 次。thinking 保持 pi 默认值（high）。run 1 为重跑结果：原 run（7.7 分钟）因 VS Code 占用端口 3000–3001 损失约 2.6 分钟（D-3）。"], "cav": "与在 Claude Code 上运行的 DeepSeek V4.1-Flash（EXP-025，4.6–6.0 分钟）是同一模型，但工具和 API 格式同时不同，运行时间也相隔三天，因此不把差异归因于 pi。成本按高峰时段单价计算，实际计费金额未测量。"},
    pikimi:{"exp": "pi coding agent → Moonshot API（OpenAI 兼容）直连 · EXP-029 · 英文", "li": ["<b>英文中位数 9.9 分钟</b>（9.5–9.9 分钟）。3 个 run 的时间差在 0.4 分钟以内，output 为 17.4–18.7K，是 pi 条件中最稳定的。", "<b>每 run 约 $0.65</b>。3 个 run 均在 iteration 1 完成，提交 3–4 次。", "代理自行发现 PATH 上的 <span class=\"mono\">hurl</span> 是一个 npm 包，并把自己的测试脚本改为使用真正的 Hurl 可执行文件。判定使用评分器固定的路径，因此不受影响。"], "cav": "与在 Claude Code 上运行的 kimi-k3（EXP-014/016，7.6–21.3 分钟）相比，工具和 API 格式同时不同，因此不把差异归因于 pi。在 pi 中 Moonshot 记录了缓存写入，按输入单价计算。"},
    piqwen:{"exp": "pi coding agent → DashScope API（OpenAI 兼容）直连 · EXP-029 · 英文", "li": ["<b>英文中位数 18.7 分钟</b>（15.6–29.0 分钟），是 pi 条件中最长的。原因未确认（未计量每个请求的延迟）。", "run 1 因另一个程序（VS Code Live Preview）占用了评分端口，iteration 1–4 被误判为失败，因此记录为 iteration 5 完成（29.0 分钟，提交 12 次）。其 iteration 1 的代码复评也通过；该 run 的时间、提交和 token 包含了这一干扰。", "<b>每 run 约 $0.75</b>（0.59–1.52，上端为受干扰的 run 1）。"], "cav": "thinking 为 pi 对该模型的默认值（medium），与另外两个条件（high）不同。qwen3.8-max 可能是仅限 API 的模型，而非开放权重（未确认）。成本按新加坡区域单价计算。"},
    piopus:{"exp": "pi coding agent → Anthropic API（API 密钥）直连 · EXP-030 · 英文", "li": ["<b>英文中位数 3.9 分钟</b>（3.1–4.9 分钟）。3 个 run 均在 iteration 1 完成，提交 2–4 次，与 Claude Code 上的 Opus 5.5（EXP-026，4.0–8.4 分钟）范围重叠。", "<b>每 run 约 $0.81</b>（0.74–0.87），output 16.6–19.8K，均低于 Claude Code 的 run（约 $1.25，18.6–28.2K）。成本差距部分来自缓存保留方式：pi 写入 5 分钟缓存（每 100 万 token $5），Claude Code 写入 1 小时缓存（$8）。", "只使用了 pi 的 bash 工具（每 run 17–27 次），文件也通过 shell heredoc 写入。thinking 使用 pi 默认值（medium effort）。"], "cav": "代理和 API 路径（系统提示、工具、thinking 传递方式、缓存保留）与 Claude Code 同时不同，运行日期也相差一天，因此不把差异归因于 pi。使用按量计费的 API 密钥运行，实际计费金额未测量。"},
    pisol:{"exp": "pi coding agent → ChatGPT（OAuth 登录）· EXP-030 · 英文", "li": ["<b>英文中位数 4.4 分钟</b>（4.2–5.6 分钟）。3 个 run 均在 iteration 1 完成，每次提交 2 次，与 Codex CLI 上的 gpt-6-sol（EXP-027，4.8–5.2 分钟）范围重叠。", "<b>每 run 约 $0.27</b>，output 7.0–8.6K，低于 Codex CLI 的 run（约 $0.43，10.4–11.0K）。", "与在 pi 中只用 bash 的 Opus 5.5 不同，它混用了 bash 与 pi 的 write、edit、read 工具。reasoning effort 为 pi 默认的 medium，与 Codex run 的名义设置相同。"], "cav": "使用 ChatGPT 套餐登录运行，未计费；成本为按 API 单价折算的估算值。与 Codex run 同一天，但代理和请求构成不同，因此不把差异归因于 pi。"},
    gemflash:{"exp": "Antigravity CLI → Gemini API（API 密钥）· EXP-035 · 英文 · 该框架的首次实验", "li": ["<b>英文中位数 17.5 分钟</b>（15.5–22.4 分钟）。run 1、2 在 iteration 1 完成；run 3 在 iteration 2 完成，原因是框架而不是模型失败（见下一条）。", "<b>run 3（D-1）</b>：代理自行运行了框架评分器（<span class=\"mono\">../measure.sh</span>），评分器的清理步骤终止了 agy 进程。代码已达 13/13，但尚未声明完成，因此由 iteration 2 声明完成。run 2 在完成后记录了一次 503 错误，不影响判定（D-4）。", "<b>每 run 模型响应步骤 119–192 次</b>，output 50.5–63.4K（含 thinking）。响应次数远多于其他 Flash 级模型，例如 pi × DeepSeek V4.1-Flash（EXP-029）为 25–40 次响应、1.9–4.1 分钟。这只是观察，原因尚未确认。", "<b>每 run 折算成本 $1.39–1.68</b>（中位数 $1.47），按 2026-10-07 核实的公开单价计算（每 1M token $0.75 / 缓存 $0.075 / $3.75，至 2026-12-31，自 2027-01-01 起翻倍）。使用按量计费的 Gemini API 密钥运行，确有实际计费，但未核对账单。"], "cav": "这是 Antigravity CLI 1.3.1 的首次实验。agy 产品内置技能和系统提示未关闭，token usage 的定义也与其他框架不同，因此与同日的 pi × gemini-3.8-flash（EXP-036）只能作为整体组合的差异来比较。n=3，仅英文。"},
    pigemflash:{"exp": "pi coding agent → Gemini API（API 密钥）直连 · EXP-036 · 英文", "li": ["<b>英文中位数 14.0 分钟</b>（13.1–15.6 分钟）。3 个 run 均在 iteration 1 完成，提交 4–7 次。", "<b>每 run 响应 102–119 次</b>，output 29.7–47.1K。在同一 pi 0.87.1 上，pi × DeepSeek V4.1-Flash（EXP-029）为 25–40 次响应、1.9–4.1 分钟。模型和日期同时不同，这只是观察，不归因。", "与同日同一模型的 Antigravity CLI（EXP-035，15.5–22.4 分钟，50.5–63.4K）相比，会话更短、output 更少；框架、系统提示和 usage 定义都不同。", "<b>每 run 折算成本 $0.80–1.14</b>（中位数 $1.11），按 2026-10-07 核实的公开单价计算（每 1M token $0.75 / 缓存 $0.075 / $3.75，至 2026-12-31，自 2027-01-01 起翻倍）。按量计费的 Gemini API 密钥，未核对账单。"], "cav": "run 3 探索了框架目录：读取并运行了评分器，读取了之前 run 的日志和 metrics，并复制了 Hurl 标准文件（D-2）。判定经绝对路径复验仍然有效，但该 run 的时间和 token 不能视为独立试验的值。run 1 的会话日志通过 env | grep 记录了密钥，存档已脱敏，框架已修复（D-3）。n=3，仅英文。"},
    pisol61:{"exp": "pi coding agent → ChatGPT（OAuth 登录）· EXP-034 · 英文", "li": ["<b>英文中位数 8.7 分钟</b>（8.3–9.2 分钟）。3 个 run 均在 iteration 1 完成，提交 3–5 次，响应 29–34 次。", "<b>约慢 2 倍的原因（会话记录分析）</b>：使用与 EXP-030 相同的 pi 0.87.1，工具执行时间（43–59 秒 对 36–37 秒）和模型调用次数（29–34 次 对 31–35 次）相近，但每次模型调用的等待约增加到 2 倍（14–15 秒 对 7–8 秒），每 run output 约为 1.6 倍。同一时间对比中 gpt-6.1-sol 也慢约 1.4 倍、生成速度低约 20%，因此差异来自模型或其服务路径，而不只是日期或客户端。<a href=\"https://github.com/roboco-io/coding-agent-benchmark/tree/main/analysis/gpt61-sol-slowdown\">分析文档</a>", "每 run output 为 12.5–13.3K。与 pi × gpt-6-sol（EXP-030，4.2–5.6 分钟，7.0–8.6K）以及同一天的 Codex CLI × gpt-6.1-sol（EXP-033，6.2–9.8 分钟）对照，两个框架都比之前的 gpt-6-sol 测量更长。这与模型侧变化相符，但并未证实。", "<b>每 run 折算成本 $0.30–0.35</b>（中位数 $0.30），按 2026-10-03 核实的公开 API 单价计算（每 1M token $2 / 缓存 $0.10 / $10）。使用 ChatGPT 登录运行，未计费。"], "cav": "pi 0.87.1 内置列表中没有该模型，因此通过复制内置 gpt-6-sol 定义的自定义条目调用，上下文窗口等设置可能与真实模型不同。日期和条目与 EXP-030 不同，因此不是仅由模型决定的排名。n=3，仅英文。"},
    opus55:{"exp": "Claude Code · EXP-026 · 英文与韩文 · 2026-09 发布", "li": ["<b>Claude Code 上仅次于 Sonnet 5.5（EXP-031）的模型</b>——6 个 run 中有 5 个在 4.0–4.2 分钟内完成（英文中位数 4.2 分钟，韩文 4.0 分钟）。剩下的 1 个 run（8.4 分钟）是因为代理在排查自己写的测试脚本中的端口冲突。", "<b>每 run 约 $1.25</b>——生成 token 约 20K，在 Claude 模型中仅多于 Sonnet 5.5；缓存读取单价仅为输入单价的 1/20，因此约为 Opus 5 的 1/5。", "韩文条件下速度相同，提交信息和 README 全部用韩文书写。它只通过 shell 命令（Bash）工作，已连接的外部工具（MCP）一次也没用。"], "cav": "比其他 Claude 模型晚几周、用新版 Claude Code（2.1.280）运行。该排名是在这些条件下的观测，并非确定的优势。"},
    dsflash:{"exp": "Claude Code → DeepSeek API 直连 · EXP-025 · 英文与韩文 · 2026-09-10 发布", "li": ["<b>在 Claude Code 上运行的模型中最便宜</b>——每 run 约 $0.09（韩文 $0.12），约为 V4-Pro（$0.52）的 1/6。比它更低的只有用 Codex CLI 运行的 gpt-6-luna（约 $0.03）。原因是其缓存读取单价极低（每百万 token $0.006）。", "<b>Claude Code 上第三快的模型</b>——英文中位数 4.8 分钟（4.6–6.0 分钟）。韩文为 4.2–8.4 分钟，各 run 差异更大。", "均衡地使用文件读取、写入、编辑工具（Read/Write/Edit），而其他直连模型大多依赖 shell 命令（Bash）。韩文条件下提交和 README 也全部用韩文书写。"], "cav": "通过按量计费的 API 运行。成本按高峰时段单价计算，其他时段为一半。"},
    sol:{"exp": "Codex CLI · EXP-011/016（英文） · EXP-019（韩文）", "li": ["<b>英文中位数 5.8 分钟</b>（5.3–10.0 分钟），每 run 约 $1.05。在 Codex CLI 模型中比 gpt-6-sol（4.9 分钟）慢，比 gpt-6-astra（7.1 分钟）快。", "3 个 run 中有 1 个在第二次迭代完成。除两个 Solar 模型外，这是唯一没有在第一次迭代完成的情况。", "虽然是以英文为主的模型，但在韩文条件下提交和 README 全部用韩文书写。"], "cav": "运行工具（Codex CLI）与 Claude Code 不同，时间仅供参考。output 按 Codex 的记录方式计量，不能与其他模型直接比较。成本按 11 月 21 日前的促销单价计算。"},
    fable:{"exp": "Claude Code · EXP-023 · 英文 · Claude 5 世代最高端模型", "li": ["<b>英文中位数 6.9 分钟</b>（6.2–7.8 分钟），比 Opus 4.8 快；但单价是 Opus 的两倍，<b>每 run 约 $3.5</b>，约为 Opus 5.5 的 3 倍。", "生成 token（28.7–35.8K）与 Opus 4.8 相近，少于 Opus 5（41–48K）。也就是说，Opus 5 生成量大是它自己的特点，而不是 Claude 5 世代的共同特点。", "3 个 run 中只用了 71 次 shell 命令（Bash）和 2 次文件写入，没有用文件读取和编辑工具。"], "cav": "运行时暴露了用户的全局设置（外部工具 MCP、回复语言）。与 Opus 4.8、Opus 5 的实验条件相同，但晚了 7 周。"},
    sol6:{"exp": "Codex CLI · EXP-027 · 英文 · GPT-6 世代", "li": ["<b>英文中位数 4.9 分钟</b>（4.8–5.2 分钟），每 run 约 $0.43。3 个 run 都约 5 分钟、提交 3 次、output 约 11K，run 之间差异很小。", "在这个任务上比 gpt-5.6-sol（中位数 5.8 分钟）和 gpt-6-astra（7.1 分钟）用时更短。但 astra 早两周运行，且使用旧版 Codex CLI（0.153.4，本次为 0.155.1），因此不把这一差异断定为模型差异。", "所有响应都来自 gpt-6-sol（无备用模型）。评分后服务器进程残留的评分基础设施问题 1 起（偏离 D-1）在不干预代理的情况下处理，不影响判定。"], "cav": "于 2026-09-24 使用 Codex CLI 0.155.1、reasoning effort medium、ChatGPT 套餐登录运行，未产生计费。成本按 2026-09-24 核实的标准短上下文单价折算。最初请求的 gpt-6-earth 是不存在的模型 ID。"},
    sol61:{"exp": "Codex CLI · EXP-033 · 英文 · GPT-6 世代，gpt-6-sol 的后继", "li": ["<b>英文中位数 8.7 分钟</b>（6.2–9.8 分钟）。3 个 run 均在 iteration 1 完成，每次提交 4 次；未观察到循环的恢复贡献。", "<b>约慢 2 倍的原因（会话记录分析）</b>：工具执行时间（27–39 秒 对 40–55 秒）和模型调用次数（21–31 次 对 26–35 次）相近，但每次模型调用的等待时间约增加到 2 倍（16–23 秒 对 7–10 秒），每秒模型等待的 output 从 42–45 降到 29–30 token。在同一时间交替发送相同请求各 3 次的对比（2026-10-03）中，gpt-6.1-sol 仍慢约 1.4 倍，output 多 10–17%，生成速度低约 20%。客户端版本相同的 pi 也出现同样差距，因此客户端版本不是主因。<a href=\"https://github.com/roboco-io/coding-agent-benchmark/tree/main/analysis/gpt61-sol-slowdown\">分析文档</a>", "每 run output 为 10.0–16.2K，缓存命中率 92–94%。与同一框架上的 gpt-6-sol（EXP-027，4.8–5.2 分钟，10.4–11.0K）相比，会话更长、output 离散更大，但这只是观察，不是排名。", "<b>每 run 折算成本 $0.27–0.46</b>（中位数 $0.36），按 2026-10-03 核实的公开 API 单价计算（每 1M token 输入 $2、缓存输入 $0.10、输出 $10，Standard ≤272K）。缓存输入单价是 gpt-6-sol（$0.20）的一半，而输入的 92–94% 为缓存读取，因此影响较大。使用 ChatGPT 套餐登录运行，未计费。"], "cav": "Codex CLI 0.160.0 本地没有该模型条目，按 fallback 元数据运行；CLI 版本和日期也与 EXP-027（0.155.1/0.156.1，2026-09-24）不同。会话记录分析指向模型调用变慢而非客户端，但 run 级差距中有多少来自测量日期尚未分离。n=3，仅英文。"},
    luna6:{"exp": "Codex CLI · EXP-027 · 英文 · GPT-6 世代", "li": ["<b>英文中位数 6.6 分钟</b>（5.4–10.0 分钟）。<b>每 run 约 $0.03，是所有模型中估算成本最低的。</b>原因是其公开单价为 gpt-6-sol 的 1/20。", "Codex 将其描述为 “fast and affordable”，但在这个任务上，3 个 run 都比 gpt-6-sol 的任何一个 run 用时更长。run 1 最长（10.0 分钟、提交 8 次、output 21.5K、input 累计 4.0M），run 2、3 与 sol 接近。", "output（13.4–21.5K）和提交次数（4–8 次）的波动比 sol 大。"], "cav": "与 gpt-6-sol 在同一天、同一条件下交替运行。n=3，“比 sol 慢”只是观测结果，不是确定的排名。成本按标准短上下文单价折算，未产生计费。"},
    sonnet5:{"exp": "Claude Code · EXP-028 · 英文与韩文 · Claude 5 世代", "li": ["<b>英文中位数 14.2 分钟</b>（13.0–15.3 分钟），韩文 14.2 分钟（11.2–16.8 分钟）。6 个 run 全部完成，其中 5 个在 iteration 1 完成。", "在 en-1 中，代理在搭建脚手架后和准备测试后各自行停止一次，并在 iteration 3 实现了 API。Ralph 循环接续了这些拆分的工作直至完成，没有被 rejected 的完成声明。", "<b>每 run 约 $3.1</b>（$2.67–4.21）——虽然输入·输出单价只有 Opus 5.5 的一半，却比 Opus 5.5（约 $1.25）更贵。原因是 output 约为 3 倍（57.6–73.7K），且每个 run 的缓存读取为 7–14M token。"], "cav": "比 Opus 5.5 晚一天，在 Claude Code 2.1.281 上、在用户全局设置可见的状态下运行（与 EXP-023/026 条件相同）。全局“用韩文回复”规则使英文 run 的最终总结大多为韩文。比 Opus 5.5·Fable 5.1 慢是 n=3 的观测，并非确定的排名。"},
    astra:{"exp": "Codex CLI · EXP-021 · 英文 · GPT-6 世代首个模型", "li": ["<b>英文中位数 7.1 分钟</b>，每 run 约 $2.0。3 个 run 的时间只差 0.5 分钟，是最稳定的模型之一。", "比前代 gpt-5.6-sol 多用 23–32% 的时间。OpenAI 宣称的“快 1.9 倍”在这个任务上没有体现。", "OpenAI 不提供 Anthropic 兼容 API，只能通过 Codex CLI 运行。与 sol 实验相比只改了模型名称。"], "cav": "发布 6 天后运行。使用 ChatGPT 套餐登录运行，没有实际计费；成本按短上下文单价折算。"},
    kimi:{"exp": "Claude Code → Moonshot API 直连 · EXP-014/016（英文） · EXP-017（韩文）", "li": ["<b>英文中位数 7.9 分钟</b>，每 run 约 $0.78。但各 run 在 7.6 到 21.3 分钟之间变化（2.8 倍），是<b>Claude Code 上耗时最难预测的模型</b>。提交数也在 1–4 之间不一。", "生成 token 属于最少的一类（14.4K），却通过了同样的测试。生成得少并不代表结果差。"], "cav": "thinking（推理）功能无法关闭，因此在开启状态下运行。Moonshot 将缓存写入 token 记为 0。"},
    opus48:{"exp": "Claude Code · EXP-010（英文） · EXP-019（韩文）", "li": ["<b>最稳定的模型</b>——6 个 run 都在 7.1–8.7 分钟，英文和韩文的中位数都是 8.3 分钟。每 run 约 $3.2。", "通常先完成全部实现再<b>只提交一次</b>（中位数 1）。韩文的 3 个 run 都只有 1 次提交。"], "cav": ""},
    opus5:{"exp": "Claude Code · EXP-009/010（英文，6 个 run） · EXP-019（韩文）", "li": ["<b>生成 token 仅次于 Sonnet 5 的 Claude 模型</b>（中位数 47.0K），<b>每 run 约 $5.8，是最贵的 Claude 模型。</b>英文中位数 11.9 分钟。", "<b>把工作拆成多次提交</b>（中位数 6），与收到同一提示词的 Opus 4.8（中位数 1）做法相反。"], "cav": ""},
    dspro:{"exp": "Claude Code → DeepSeek API 直连 · EXP-025 · 英文与韩文", "li": ["<b>英文中位数 13.3 分钟</b>，比 Flash 慢 2.5–3 倍，但<b>每 run 约 $0.52</b>，仍是第二便宜的。", "韩文 3 个 run 的时间只差 0.4 分钟，提交数也都是 4 次，是<b>韩文条件下最稳定的模型</b>。", "文档提示 V4-Pro 的请求可能被转给 Flash，但 6 个 run 的所有响应实际上都来自 V4-Pro。"], "cav": "比 Flash 更早的版本（08-13，Flash 为 09-10），即使同一家公司也属于不同世代。成本按高峰时段单价计算。"},
    qwen:{"exp": "Claude Code → DashScope API 直连 · EXP-013/016（英文） · EXP-017（韩文）", "li": ["<b>英文中位数 15.1 分钟</b>，每 run 约 $1.1。3 个 run 只差 1.0 分钟，是<b>耗时最容易预测的模型</b>。", "在韩文条件下<b>明显变慢（22.8 分钟）的唯一模型</b>。两个条件的运行日期不同，因此不将原因归于语言。", "只改了 API 地址、密钥和模型名称这三项就完成连接，无需排查任何问题。这一结果让“直连提供商 API”成为本基准的默认方式。"], "cav": "成本按新加坡区域单价计算。"},
    open2:{"exp": "Claude Code → Upstage API 直连 · EXP-015 · 英文，1 个 run", "li": ["<b>58 分 15 秒</b>，约为快速模型的 10 倍，在第二次迭代完成。生成 token 为 252.3K，thinking 占比较大。", "评分器曾把一次正常完成判为失败（评分器找不到服务器端口的错误）。修好评分器后重新评分两次，确认通过。"], "cav": "试用服务结束，API 于 2026-08-05 关闭，无法再运行，这 1 个 run 就是最终记录。没有公开单价，因此未计算成本。后继模型是 Solar Pro 4。"},
    pro4:{"exp": "Claude Code → Upstage API 直连 · EXP-020 · 英文", "li": ["<b>耗时最长的模型</b>（119–258 分钟）。分析会话日志发现是三个因素叠加：不支持缓存、每次请求平均往返 37 秒、生成 token 中 88% 是 thinking。", "3 个 run 全部完成。慢的原因是预览服务的响应速度和缺少缓存，并不是模型解不出任务。", "run 1 中，一个无关的 npm 包遮蔽了评分程序，导致 9 次正常完成声明被判为失败。之后重新评分，确定了实际完成的时间点。"], "cav": "成本 $8.0 按标价折算。由于没有记录缓存，全部输入都按未缓存单价计算，因此偏高；运行时正处于免费或折扣期。"}

  rawNotes:{ r37:"run 3 读取了框架文件和之前 run 的记录（D-2）· 按 2026-10-07 公开单价折算", r36:"新框架（Antigravity CLI）· run 3 的 iter 2 由代理运行的框架评分器导致（D-1）· 按 2026-10-07 公开单价折算", r35:"复制 gpt-6-sol 的 pi 自定义模型条目 · 按 2026-10-03 公开单价折算", r34:"Codex 0.160.0 按 fallback 模型元数据运行 · 按 2026-10-03 公开单价折算", r33:"所有条件中中位数最短（2.4 分钟）· 本仓库最短完成会话（1 分 49 秒）· 复制 claude-sonnet-5 的 pi 自定义模型条目 · 5 分钟缓存写入", r31:"Claude Code 条件中最短（中位数 3.2 分钟）· 仅用 Bash · 框架注入 PORT（EN run 忽略）", r32:"KO 条件中最短（2.5–3.3 分钟）· 使用注入的 PORT", r29:"Anthropic API 上的 pi · 仅用 bash · 5 分钟缓存写入", r30:"ChatGPT 登录上的 pi · output 低于 Codex CLI 范围（7.0–8.6K 对 10.4–11.0K）", r26:"EXP-032 之前本仓库最短完成会话（1.9 分钟）· run 1 因端口冲突（D-3）重跑", r27:"pi 条件中最稳定（9.5–9.9 分钟）", r28:"run 1 因评分端口被外部占用（D-1）在 iter 5 完成 · 其 iter 1 代码复评也通过", r1:"同时点交叉 A/B", r2:"全部韩文 · 与 EN 分布重叠", r3:"确立 EN 标准提示词", r4:"输出量扩大特征", r6:"Claude 5 高阶模型 · output 为 4.8 水平", r16:"直连最快 · 成本最低 · Read/Write/Edit 轨迹", r17:"全部韩文", r20:"Claude Code 中位数 4.2 分钟 · 仅次于 Sonnet 5.5（EXP-031，不同日期）· 原生低 output", r21:"全部韩文 · KO 分布集中（3.95–4.22 分钟）", r18:"确认模型保持（全部响应 v4-pro）· 比 Flash 慢 2.5–3 倍", r19:"全部韩文 · 波动最小（0.4 分钟）", r22:"GPT 中波动最小（4.8–5.2 分钟）· 每个 run 提交 3 次 · 评分基础设施偏离 1 起，不影响判定", r23:"估算成本最低 · 每个 run 都比 sol 长 · run 1 最长（10.0 分钟、提交 8 次）", r24:"en-1 由代理自行拆成 3 个 iteration 完成（无 rejected）· Claude 模型中 output 最多", r25:"全部 iter 1 · 最长 run 16.8 分钟", r7:"仅 sol-2 为 iter 2", r8:"英语系模型也全部韩文", r9:"GPT-6 首次验证 · 误判 0 起 · 比 sol +23–32%", r10:"故障排查 0 · 波动最小", r11:"全部韩文 · 与 EN 分布不重叠", r12:"Claude Code 条件中 run 间波动最大（2.8 倍）", r13:"全部韩文（feat: 前缀 1 处）", r14:"门控误判 1 起 · measure v4 修复", r15:"全部条件中最长 · pro4-1 因误判延长循环，追溯确认" },
  notesTitle:"调查笔记", notesSmall:"不使用转换代理的原因 · 评分器错误 3 起 · 更正记录",
  notes:[["① 为什么不通过转换代理（ccr）连接模型", "Claude Code 以 Anthropic API 格式发送请求。要连接只接受 OpenAI 格式的模型，需要一个在中间转换格式的代理（ccr，claude-code-router），而早期实验中这个代理造成了多种问题：工具调用参数被破坏（EXP-006：分段传来的响应只处理了第一段，<span class=\"mono\">python3</span> 变成了 <span class=\"mono\">3</span>），token 用量没有被记录（EXP-012），每个模型都要单独写转换代码，还出现过响应停滞或因未设置上下文上限而中断。相反，直接连接提供商官方的 Anthropic 兼容 API（Upstage、DashScope、Moonshot、DeepSeek）从未出现这些问题。因此经过代理的结果被排除在比较之外。排除的理由是错误和计量失真，而不是速度（代理是否更慢无法与模型差异区分开，未得到确认）。没有 Anthropic 兼容 API 的 OpenAI 模型，使用 OpenAI 官方的 Codex CLI 运行。EXP-029 新增的第三种工具 pi coding agent 原生使用 OpenAI 格式，因此无需转换代理即可连接提供商的 OpenAI 兼容 API。EXP-005/006/012 的原始数据和报告仍保留在仓库中。"], ["② 评分器把正常完成判为失败的 3 起案例", "代理宣布完成后，评分脚本会启动服务器并运行官方测试。这个脚本曾三次把实际已完成的结果判为失败。EXP-010 run 48-1：评分用的测试文件没有复制过去。EXP-015 iteration 2：用 <span class=\"mono\">npx tsx</span> 启动的服务器在命令行中没有仓库路径，评分器找不到服务器端口（已改为通过进程的工作目录查找，measure v4）。EXP-020 pro4-1：实验前 11 天安装的一个无关 npm 包（<span class=\"mono\">@hurl/cli</span>）在 PATH 中遮蔽了真正的测试工具 Hurl 8.0.1，导致 9 次正常完成声明连续被判为失败。<b>教训：只有在查看评分日志后才能确定失败，评分所用程序的路径也要固定。</b>从 EXP-021 开始一开始就固定了绝对路径，此后再没有发生这种错误。"], ["③ 更正与排除记录（2026-08-04）", "早期整理时把 EXP-006 open2-2 和 EXP-008 误记为经过代理（ccr）的运行，核实后发现两者都是直连 Upstage API。已同时修正仪表板和仓库文档，并撤回“直连比代理更快”的说法。EXP-008 使用的是当前标准提示词确定之前的提示词（iteration 10，约 173 分钟），因此用在标准条件下重新运行同一模型、同一连接方式的 EXP-015 取代，并排除在比较之外。"], ["", "<b>三项调查的共同教训：</b>基准结果的可信度更多取决于实验环境的管理，而不是模型。要去掉格式转换代理，把运行环境与其他设置隔离，并用日志核实评分器的失败判定。"]],
  cavTitle:"解读注意", cavSmall:"这些数字说明不了什么",

co-io/coding-agent-benchmark/blob/main/analysis/client-versions.md\">analysis/client-versions.md ↗</a>", "<b>各实验的运行日期不同</b>（2026-07-24 – 10-07）。其间提供商的服务器状态和 Claude Code 版本可能有变化。英文和韩文条件也常在不同日期运行（最多相差 12 天），因此不断定差异来自语言。最新的模型（gpt-6-astra、gpt-6-sol、gpt-6-luna、Fable 5.1、Opus 5.5、Sonnet 5.5）比其他模型晚 3–10 周运行，跨世代的速度比较中也混入了日期差异。", "<b>两个 Solar 模型是在预览 API 而非正式服务上测得的。</b>这是需要申请的测试服务，不支持缓存，每次请求平均往返 37 秒，还可能无预告关闭。请不要把这两个模型的时间和 token 数当作正式服务的性能。", "<b>早期实验中 2 起未完成（EXP-005/006）并不是模型的问题。</b>原因分析实验（EXP-007）确认，主要原因是运行环境中混入的设置和 token 计量错误；隔离环境后，同一模型完成了任务。没有隔离环境和分析原因，就不能得出“这个模型无法完成”的结论。"],

/* ───────────────────────── i18n plumbing ───────────────────────── */
const LANGS = ["en","ko","ja","zh"];
let lang = "en";
const t = k => (T[lang] && T[lang][k] != null) ? T[lang][k] : T.en[k];

function detectLang() {
  try {
    const q = new URLSearchParams(location.search).get("lang");
    if (q && LANGS.includes(q)) return q;
  } catch (e) {}
  try {
    const s = localStorage.getItem("dash-lang");
    if (s && LANGS.includes(s)) return s;
  } catch (e) {}
  try {
    const navs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""];
    for (const n of navs) {
      const p = String(n).toLowerCase().split("-")[0];
      if (p === "ko" || p === "ja" || p === "zh") return p;
      if (p === "en") return "en";
    }
  } catch (e) {}
  return "en";
}

function setLang(l, persist) {
  lang = LANGS.includes(l) ? l : "en";
  document.documentElement.setAttribute("lang", t("htmlLang"));
  document.title = t("title");
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  if (persist) { try { localStorage.setItem("dash-lang", lang); } catch (e) {} }
  applyStatic();
  scales();
  render();
  renderCards();
  renderRaw();
  renderNotes();
}

function applyStatic() {
  document.querySelectorAll("[data-i18n]").forEach(el => { el.innerHTML = t(el.dataset.i18n); });
  document.getElementById("langhint").textContent = plang === "en" ? t("hintEn") : t("hintKo");
}

/* ───────────────────────── matrix accordion (data: details.js) ───────────────────────── */
const openRows = new Set();
const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const md = v => esc(v).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
const REPO = "https://github.com/roboco-io/coding-agent-benchmark/blob/main/";
const DT = () => window.DETAILS || {};
function expsFor(m) { return (DT()[m.name] || []).filter(e => e.runs.some(r => r.lang === plang)); }
const nf = v => v == null ? "—" : Number(v).toLocaleString("en-US");
const kf = v => v == null ? "—" : v >= 1e6 ? (v / 1e6).toFixed(2) + "M" : v >= 1e3 ? (v / 1e3).toFixed(1) + "K" : String(v);

function sec(title, body, open) {
  return `<details${open ? " open" : ""}><summary>${title}</summary><div class="xc">${body}</div></details>`;
}
function listOr(items) {
  return items && items.length ? `<ul>${items.map(x => `<li>${md(x)}</li>`).join("")}</ul>` : `<p>${t("noRecord")}</p>`;
}
function expBlock(e) {
  const tx = e.text[lang] || e.text.en, runs = e.runs.filter(r => r.lang === plang);
  const head = `<div class="xb-h"><b>${esc(e.exp)}</b><span class="vd">${esc(tx.verdict)}</span>`
    + `<span class="nmx">${md(tx.name)}</span>`
    + (e.client ? `<span class="cl">${t("lbClient")}: ${esc(e.client[lang] || e.client.en)}</span>` : "")
    + `${e.date ? `<span class="dtd">${esc(e.date)}</span>` : ""}`
    + `<a href="${REPO}${esc(e.report)}" target="_blank" rel="noopener">${t("report")}</a></div>`;
  const s1 = `<p>${md(tx.summary)}</p><p><span class="lbl">${t("lbHypo")} ${esc(e.hcode)}</span>${md(tx.hypothesis)}</p>`;
  const s2 = `<div class="xt"><table><thead><tr><th>${t("xRun")}</th><th>${t("xIter")}</th><th>${t("xTime")}</th><th>${t("xCommits")}</th><th>${t("xOut")}</th><th>${t("xCost")}</th></tr></thead><tbody>`
    + runs.map(r => `<tr><td>${esc(r.run)}</td><td>${r.iter == null ? "—" : esc(r.iter)}</td><td>${r.time == null ? "—" : f1(r.time)}</td>`
      + `<td>${r.commits == null ? "—" : esc(r.commits)}</td><td>${kf(r.output)}</td><td>${r.usd == null ? "—" : "$" + r.usd.toFixed(2)}</td></tr>`).join("")
    + `</tbody></table></div><p class="xnote">${t("xRunsNote")}</p>`;
  const s3 = `<div class="xt"><table><thead><tr><th>${t("xRun")}</th><th>${t("xIn")}</th><th>${t("xCR")}</th><th>${t("xCW")}</th><th>${t("xOut")}</th><th>${t("xReq")}</th></tr></thead><tbody>`
    + runs.map(r => `<tr><td>${esc(r.run)}</td><td>${kf(r.input)}</td><td>${kf(r.cacheRead)}</td><td>${kf(r.cacheWrite)}</td><td>${nf(r.output)}</td><td>${nf(r.requests)}</td></tr>`).join("")
    + `</tbody></table></div><p class="xnote">${t("xTokNote")}</p>`;
  const cond = (e.conditions[lang] || e.conditions.en || []);
  const s4 = cond.length ? `<dl class="kv">${cond.map(([k, v]) => `<dt>${md(k)}</dt><dd>${md(v)}</dd>`).join("")}</dl>` : `<p>${t("noRecord")}</p>`;
  return `<div class="xb">${head}`
    + sec(t("secVerdict"), s1, true) + sec(t("secRuns"), s2, true) + sec(t("secTokens"), s3, false)
    + sec(t("secCond"), s4, false) + sec(t("secDev"), listOr(e.deviations[lang] || e.deviations.en), false)
    + sec(t("secBeh"), listOr(e.behavior[lang] || e.behavior.en), false) + `</div>`;
}
function detailRow(m) {
  return `<tr class="dt"><td colspan="9"><div class="dtwrap">${expsFor(m).map(expBlock).join("")}</div></td></tr>`;
}
function fitDetails() {

/* ───────────────────────── matrix ───────────────────────── */
const W_MIN = 2, W_MAX = 60, U_MIN = 0.03, U_MAX = 20, T_MIN = 1.5, T_MAX = 260, O_MIN = 10, O_MAX = 260, S_MAX = 4, C_MAX = 8;
const lg = (v, lo, hi) => Math.max(0, Math.min(100, (Math.log10(v) - Math.log10(lo)) / (Math.log10(hi) - Math.log10(lo)) * 100));
const med = a => { const s = [...a].sort((x, y) => x - y), h = s.length >> 1; return s.length % 2 ? s[h] : (s[h - 1] + s[h]) / 2; };
const lo = a => Math.min(...a), hi = a => Math.max(...a);
const f1 = v => (Math.round(v * 10) / 10).toFixed(1);
const usd = v => v < 1 ? v.toFixed(2) : v < 10 ? v.toFixed(1) : Math.round(v).toString();

let plang = "en", sortKey = "time", sortDir = 1;

const AGENT = { native:"Claude Code", direct:"Claude Code", codex:"Codex CLI", pi:"pi", agy:"Antigravity CLI" };
function agentName(m) { return AGENT[m.stack]; }
function connLabel(m) {
  if (m.stack === "native") return t("connNative");
  if (m.stack === "codex") return "OpenAI";
  if (m.stack === "agy") return "Google · " + m.provider;
  return t("stDirect") + " · " + m.provider;
}

function stats(d) {
  if (!d) return null;
  return { tMed: med(d.t), tLo: lo(d.t), tHi: hi(d.t), n: d.t.length,
           spread: lo(d.t) > 0 ? hi(d.t) / lo(d.t) : 1,
           cMed: med(d.c), cLo: lo(d.c), cHi: hi(d.c),
           oMed: med(d.o), oLo: lo(d.o), oHi: hi(d.o), done: d.done, iter: t(d.iter), exp: d.exp,
           usd: (d.usd || []).filter(v => v != null) };
}

function rangeBar(loV, hiV, medV, n, scaleLo, scaleHi, color, outlined) {
  if (n === 1) {
    return `<div class="bar"><div class="pt" style="left:${lg(medV, scaleLo, scaleHi)}%;background:${color}"></div></div>`;
  }
  const a = lg(loV, scaleLo, scaleHi), b = lg(hiV, scaleLo, scaleHi);
  const fill = outlined ? `color:${color}` : `background:${color}`;
  return `<div class="bar"><div class="rng${outlined ? " out" : ""}" style="left:${a}%;width:${Math.max(b - a, 0.8)}%;${fill}"></div>`
       + `<div class="med" style="left:calc(${lg(medV, scaleLo, scaleHi)}% - 1px)"></div></div>`;
}

function linBar(v, max, color) {
  return `<div class="bar"><div class="rng" style="left:0;width:${Math.max(v / max * 100, 1)}%;background:${color}"></div></div>`;
}

function dots(medV, color) {
  let h = `<div class="dots" style="color:${color}">`;
  for (let i = 1; i <= C_MAX; i++) h += `<i class="${i <= medV ? "on" : ""}"></i>`;
  return h + "</div>";
}

function latOf(m) {
  const a = (plang === "en" && LAT[m.name]) || null;
  if (!a) return null;
  const w = a.map(r => r[4]), sh = a.map(r => r[6]);
  return { wLo: lo(w), wHi: hi(w), wMed: med(w), shLo: lo(sh), shHi: hi(sh), shMed: med(sh), n: a.length };
}

function render() {
  const rows = M.map(m => ({ m, s: stats(m[plang]), l: latOf(m) }));
  const present = rows.filter(r => r.s), absent = rows.filter(r => !r.s);
  const key = {
    name: r => (r.m.base || r.m.name).toLowerCase() + "\u0000" + agentName(r.m).toLowerCase(),
    agent: r => agentName(r.m).toLowerCase() + "\u0000" + (r.m.base || r.m.name).toLowerCase(),
    time: r => r.s.tMed, spread: r => r.s.spread, commits: r => r.s.cMed, output: r => r.s.oMed,
    cost: r => r.s.usd.length ? med(r.s.usd) : Infinity,
    wait: r => r.l ? r.l.wMed : Infinity, share: r => r.l ? r.l.shMed : Infinity
  }[sortKey];
  present.sort((a, b) => { const x = key(a), y = key(b); return (x > y ? 1 : x < y ? -1 : 0) * sortDir; });
  const min = t("min");

  const body = [...present, ...absent].map(({ m, s, l }) => {
    const color = `var(--${m.stack})`;
    const hasDt = !!(s && expsFor(m).length), isOpen = hasDt && openRows.has(m.name);
    const nmTag = hasDt ? `<button type="button" class="xp nm" aria-expanded="${isOpen}" title="${t("dtOpen")}"><span class="chev" aria-hidden="true"></span>` : `<span class="nm">`;
    const nameCell = `<td><div class="mdl">${nmTag}<span class="swatch" style="background:${color}"></span>${m.base || m.name}`
      + (m.preview ? ` <span class="pv">PREVIEW</span>` : "") + (hasDt ? `</button>` : `</span>`)
      + `<span class="st">${s ? s.exp : ""}${s && m[plang].iter !== "iterAll1" ? " · " + s.iter : ""}</span></div></td>`
      + `<td><div class="agt"><span class="an">${agentName(m)}</span><span class="ac">${connLabel(m)}</span>`
      + (s ? `<span class="av" title="${esc(t("clientTitle"))}">${esc(clientText(s.exp, m.stack, t))}</span>` : "") + `</div></td>`;
    if (!s) return `<tr class="dim">${nameCell}<td colspan="7"><span class="na">${t("koMissing")}${t(m.koNote || "notePreview")}</span></td></tr>`;

    const spreadTxt = s.n === 1 ? `<span class="na">${t("n1na")}</span>`
      : `<span class="figs"><em>${f1(s.spread)}×</em> <small>${t("span").replace("{x}", f1(s.tHi - s.tLo))}</small></span>`;
    const spreadBar = s.n === 1 ? `<div class="bar"></div>` : linBar(Math.min(s.spread, S_MAX) - 1, S_MAX - 1, color);

    return `<tr${hasDt ? ` class="row${isOpen ? " open" : ""}" data-key="${esc(m.name)}"` : ""}>${nameCell}`
      + `<td><div class="cell">${rangeBar(s.tLo, s.tHi, s.tMed, s.n, T_MIN, T_MAX, color, false)}`
      + `<span class="figs"><em>${f1(s.tMed)}${min}</em>${s.n > 1 ? ` <small>${f1(s.tLo)}–${f1(s.tHi)}</small>` : ` <small>${t("n1")}</small>`}</span></div></td>`
      + `<td><div class="cell">${spreadBar}${spreadTxt}</div></td>`
      + `<td><div class="cell cm">${dots(s.cMed, color)}`
      + `<span class="figs"><em>${s.cMed}</em> <small>${s.n === 1 ? t("singleRun") : s.cLo === s.cHi ? t("sameAll") : s.cLo + "–" + s.cHi}</small></span></div></td>`
      + `<td><div class="cell">${rangeBar(s.oLo, s.oHi, s.oMed, s.n, O_MIN, O_MAX, color, m.meas === "rollout")}`
      + `<span class="figs"><em>${f1(s.oMed)}K</em> <small>${m.meas}</small></span></div></td>`
      + (s.usd.length
          ? `<td><div class="cell">${rangeBar(lo(s.usd), hi(s.usd), med(s.usd), s.usd.length, U_MIN, U_MAX, color, false)}`
            + `<span class="figs"><em>$${usd(med(s.usd))}</em>${s.usd.length > 1 ? ` <small>${usd(lo(s.usd))}–${usd(hi(s.usd))}</small>` : ""}</span></div></td>`
          : `<td><span class="na">${t(m.costNa || "costNa")}</span></td>`)
      + (l
          ? `<td><div class="cell">${rangeBar(l.wLo, l.wHi, l.wMed, l.n, W_MIN, W_MAX, color, false)}`
            + `<span class="figs"><em>${f1(l.wMed)}${t("sec")}</em>${l.n > 1 ? ` <small>${f1(l.wLo)}–${f1(l.wHi)}</small>` : ""}</span></div></td>`
            + `<td><div class="cell">${l.n > 1 ? `<div class="bar"><div class="rng" style="left:${l.shLo * 100}%;width:${Math.max((l.shHi - l.shLo) * 100, 0.8)}%;background:${color}"></div><div class="med" style="left:calc(${l.shMed * 100}% - 1px)"></div></div>` : `<div class="bar"><div class="pt" style="left:${l.shMed * 100}%;background:${color}"></div></div>`}`
            + `<span class="figs"><em>${Math.round(l.shMed * 100)}%</em>${l.n > 1 ? ` <small>${Math.round(l.shLo * 100)}–${Math.round(l.shHi * 100)}</small>` : ""}</span></div></td>`
          : `<td><span class="na" title="${esc(t("latNaTitle"))}">—</span></td><td><span class="na" title="${esc(t("latNaTitle"))}">—</span></td>`)
      + `</tr>` + (isOpen ? detailRow(m) : "");
  }).join("");

  document.getElementById("mxbody").innerHTML = body;
  fitDetails();
  document.querySelectorAll("table.mx th").forEach(th => {
    const b = th.querySelector("button");
    if (!b) return;
    if (b.dataset.sort === sortKey) { th.setAttribute("aria-sort", sortDir === 1 ? "ascending" : "descending"); b.querySelector(".dir").textContent = sortDir === 1 ? "↑" : "↓"; }
    else th.removeAttribute("aria-sort");
  });
}

function scales() {
  const put = (sel, marks) => {
    const el = document.querySelector(`.scale[data-scale="${sel}"]`);
    if (el) el.innerHTML = marks.map(([label, pct]) => `<span style="left:${pct}%">${label}</span>`).join("");
  };
  const mt = t("minTick");
  put("time", [["1.5", 0], ["10", lg(10, T_MIN, T_MAX)], ["30", lg(30, T_MIN, T_MAX)], ["260 " + mt, 100]]);
  put("spread", [["1.0×", 0], ["2×", 33.3], ["3×", 66.7], ["4×", 100]]);
  const cm = document.querySelector('.scale[data-scale="commits"]');
  if (cm) cm.innerHTML = `<span style="left:0">${t("commitsScale")}</span>`;
  put("cost", [["$0.03", 0], ["$0.5", lg(0.5, U_MIN, U_MAX)], ["$20", 100]]);
  put("wait", [["2" + t("sec"), 0], ["10", lg(10, W_MIN, W_MAX)], ["60" + t("sec"), 100]]);
  put("share", [["0%", 0], ["50", 50], ["100%", 100]]);
  put("output", [["10K", 0], ["30", lg(30, O_MIN, O_MAX)], ["100", lg(100, O_MIN, O_MAX)], ["260K", 100]]);
}

/* ───────────────────────── cards / raw / notes ───────────────────────── */
const NAMES = { dsflash:"DeepSeek V4.1-Flash", dspro:"DeepSeek V4-Pro", sol:"gpt-5.6-sol", astra:"gpt-6-astra", sol6:"gpt-6-sol", luna6:"gpt-6-luna", kimi:"kimi-k3", opus55:"Opus 5.5", opus48:"Opus 4.8", fable:"Fable 5.1", opus5:"Opus 5", sonnet5:"Sonnet 5", sonnet55:"Sonnet 5.5", qwen:"qwen3.8-max", piflash:"pi × DeepSeek V4.1-Flash", pikimi:"pi × kimi-k3", piqwen:"pi × qwen3.8-max", piopus:"pi × Opus 5.5", pisonnet55:"pi × Sonnet 5.5", pisol:"pi × gpt-6-sol", sol61:"gpt-6.1-sol", pisol61:"pi × gpt-6.1-sol", gemflash:"gemini-3.8-flash", pigemflash:"pi × gemini-3.8-flash", open2:"Solar Open 2", pro4:"Solar Pro 4" };

function renderCards() {
  const cards = t("cards");
  document.getElementById("cards").innerHTML = CARDS.map(c => {
    const d = cards[c.key];
    return `<article class="card">
      <h3><span class="swatch" style="background:var(--${c.stack})"></span>${NAMES[c.key]}${c.preview ? ` <span class="pv">PREVIEW API</span>` : ""}</h3>
      <p class="exp">${d.exp}</p>
      <ul>${d.li.map(x => `<li>${x}</li>`).join("")}</ul>
      ${d.cav ? `<p class="cav">${d.cav}</p>` : ""}
    </article>`;
  }).join("");
}

/* raw-table latency cells: ranges over the EN runs of this experiment row; "—" when not measured (KO rows etc.) */
function rawLat(model, exp, pl) {
  const ids = exp.split("/").map((x, i) => i === 0 ? x : "EXP-" + x);
  const a = ((LAT[model] || []).filter(r => ids.includes(r[0])));
  const rng = (i, d) => { const v = a.map(r => r[i]); return lo(v) === hi(v) ? v[0].toFixed(d) : `${lo(v).toFixed(d)}–${hi(v).toFixed(d)}`; };
  if (!a.length || pl !== "EN") return `<td class="n">—</td><td class="n">—</td><td class="n">—</td><td class="n">—</td>`;
  return `<td class="n">${rng(1, 0)}</td><td class="n">${rng(2, 0)}</td><td class="n">${rng(3, 0)}</td><td class="n">${rng(5, 0)}</td>`;
}
function renderRaw() {
  document.getElementById("rawhead").innerHTML = t("rawHead").map(h => `<th>${h}</th>`).join("");
  const notes = t("rawNotes"), min = t("min");
  const cond = { native: t("condNative"), direct: t("condDirect"), codex: t("condCodex"), pi: t("condPi"), agy: t("condAgy") };
  const span = {}; RAW.forEach(r => { span[r[0]] = (span[r[0]] || 0) + 1; });
  const seen = {};
  document.getElementById("rawbody").innerHTML = RAW.map(r => {
    const [model, exp, stack, pl, n, done, iter, tlo, thi, commits, out, nk] = r;
    let first = "";
    if (!seen[model]) { seen[model] = true; first = `<td${span[model] > 1 ? ` rowspan="${span[model]}"` : ""} class="g">${model}</td>`; }
    const lt = rawLat(model, exp, pl);
    const time = tlo === "58m15s" ? t("t58") : `${tlo}–${thi}${min}`;
    return `<tr>${first}<td class="n">${exp}</td><td>${cond[stack]} · ${pl}</td><td class="n">${esc(clientText(exp, stack, t))}</td><td class="n">${n}</td><td class="n">${done === "one" ? t("doneOne") : done}</td><td class="n">${iter}</td><td class="n">${time}</td><td class="n">${commits}</td><td class="n">${out}</td>${lt}<td>${notes[nk]}</td></tr>`;
  }).join("");
  /* keep numeric ranges on one line (word joiners around the en dash); cells may still wrap before the unit */
  document.querySelectorAll("#rawbody td.n").forEach(td => { td.innerHTML = td.innerHTML.replace(/\u2013/g, "\u2060\u2013\u2060"); });
}

function renderNotes() {
  document.getElementById("notesBody").innerHTML = t("notes").map(([h, p]) => (h ? `<h4>${h}</h4>` : "") + `<p>${p}</p>`).join("");
  document.getElementById("howList").innerHTML = t("howItems").concat([t("howLat")]).map(x => `<li>${x}</li>`).join("");
  document.getElementById("cavList").innerHTML = t("cavs").concat([t("cavLat")]).map(x => `<li>${x}</li>`).join("");
}

/* ───────────────────────── events ───────────────────────── */
document.getElementById("mxbody").addEventListener("click", ev => {
  const tr = ev.target.closest("tr.row");
  if (!tr || ev.target.closest("tr.dt")) return;
  const k = tr.dataset.key;
  if (openRows.has(k)) openRows.delete(k); else openRows.add(k);
  render();
});
window.addEventListener("resize", fitDetails);
document.querySelectorAll("table.mx th button").forEach(b => {
  b.addEventListener("click", () => {
    const k = b.dataset.sort;
    if (sortKey === k) sortDir *= -1; else { sortKey = k; sortDir = 1; }
    render();
  });
});
document.querySelectorAll(".seg button").forEach(b => {
  b.addEventListener("click", () => {
    plang = b.dataset.plang;
    document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.plang === plang)));
    document.getElementById("langhint").textContent = plang === "en" ? t("hintEn") : t("hintKo");
    render();
  });
});
document.querySelectorAll(".langs button").forEach(b => {
  b.addEventListener("click", () => setLang(b.dataset.lang, true));
});

setLang(detectLang(), false);
</script>
