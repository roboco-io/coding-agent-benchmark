<style>
:root{
  --ground:#EDF0F4; --surface:#FBFCFE; --sunk:#E4E8EE;
  --ink:#131A24; --ink-2:#3C4757; --muted:#5B6879; --faint:#8B97A6;
  --line:#DCE2EA; --hair:#E9EDF2; --track:#DFE4EB;
  --native:#3E63DD; --direct:#0E9384; --codex:#C4551A;
  --flag:#8A6A1E; --flag-bg:#F4EEDD;
  --focus:#3E63DD;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0E1116; --surface:#14181F; --sunk:#191E26;
  --ink:#E3E9F1; --ink-2:#B8C2CF; --muted:#8C97A7; --faint:#6B7686;
  --line:#252C36; --hair:#1E242C; --track:#252C36;
  --native:#6E8BF5; --direct:#1FA189; --codex:#D0722F;
  --flag:#C9A85C; --flag-bg:#221E14;
  --focus:#6E8BF5;
}}
:root[data-theme="dark"]{
  --ground:#0E1116; --surface:#14181F; --sunk:#191E26;
  --ink:#E3E9F1; --ink-2:#B8C2CF; --muted:#8C97A7; --faint:#6B7686;
  --line:#252C36; --hair:#1E242C; --track:#252C36;
  --native:#6E8BF5; --direct:#1FA189; --codex:#D0722F;
  --flag:#C9A85C; --flag-bg:#221E14;
  --focus:#6E8BF5;
}

*{box-sizing:border-box}
body{
  background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-weight:400; line-height:1.6; letter-spacing:-.005em;
  margin:0; padding-block:clamp(28px,5vw,56px); padding-left:20px; padding-right:20px;
}
html[lang="ja"] body{font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",-apple-system,BlinkMacSystemFont,sans-serif; letter-spacing:0;}
html[lang="zh-CN"] body{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,sans-serif; letter-spacing:0;}
html[lang="en"] body{font-family:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
.wrap{max-width:1120px; margin:0 auto; display:flex; flex-direction:column; gap:clamp(28px,4vw,44px);}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; font-variant-numeric:tabular-nums;}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:.68rem; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); margin:0;}
a{color:var(--native); text-underline-offset:3px; text-decoration-thickness:1px;}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:2px;}

/* ── header ───────────────────────────── */
header{display:flex; flex-direction:column; gap:14px;}
.topbar{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; justify-content:space-between;}
.langs{display:inline-flex; border:1px solid var(--line); border-radius:2px; overflow:hidden; background:var(--sunk);}
.langs button{font:inherit; font-size:.74rem; font-weight:500; padding:5px 11px; border:none; background:transparent; color:var(--muted); cursor:pointer; white-space:nowrap;}
.langs button[aria-pressed="true"]{background:var(--ink); color:var(--surface);}
h1{font-size:clamp(1.6rem,4.4vw,2.3rem); font-weight:700; letter-spacing:-.03em; margin:0; text-wrap:balance; line-height:1.2;}
html[lang="ja"] h1, html[lang="zh-CN"] h1{letter-spacing:-.01em;}
.deck{color:var(--ink-2); margin:0; font-size:.95rem; max-width:64ch;}
.deck b{font-weight:600; color:var(--ink);}
.meta{display:flex; flex-wrap:wrap; gap:6px 18px; font-size:.78rem; color:var(--muted);}
.meta span{display:inline-flex; gap:6px; align-items:baseline;}
.flagnote{display:flex; gap:10px; align-items:flex-start; font-size:.82rem; color:var(--ink-2);
  background:var(--flag-bg); border:1px solid color-mix(in srgb,var(--flag) 26%,transparent);
  padding:11px 14px; border-radius:2px; max-width:78ch;}
.flagnote::before{content:"⚑"; color:var(--flag); font-size:.9rem; line-height:1.5;}

/* ── readout strip ────────────────────── */
.readout{display:flex; flex-wrap:wrap; gap:0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); background:var(--surface);}
.readout div{flex:1 1 140px; padding:14px 18px; border-right:1px solid var(--hair);}
.readout div:last-child{border-right:none;}
.readout b{display:block; font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-size:1.45rem; font-weight:500; letter-spacing:-.02em; line-height:1.15;}
.readout span{font-size:.72rem; color:var(--muted); letter-spacing:.02em;}

/* ── panel ────────────────────────────── */
.panel{background:var(--surface); border:1px solid var(--line); border-radius:3px; padding:clamp(18px,3vw,26px);}
.panel-head{display:flex; flex-wrap:wrap; gap:12px 20px; align-items:flex-end; justify-content:space-between; margin-bottom:6px;}
h2{font-size:1.12rem; font-weight:600; letter-spacing:-.02em; margin:0;}
.sub{color:var(--muted); font-size:.82rem; margin:6px 0 0; max-width:76ch;}

/* ── controls ─────────────────────────── */
.controls{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:18px 0 12px;}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:2px; overflow:hidden; background:var(--sunk);}
.seg button{font:inherit; font-size:.78rem; font-weight:500; padding:6px 15px; border:none; background:transparent; color:var(--muted); cursor:pointer;}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--surface);}
.hint{font-size:.74rem; color:var(--faint);}
.legend{display:flex; flex-wrap:wrap; gap:8px 16px; font-size:.74rem; color:var(--muted); align-items:center;}
.legend i{display:inline-block; width:10px; height:10px; border-radius:1px; margin-right:6px; vertical-align:-1px;}
.legend i.out{background:transparent; border:1.5px solid var(--muted);}

/* ── matrix ───────────────────────────── */
.scroller{overflow-x:auto; margin-top:4px;}
table.mx{border-collapse:collapse; width:100%; min-width:940px;}
table.mx th{text-align:left; vertical-align:bottom; padding:0 12px 8px 0; border-bottom:1px solid var(--line);}
table.mx th button{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:.68rem; letter-spacing:.12em; text-transform:uppercase;
  color:var(--muted); background:none; border:none; padding:0; cursor:pointer; display:inline-flex; gap:5px; align-items:center;}
html[lang="ja"] table.mx th button, html[lang="zh-CN"] table.mx th button, html[lang="ko"] table.mx th button{font-family:inherit; letter-spacing:.04em; font-size:.72rem;}
table.mx th button:hover{color:var(--ink);}
table.mx th button .dir{font-size:.7rem; opacity:0; }
table.mx th[aria-sort] button{color:var(--ink); font-weight:600;}
table.mx th[aria-sort] button .dir{opacity:1;}
.scale{margin-top:7px; height:11px; position:relative; overflow:hidden; font-family:"IBM Plex Mono",monospace; font-size:.6rem; color:var(--faint); letter-spacing:0; font-weight:400; text-transform:none;}
.scale span{position:absolute; top:0; transform:translateX(-50%); white-space:nowrap;}
.scale span:first-child{transform:none;}
.scale span:last-child{transform:translateX(-100%);}
.scale span:only-child{transform:none;}
table.mx td{padding:11px 12px 11px 0; border-bottom:1px solid var(--hair); vertical-align:middle;}
table.mx tbody tr:hover{background:var(--sunk);}
table.mx tbody tr.dim td{opacity:.42;}

.mdl{display:flex; flex-direction:column; gap:3px; min-width:172px;}
.mdl .nm{font-weight:600; font-size:.92rem; letter-spacing:-.01em; display:flex; align-items:center; gap:7px;}
.swatch{width:9px; height:9px; border-radius:1px; flex:none;}
.mdl .st{font-family:"IBM Plex Mono",monospace; font-size:.66rem; color:var(--muted); letter-spacing:.02em; padding-left:16px;}
.pv{font-family:"IBM Plex Mono",monospace; font-size:.6rem; letter-spacing:.06em; color:var(--flag);
  border:1px solid color-mix(in srgb,var(--flag) 40%,transparent); border-radius:2px; padding:0 4px; white-space:nowrap;}
.done{font-family:"IBM Plex Mono",monospace; font-size:.8rem; white-space:nowrap;}
.done small{display:block; font-size:.64rem; color:var(--muted); letter-spacing:.02em; font-family:"IBM Plex Mono",monospace;}

.cell{display:flex; flex-direction:column; gap:5px; min-width:150px;}
.bar{position:relative; height:13px; background:var(--track); border-radius:1px;}
.bar .rng{position:absolute; top:0; height:13px; border-radius:1px; min-width:3px;}
.bar .rng.out{background:transparent!important; border:1.5px solid currentColor;}
.bar .med{position:absolute; top:-2px; width:2px; height:17px; background:var(--ink); border-radius:1px;}
.bar .pt{position:absolute; top:1px; width:11px; height:11px; border-radius:50%; transform:translateX(-5.5px);}
.figs{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-size:.76rem; white-space:nowrap; letter-spacing:-.01em;}
.figs em{font-style:normal; font-weight:600;}
.figs small{color:var(--muted); font-size:.92em;}
.na{font-family:"IBM Plex Mono",monospace; font-size:.75rem; color:var(--faint);}

.dots{display:flex; gap:3px; align-items:center; min-width:96px;}
.dots i{width:7px; height:7px; border-radius:50%; background:var(--track); flex:none;}
.dots i.on{background:currentColor;}

.callout{margin-top:20px; display:grid; grid-template-columns:auto 1fr; gap:14px; align-items:start;
  border-top:2px solid var(--ink); padding-top:14px;}
.callout .eyebrow{white-space:nowrap; padding-top:3px;}
.callout p{margin:0; font-size:.87rem; color:var(--ink-2); max-width:80ch;}
.callout p b{color:var(--ink); font-weight:600;}
.callout p + p{margin-top:8px;}

/* ── cards ────────────────────────────── */
.cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(310px,1fr)); gap:14px;}
.card{background:var(--surface); border:1px solid var(--line); border-radius:3px; padding:18px 20px 20px; display:flex; flex-direction:column; gap:9px;}
.card h3{margin:0; font-size:.98rem; font-weight:600; letter-spacing:-.015em; display:flex; align-items:center; gap:7px; flex-wrap:wrap;}
.card .exp{font-family:"IBM Plex Mono",monospace; font-size:.66rem; color:var(--faint); letter-spacing:.04em; margin:0;}
.card ul{margin:0; padding-left:15px; display:flex; flex-direction:column; gap:6px;}
.card li{font-size:.83rem; color:var(--ink-2); line-height:1.55;}
.card li b{color:var(--ink); font-weight:600;}
.card .cav{margin:2px 0 0; font-size:.73rem; color:var(--muted); padding-top:9px; border-top:1px dotted var(--line);}

/* ── drawers ──────────────────────────── */
details{background:var(--surface); border:1px solid var(--line); border-radius:3px;}
details + details{margin-top:10px;}
summary{cursor:pointer; padding:15px 20px; font-weight:600; font-size:.92rem; letter-spacing:-.015em; display:flex; gap:10px; align-items:baseline; list-style:none;}
summary::-webkit-details-marker{display:none}
summary::before{content:"+"; font-family:"IBM Plex Mono",monospace; color:var(--faint); font-weight:400;}
details[open] summary::before{content:"–";}
summary small{font-weight:400; color:var(--muted); font-size:.76rem;}
.body{padding:0 20px 20px; display:flex; flex-direction:column; gap:12px;}
.body p, .body li{font-size:.84rem; color:var(--ink-2); max-width:82ch; margin:0; line-height:1.62;}
.body h4{margin:8px 0 0; font-size:.85rem; font-weight:600; color:var(--ink);}
.body ul{margin:0; padding-left:17px; display:flex; flex-direction:column; gap:7px;}
table.raw{border-collapse:collapse; width:100%; min-width:840px; font-size:.78rem;}
table.raw th{font-family:"IBM Plex Mono",monospace; font-size:.63rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); text-align:left; font-weight:500; padding:7px 10px 7px 0; border-bottom:1px solid var(--line);}
html[lang="ja"] table.raw th, html[lang="zh-CN"] table.raw th, html[lang="ko"] table.raw th{font-family:inherit; letter-spacing:.04em; font-size:.68rem;}
table.raw td{padding:7px 10px 7px 0; border-bottom:1px solid var(--hair); vertical-align:top;}
table.raw td.n{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; white-space:nowrap;}
table.raw td.g{font-weight:600;}

footer{font-size:.75rem; color:var(--faint); border-top:1px solid var(--line); padding-top:16px;}

@media (max-width:640px){
  .readout div{flex-basis:50%;}
  .callout{grid-template-columns:1fr; gap:6px;}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>

  koMissing:"KO 조건 미실험 — ", noteAstra:"GPT-6 세대 신규", noteFable:"Claude 5 상위 모델 신규", notePreview:"엔드포인트 회수/신규 모델",
  n1na:"n=1 · 판단 불가", span:"폭 {x}분", n1:"n=1", singleRun:"단일 run", sameAll:"전 run 동일",
  howEyebrow:"읽는 법",
  how1:"세로로 훑으면 각 지표의 순위가, 가로로 훑으면 한 모델의 성격이 보인다. <b>시간 열</b>에서 상위 10개 모델은 4–23분 한 뭉치로 모여 있고 Solar 계열만 자릿수가 다르다(58분 · 119–258분) — 단 그 차이는 프리뷰 인프라와 교락된 값이다. <b>변동 열</b>이 길수록 \"이번 run이 어떻게 나올지 모르는\" 모델이다(kimi 2.8배 vs qwen 1.07배). <b>커밋 열</b>은 능력이 아니라 스타일 — 전부를 한 번에 몰아 커밋하는 Opus 4.8(중앙값 1)과 잘게 쪼개는 Opus 5(6)가 같은 프롬프트에서 정반대로 갈린다. 최속 자리는 Claude Code 네이티브의 Opus 5.5(EN 중앙값 4.2분, KO 4.0분)이며, 직결의 DeepSeek V4.1-Flash(4.8분)가 바로 뒤에 있다. <b>output 열</b>에서는 Claude 5 세대 상위 모델 Fable 5.1(31.1K)이 Opus 5(47.0K)가 아닌 Opus 4.8(32.1K) 옆에 선다 — 산출량 확대는 세대가 아닌 Opus 5 고유 프로파일이다. Opus 5.5는 그보다도 낮다(약 20K). <b>비용 열</b>은 run별 토큰을 공개 단가로 환산한 값이다 — DeepSeek V4.1-Flash가 가장 싸고(중앙값 $0.09), Opus 5.5($1.25)는 Opus 5($5.76)의 약 1/5이며 Opus 4.8·Fable 5.1보다도 싸다. 속도 순위와 비용 순위는 같지 않다.",
  how2:"KO 토글은 프롬프트 정본만 한국어로 반전한 조건이다(전 산출물 한국어 지시, EXP-017/019). <b>8개 모델 전부 완주율에 영향이 없었고</b>, EN과 분포가 겹치지 않을 만큼 느려진 것은 qwen 하나뿐이다 — 실행 시점이 달라 언어 효과로 단정하지는 않는다.",
  cardsEyebrow:"모델 프로파일 · 수치 뒤의 성격",
  cards:{
    dsflash:{ exp:"직결 · DeepSeek · EXP-025 (EN · KO) · V4.1-Flash, 2026-09-10 출시", li:["<b>직결 최속</b> — EN 중앙값 4.8분(4.6–6.0)으로 Codex의 gpt-5.6-sol보다 아래, Opus 5.5(4.2분) 다음. EN·KO 합쳐 6/6 iteration 1 완주, 서빙 장애 0건.","<b>압도적으로 저렴</b> — 공개 단가 기준 run당 약 $0.08–0.12(캐시 히트 입력 $0.006/M), V4-Pro의 1/5 수준.","<b>편집기형 궤적</b> — 다른 직결 모델이 Bash에 기대는 것과 달리 Read/Write/Edit를 고루 사용. KO에서도 커밋·README 전수 한국어."], cav:"API 종량(구독 아님). 비용은 usage×공개 단가 추정치. DeepSeek는 cache_read만 계상하고 cache_creation 필드는 0." },
    dspro:{ exp:"직결 · DeepSeek · EXP-025 (EN · KO) · V4-Pro-0813", li:["6/6 iteration 1 완주이나 <b>Flash 대비 2.5–3배 느림</b>(EN 12.1–15.8분, KO 13.4–13.7분), output은 Solar를 제외한 jsonl 계측 내 최다(59.6–69.6K).","<b>표 전체에서 KO 변동 최소</b> — KO 3 run이 0.4분 안에 몰리고 커밋 4/4/4.","문서상 V4-Pro가 Flash로 라우팅될 수 있다는 공지가 있었으나 6 run 전 응답이 <span class=\"mono\">deepseek-v4-pro</span>로 기록 — 모델 유지 확인."], cav:"공개 단가 기준 run당 약 $0.42–0.57. Flash보다 구형 빌드(08-13 vs 09-10) — 같은 제공자 안의 세대 교락." },
    sol:{ exp:"Codex CLI · EXP-011/016 (EN) · EXP-019 (KO)", li:["<b>Codex 스택 최속</b>(중앙값 5.8분), DeepSeek Flash·Opus 5.5 이전까지는 전 조건 최속. 완주 run 중 <b>유일한 iteration 2 완주</b>(sol-2)도 이 모델이다.","영어권 모델인데 KO 조건에서 커밋·README <b>전수 한국어, 언어 이탈 0건</b>."], cav:"하네스가 Codex CLI라 시간 절대 비교는 참고치. output은 rollout 누계." },
    astra:{ exp:"Codex CLI · EXP-021 (EN) · GPT-6 세대 첫 검증", li:["출시 6일차 모델이 3/3 iteration 1 완주, 서빙 스톨·5xx 0건. 범위 폭 0.5분으로 <b>변동 최소급</b>.","<b>전작 sol 대비 +23–32% 시간</b> — 공식 \"1.9배 고속\" 수치는 이 하네스에서 재현되지 않았다.","OpenAI는 Anthropic 호환 엔드포인트가 없어 <b>Codex CLI가 유일한 정합 경로</b>. 하네스는 모델 ID 1요소만 치환했다."], cav:"인증이 ChatGPT 플랜 OAuth(종량 API 아님) — 토큰 기록은 동일, 달러 환산만 불가." },
    kimi:{ exp:"직결 · Moonshot · EXP-014/016 (EN) · EXP-017 (KO)", li:["<b>run 간 변동 최대</b> — 7.6–21.3분(2.8배), 커밋도 1–4로 run마다 다르다. <b>중앙값만 보면 오판한다.</b>","<b>압축형 output</b> — jsonl 계측 내 최소(14.4K)로 같은 게이트를 통과. 산출량과 결과 품질은 별개다."], cav:"thinking 끄기 불가(기본 ON). cache_create 0인데 cache_read 적중 — Moonshot의 캐시 계상 방식 차이." },
    opus55:{ exp:"네이티브 · EXP-026 (EN · KO) · 2026-09 신규 모델", li:["<b>전 조건 최속</b> — 6 run 중 5개가 4.0–4.2분(EN 중앙값 4.2, KO 4.0). en-1은 자체 e2e 스크립트의 포트 충돌을 디버깅하느라 8.4분. 6/6 iteration 1 완주.","<b>네이티브 최저 output</b>(18.6–28.2K, 대부분 약 20K) — Fable 5.1·Opus 4.8보다 아래이고 Opus 5 확대 프로파일과는 거리가 멀다. 커밋 1–6.","<b>Bash 단일 도구 궤적</b> — MCP·Skill·서브에이전트가 노출돼 있었지만 호출 0건. EN run은 글로벌 한국어 응답 설정에도 영어로 답했고, KO는 커밋·README 전수 한국어."], cav:"다른 네이티브 기준선과 같은 비격리 조건이나 수 주 뒤 Claude Code 2.1.280으로 실행 — 속도 선두는 관측값이며 우위 확정이 아니다." },
    opus48:{ exp:"네이티브 · EXP-010 (EN) · EXP-019 (KO)", li:["<b>최속급이면서 가장 안정적</b> — 6 run 전부 7.1–8.7분, KO 반전에도 중앙값이 8.3분으로 동일하다.","<b>몰아치기 커밋</b>(중앙값 1) — 전체를 한 번에 구현하고 끝낸다. KO는 3 run 모두 커밋 1."], cav:"" },
    fable:{ exp:"네이티브 · EXP-023 (EN) · Claude 5 세대 상위 모델", li:["<b>Opus 5.5 이전 네이티브 최속</b>(6.2–7.8분, 중앙값 6.9분) — Opus 4.8 하한(7.8분)보다도 아래. 3/3 iteration 1 완주, rate limit·서빙 장애 0건.","<b>output은 Opus 4.8 수준</b>(28.7–35.8K) — Opus 5의 확대 프로파일(41–48K)과 분포가 겹치지 않는다. 커밋 2–4로 두 Opus 사이.","<b>Bash 단일 도구 궤적</b> — 3 run 합계 Bash 71회에 Write 2회, Read/Edit 0회."], cav:"비격리 조건(글로벌 MCP·언어 설정 노출) — 기준선 EXP-009/010과 같은 조건이나 시점 차 7주." },
    opus5:{ exp:"네이티브 · EXP-009/010 (EN n=6) · EXP-019 (KO)", li:["<b>산출량 확대 프로파일</b> — jsonl 계측 내 최다(47.0K)로, Opus 4.8과 분포가 겹치지 않는다.","<b>잘게 이행하는 커밋 규율</b>(중앙값 6) — 같은 프롬프트에서 4.8과 정반대 스타일. KO에서는 오히려 변동이 줄었다."], cav:"" },
    qwen:{ exp:"직결 · DashScope · EXP-013/016 (EN) · EXP-017 (KO)", li:["<b>가장 예측 가능한 모델</b> — EN 범위 폭 1.0분, KO도 1.2분. 변동이 사실상 없다.","직결 이식 <b>트러블슈팅 0건</b> — env 3요소 치환만으로 완주(직결 표준의 근거 사례).","<b>5모델 중 유일하게 KO에서 분포 비겹침으로 느려짐</b>(15.1→22.8분). 방향성만 기록한다."], cav:"" },
    open2:{ exp:"직결 · Upstage · EXP-015 (EN n=1)", li:["최속 대역과 <b>자릿수가 다른 소요 시간</b>(58분 15초), thinking 비중이 큰 output 프로파일(252.3K).","정당한 iteration 2 완주를 게이트가 오검 기각(포트 탐지 결함) — measure v4 수정 후 재채점 2회 일치로 완주 확정."], cav:"시험 운영 종료로 2026-08-05 엔드포인트 회수 — n=1이 마지막 기록이며 확충 불가. 계보는 Solar Pro 4로 승계." },
    pro4:{ exp:"직결 · Upstage · EXP-020 (EN n=3)", li:["<b>전 조건 최장</b>(유효 119–258분). 원인은 세션 로그 분해로 특정 — <b>캐시 미지원 × 왕복 평균 37초 × thinking 88%</b>의 곱.","완주 자체는 3/3. 느린 것은 프리뷰 인프라의 서빙·캐시 특성이지 능력 결함이 아니다.","pro4-1은 게이트 오검(무관 npm 패키지의 shim이 채점 바이너리를 가림)으로 정당 신고 9회 기각 — 소급 재채점으로 유효 완주 확정."], cav:"Upstage 엔드포인트는 usage에 캐시 필드를 계상하지 않는다 — input 전량이 비캐시로 잡힘." }

  rawTitle:"실험 단위 원 수치", rawSmall:"21 조건 · 61 run",
  rawIntro:"모든 완주 행은 게이트(또는 직접 재채점) + 독립 재검증 2회의 3중 확인을 거쳤다. 시간은 wall-clock, output은 조건 내 비교만 유효하다.",

  rawNotes:{ r1:"동시점 교차 A/B", r2:"전수 한국어 · EN 분포와 겹침", r3:"EN 프롬프트 정본 확립", r4:"산출량 확대 프로파일", r6:"Claude 5 상위 모델 · output은 4.8 수준", r16:"직결 최속 · 최저 비용 · Read/Write/Edit 궤적", r17:"전수 한국어", r20:"전 조건 최속(중앙값 4.2분) · 네이티브 최저 output", r21:"전수 한국어 · KO 조건 최속(3.95–4.22분)", r18:"모델 유지 확인(전 응답 v4-pro) · Flash 대비 2.5–3배", r19:"전수 한국어 · 변동 최소(0.4분)", r7:"M축 최단 · sol-2만 iter 2", r8:"영어권 모델도 전수 한국어", r9:"GPT-6 첫 검증 · 오검 0건 · sol 대비 +23–32%", r10:"트러블슈팅 0 · 변동 최소", r11:"전수 한국어 · EN과 분포 비겹침", r12:"run 간 변동 최대 (2.8배)", r13:"전수 한국어 (feat: 접두어 1건)", r14:"게이트 오검 1건 · measure v4로 수정", r15:"전 조건 최장 · pro4-1 오검으로 루프 연장, 소급 확정" },
  notesTitle:"조사 노트", notesSmall:"ccr 제외 사유 · 게이트 오검 3건 · 정정 이력",
  notes:[
    ["① ccr(변환 프록시)은 왜 비교에서 빠졌나","ccr(claude-code-router)은 Claude Code의 Anthropic 방언을 OpenAI 방언으로 실시간 이중 번역한다. 실증된 결함: <b>tool call 인자 훼손</b>(EXP-006 — SSE 멀티 델타 중 첫 요소만 처리해 <span class=\"mono\">python3→3</span>), <b>usage 계측 유실</b>(EXP-012), 모델별 커스텀 transformer 필수, 스트림 스톨·컨텍스트 한도 미조정 크래시. 반면 제공자 공식 Anthropic 호환 직결(Upstage·DashScope·Moonshot 실측)은 트러블슈팅 0건. <b>금지 근거는 속도가 아니라 실패 모드와 계측 왜곡이다</b> — 속도 저하는 모델 교락으로 입증되지 않았다. 호환 엔드포인트가 아예 없는 OpenAI는 자사 공식 하네스(Codex CLI)로 연결한다. EXP-005/006/012의 원 데이터·report는 리포지토리에 보존돼 있다."],
    ["② 채점 게이트도 오검한다","정당한 완주를 게이트가 기각한 사례 3건 — EXP-010 48-1(채점 파일 미복사), EXP-015 iter 2(<span class=\"mono\">npx tsx</span> 실행 시 프로세스 command line에 리포 경로가 없어 포트 탐지 실패 → 프로세스 CWD 판정을 추가한 measure v4로 수정), EXP-020 pro4-1(실험 11일 전 설치된 무관 npm 패키지 <span class=\"mono\">@hurl/cli</span>의 shim이 진짜 Hurl 8.0.1을 PATH에서 가려 정당 신고 9회 연속 기각). 교훈: <b>기각 판정은 채점기 로그 부검 후에만 확정하고, 채점기의 외부 의존(바이너리 경로)도 격리 대상이다.</b> 절대 경로 고정을 처음부터 적용한 EXP-021은 3 run 연속 오검 0건."],

/* ───────────────────────── i18n plumbing ───────────────────────── */
const LANGS = ["en","ko","ja","zh"];
let lang = "en";
const t = k => (T[lang] && T[lang][k] != null) ? T[lang][k] : T.en[k];

function detectLang() {
  try {
    const q = new URLSearchParams(location.search).get("lang");
    if (q && LANGS.includes(q)) return q;
  } catch (e) {}
  try {
    const s = localStorage.getItem("dash-lang");
    if (s && LANGS.includes(s)) return s;
  } catch (e) {}
  try {
    const navs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""];
    for (const n of navs) {
      const p = String(n).toLowerCase().split("-")[0];
      if (p === "ko" || p === "ja" || p === "zh") return p;
      if (p === "en") return "en";
    }
  } catch (e) {}
  return "en";
}

function setLang(l, persist) {
  lang = LANGS.includes(l) ? l : "en";
  document.documentElement.setAttribute("lang", t("htmlLang"));
  document.title = t("title");
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  if (persist) { try { localStorage.setItem("dash-lang", lang); } catch (e) {} }
  applyStatic();
  scales();
  render();
  renderCards();
  renderRaw();
  renderNotes();
}

function applyStatic() {
  document.querySelectorAll("[data-i18n]").forEach(el => { el.innerHTML = t(el.dataset.i18n); });
  document.getElementById("langhint").textContent = plang === "en" ? t("hintEn") : t("hintKo");
}

/* ───────────────────────── matrix ───────────────────────── */
const U_MIN = 0.05, U_MAX = 20, T_MIN = 3.5, T_MAX = 260, O_MIN = 10, O_MAX = 260, S_MAX = 3, C_MAX = 8;
const lg = (v, lo, hi) => Math.max(0, Math.min(100, (Math.log10(v) - Math.log10(lo)) / (Math.log10(hi) - Math.log10(lo)) * 100));
const med = a => { const s = [...a].sort((x, y) => x - y), h = s.length >> 1; return s.length % 2 ? s[h] : (s[h - 1] + s[h]) / 2; };
const lo = a => Math.min(...a), hi = a => Math.max(...a);
const f1 = v => (Math.round(v * 10) / 10).toFixed(1);
const usd = v => v < 1 ? v.toFixed(2) : v < 10 ? v.toFixed(1) : Math.round(v).toString();

let plang = "en", sortKey = "time", sortDir = 1;

function stackLabel(m) {
  if (m.stack === "native") return t("stNative");
  if (m.stack === "codex") return t("stCodex");
  return t("stDirect") + " · " + m.provider;
}

function stats(d) {
  if (!d) return null;
  return { tMed: med(d.t), tLo: lo(d.t), tHi: hi(d.t), n: d.t.length,
           spread: lo(d.t) > 0 ? hi(d.t) / lo(d.t) : 1,
           cMed: med(d.c), cLo: lo(d.c), cHi: hi(d.c),
           oMed: med(d.o), oLo: lo(d.o), oHi: hi(d.o), done: d.done, iter: t(d.iter), exp: d.exp,
           usd: (d.usd || []).filter(v => v != null) };
}

function rangeBar(loV, hiV, medV, n, scaleLo, scaleHi, color, outlined) {
  if (n === 1) {
    return `<div class="bar"><div class="pt" style="left:${lg(medV, scaleLo, scaleHi)}%;background:${color}"></div></div>`;
  }
  const a = lg(loV, scaleLo, scaleHi), b = lg(hiV, scaleLo, scaleHi);
  const fill = outlined ? `color:${color}` : `background:${color}`;
  return `<div class="bar"><div class="rng${outlined ? " out" : ""}" style="left:${a}%;width:${Math.max(b - a, 0.8)}%;${fill}"></div>`
       + `<div class="med" style="left:calc(${lg(medV, scaleLo, scaleHi)}% - 1px)"></div></div>`;
}

function linBar(v, max, color) {
  return `<div class="bar"><div class="rng" style="left:0;width:${Math.max(v / max * 100, 1)}%;background:${color}"></div></div>`;
}

function dots(medV, color) {
  let h = `<div class="dots" style="color:${color}">`;
  for (let i = 1; i <= C_MAX; i++) h += `<i class="${i <= medV ? "on" : ""}"></i>`;
  return h + "</div>";
}

function render() {
  const rows = M.map(m => ({ m, s: stats(m[plang]) }));
  const present = rows.filter(r => r.s), absent = rows.filter(r => !r.s);
  const key = {
    name: r => r.m.name.toLowerCase(),
    time: r => r.s.tMed, spread: r => r.s.spread, commits: r => r.s.cMed, output: r => r.s.oMed,
    cost: r => r.s.usd.length ? med(r.s.usd) : Infinity
  }[sortKey];
  present.sort((a, b) => { const x = key(a), y = key(b); return (x > y ? 1 : x < y ? -1 : 0) * sortDir; });
  const min = t("min");

  const body = [...present, ...absent].map(({ m, s }) => {
    const color = `var(--${m.stack})`;
    const nameCell = `<td><div class="mdl"><span class="nm"><span class="swatch" style="background:${color}"></span>${m.name}`
      + (m.preview ? ` <span class="pv">PREVIEW</span>` : "") + `</span>`
      + `<span class="st">${stackLabel(m)}${s ? " · " + s.exp : ""}${s && m[plang].iter !== "iterAll1" ? " · " + s.iter : ""}</span></div></td>`;
    if (!s) return `<tr class="dim">${nameCell}<td colspan="5"><span class="na">${t("koMissing")}${t(m.koNote || "notePreview")}</span></td></tr>`;

    const spreadTxt = s.n === 1 ? `<span class="na">${t("n1na")}</span>`
      : `<span class="figs"><em>${f1(s.spread)}×</em> <small>${t("span").replace("{x}", f1(s.tHi - s.tLo))}</small></span>`;
    const spreadBar = s.n === 1 ? `<div class="bar"></div>` : linBar(Math.min(s.spread, S_MAX) - 1, S_MAX - 1, color);

    return `<tr>${nameCell}`
      + `<td><div class="cell">${rangeBar(s.tLo, s.tHi, s.tMed, s.n, T_MIN, T_MAX, color, false)}`
      + `<span class="figs"><em>${f1(s.tMed)}${min}</em>${s.n > 1 ? ` <small>${f1(s.tLo)}–${f1(s.tHi)}</small>` : ` <small>${t("n1")}</small>`}</span></div></td>`
      + `<td><div class="cell">${spreadBar}${spreadTxt}</div></td>`
      + `<td><div class="cell">${dots(s.cMed, color)}`
      + `<span class="figs"><em>${s.cMed}</em> <small>${s.n === 1 ? t("singleRun") : s.cLo === s.cHi ? t("sameAll") : s.cLo + "–" + s.cHi}</small></span></div></td>`
      + `<td><div class="cell">${rangeBar(s.oLo, s.oHi, s.oMed, s.n, O_MIN, O_MAX, color, m.meas === "rollout")}`
      + `<span class="figs"><em>${f1(s.oMed)}K</em> <small>${m.meas}</small></span></div></td>`
      + (s.usd.length
          ? `<td><div class="cell">${rangeBar(lo(s.usd), hi(s.usd), med(s.usd), s.usd.length, U_MIN, U_MAX, color, false)}`
            + `<span class="figs"><em>$${usd(med(s.usd))}</em>${s.usd.length > 1 ? ` <small>${usd(lo(s.usd))}–${usd(hi(s.usd))}</small>` : ""}</span></div></td>`
          : `<td><span class="na">${t("costNa")}</span></td>`)
      + `</tr>`;
  }).join("");

  document.getElementById("mxbody").innerHTML = body;
  document.querySelectorAll("table.mx th").forEach(th => {
    const b = th.querySelector("button");
    if (!b) return;
    if (b.dataset.sort === sortKey) { th.setAttribute("aria-sort", sortDir === 1 ? "ascending" : "descending"); b.querySelector(".dir").textContent = sortDir === 1 ? "↑" : "↓"; }
    else th.removeAttribute("aria-sort");
  });
}

function scales() {
  const put = (sel, marks) => {
    const el = document.querySelector(`.scale[data-scale="${sel}"]`);
    if (el) el.innerHTML = marks.map(([label, pct]) => `<span style="left:${pct}%">${label}</span>`).join("");
  };
  const mt = t("minTick");
  put("time", [["3.5", 0], ["10", lg(10, T_MIN, T_MAX)], ["30", lg(30, T_MIN, T_MAX)], ["260 " + mt, 100]]);
  put("spread", [["1.0×", 0], ["2×", 50], ["3×", 100]]);
  const cm = document.querySelector('.scale[data-scale="commits"]');
  if (cm) cm.innerHTML = `<span style="left:0">${t("commitsScale")}</span>`;
  put("cost", [["$0.05", 0], ["$0.5", lg(0.5, U_MIN, U_MAX)], ["$20", 100]]);
  put("output", [["10K", 0], ["30", lg(30, O_MIN, O_MAX)], ["100", lg(100, O_MIN, O_MAX)], ["260K", 100]]);
}

/* ───────────────────────── cards / raw / notes ───────────────────────── */
const NAMES = { dsflash:"DeepSeek V4.1-Flash", dspro:"DeepSeek V4-Pro", sol:"gpt-5.6-sol", astra:"gpt-6-astra", kimi:"kimi-k3", opus55:"Opus 5.5", opus48:"Opus 4.8", fable:"Fable 5.1", opus5:"Opus 5", qwen:"qwen3.8-max", open2:"Solar Open 2", pro4:"Solar Pro 4" };

function renderCards() {
  const cards = t("cards");
  document.getElementById("cards").innerHTML = CARDS.map(c => {
    const d = cards[c.key];
    return `<article class="card">
      <h3><span class="swatch" style="background:var(--${c.stack})"></span>${NAMES[c.key]}${c.preview ? ` <span class="pv">PREVIEW API</span>` : ""}</h3>
      <p class="exp">${d.exp}</p>
      <ul>${d.li.map(x => `<li>${x}</li>`).join("")}</ul>
      ${d.cav ? `<p class="cav">${d.cav}</p>` : ""}
    </article>`;
  }).join("");
}

function renderRaw() {
  document.getElementById("rawhead").innerHTML = t("rawHead").map(h => `<th>${h}</th>`).join("");
  const notes = t("rawNotes"), min = t("min");
  const cond = { native: t("condNative"), direct: t("condDirect"), codex: t("condCodex") };
  const span = {}; RAW.forEach(r => { span[r[0]] = (span[r[0]] || 0) + 1; });
  const seen = {};
  document.getElementById("rawbody").innerHTML = RAW.map(r => {
    const [model, exp, stack, pl, n, done, iter, tlo, thi, commits, out, nk] = r;
    let first = "";
    if (!seen[model]) { seen[model] = true; first = `<td${span[model] > 1 ? ` rowspan="${span[model]}"` : ""} class="g">${model}</td>`; }
    const time = tlo === "58m15s" ? t("t58") : `${tlo}–${thi}${min}`;
    return `<tr>${first}<td class="n">${exp}</td><td>${cond[stack]} · ${pl}</td><td class="n">${n}</td><td class="n">${done === "one" ? t("doneOne") : done}</td><td class="n">${iter}</td><td class="n">${time}</td><td class="n">${commits}</td><td class="n">${out}</td><td>${notes[nk]}</td></tr>`;
  }).join("");
}

function renderNotes() {
  document.getElementById("notesBody").innerHTML = t("notes").map(([h, p]) => (h ? `<h4>${h}</h4>` : "") + `<p>${p}</p>`).join("");
  document.getElementById("cavList").innerHTML = t("cavs").map(x => `<li>${x}</li>`).join("");
}

/* ───────────────────────── events ───────────────────────── */
document.querySelectorAll("table.mx th button").forEach(b => {
  b.addEventListener("click", () => {
    const k = b.dataset.sort;
    if (sortKey === k) sortDir *= -1; else { sortKey = k; sortDir = 1; }
    render();
  });
});
document.querySelectorAll(".seg button").forEach(b => {
  b.addEventListener("click", () => {
    plang = b.dataset.plang;
    document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.plang === plang)));
    document.getElementById("langhint").textContent = plang === "en" ? t("hintEn") : t("hintKo");
    render();
  });
});
document.querySelectorAll(".langs button").forEach(b => {
  b.addEventListener("click", () => setLang(b.dataset.lang, true));
});

setLang(detectLang(), false);
</script>
